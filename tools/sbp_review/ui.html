// 匯出圖的顏色跟互動畫布同一組：泳道底色取契約的 blueprint_lane，卡片用中性
// 的 surface／border／text token（研究者 2026-09-26 裁定，不再寫死層級色）。
const BLUEPRINT_EXPORT_LANE_TOKEN={'實體證據':'evidence','顧客行動':'customer-actions','前台行動':'frontstage-actions','後台行動':'backstage-actions','支援流程':'supporting-processes'};
function blueprintExportColors(layer){
  const tokens=(S.workbench&&S.workbench.tokens)||null;
  if(!tokens)throw new Error('工作台介面規則還沒載入，無法匯出藍圖。');
  const lane=(tokens.blueprint_lane||{})[BLUEPRINT_EXPORT_LANE_TOKEN[layer]||'evidence'];
  return {lane,fill:tokens.surface.raised,stroke:tokens.border.strong,text:tokens.text.primary};
}
// 顧客行動排是全圖視覺重量最重的一排（既有設計），底色不透明度給高一點；
// 其餘四層是淡淡一層分組提示，不能蓋過卡片自己的色或關係線。
const LANE_ROW_TINT_OPACITY={顧客行動:.16,前台行動:.12,後台行動:.12,支援流程:.12,實體證據:0};
// quantize-blueprint-card-and-gutter-geometry：換行邏輯搬進 relation_layout.js
// 的 wrapLabelLines()，這裡只是一層轉呼叫——buildBlueprintScene() 用同一個函式
// 決定卡片級距，跟這裡渲染文字用的換行結果永遠是同一份計算，不會兩邊算出不同
// 行數。
function splitBlueprintLabel(value,limit=12){
  return SBPRelationLayout.wrapLabelLines(value,limit);
}
function exportTextBlock(text,x,y,color,maxChars=12,fontSize=12,fontWeight=600){
  const lines=splitBlueprintLabel(text,maxChars),lineHeight=fontSize*1.28;
  const firstY=y-(lines.length-1)*lineHeight/2;
  return `<text x="${x}" y="${firstY}" text-anchor="middle" dominant-baseline="middle" fill="${color}" font-size="${fontSize}" font-weight="${fontWeight}" font-family="Avenir Next, Noto Sans TC, PingFang TC, sans-serif">${lines.map((line,index)=>`<tspan x="${x}" dy="${index?lineHeight:0}">${esc(line)}</tspan>`).join('')}</text>`;
}
function blueprintExportSVG(d=S.report){
  const scene=S.blueprintView.scene;if(!d||!scene)return '';
  const width=Math.ceil(scene.bounds.width),height=Math.ceil(scene.bounds.height);
  const nodeById=new Map((d.nodes||[]).map(node=>[node.id,node]));
  const lineById=new Map(scene.lines.map(line=>[line.relationId,line]));
  // 匯出跟畫布同一套畫線規則（relationStyle）：AI 推的也畫，帶契約的推論透明度。
  const colours=exportRelationColours();
  const relations=blueprintRelationsToDraw(d).map(rel=>({rel,line:lineById.get(rel.id)})).filter(item=>item.line);
  const relationPaths=relations.map(({rel,line})=>{
    const style=relationStyle(rel);
    return `<path d="${diagramPath(line.points)}" fill="none" ${exportRelationAttrs(style,colours)} ${relationMarkerAttrs('export-arrow',style)}/>`;
  }).join('');
  const relationsById=new Map(relations.map(item=>[item.rel.id,item]));
  const relationBridges=blueprintCrossingBridges(scene,relationsById,'export');
  const headers=scene.stepBands.map((band,index)=>exportTextBlock((scene.steps[index]||{}).name||`步驟 ${index+1}`,band.x+band.width/2,28,'#615d59',14,13,500)).join('');
  // blueprint-relation-visual-redesign：泳道分界不再靠一條貫穿全圖的前景線
  // 贏過關係線的視覺權重——改成整排淡色底，沿用卡片本來就有的層級色。
  const laneFills=scene.laneBands.map(band=>{
    const opacity=LANE_ROW_TINT_OPACITY[band.layer]??0;
    if(!opacity)return '';
    const color=blueprintExportColors(band.layer).lane;
    return `<rect x="0" y="${band.y}" width="${width}" height="${band.height}" fill="${color}" fill-opacity="${opacity}"/>`;
  }).join('');
  const lanes=scene.laneBands.map(band=>{
    const middle=band.y+band.height/2;
    return `<path d="M18 ${band.y} H30 M18 ${band.y} V${band.y+band.height} M18 ${band.y+band.height} H30" fill="none" stroke="#8a8580" stroke-width="1.2"/>${exportTextBlock(band.layer,104,middle,'#5e5a56',10,12,700)}`;
  }).join('');
  // Shostack 服務藍圖的三條古典分界線（互動線／可見線／內部互動線）標籤貼齊
  // 左緣（blueprint-relation-visual-redesign）；draw-distinct-swimlane-
  // boundary-lines 在同一個 y 座標上另外補畫一條真正貫穿全圖的線，但線本身
  // 刻意設計成在顏色／線寬／虛線三個維度都輸給關係線（見下面 boundaryLines），
  // 不會贏過關係線的視覺權重，也
  // 不會被視覺上讀成一條連續的線——見 boundaryLines 註解。
  const dividers=scene.laneBands.map((band,index)=>{
    const label=LINE_AFTER[band.layer];if(!label)return '';
    const next=scene.laneBands[index+1];
    const y=next?(band.y+band.height+(next.y-band.y-band.height)/2):band.y+band.height;
    return `<rect x="44" y="${y-10}" width="88" height="20" rx="4" fill="#fff" stroke="#d8d3cc" stroke-width="1"/>${exportTextBlock(label,88,y,'#716d68',10,10.5,500)}`;
  }).join('');
  // draw-distinct-swimlane-boundary-lines：跟互動畫布的 boundaryLines 用同一
  // 組數值（#c9c2b8／0.9px／"2 6"——見 interactiveBlueprintArrowsSVG 上方的
  // 註解，說明第一版數值在真實畫面上完全看不見，這版才是實際生效的校準），
  // 匯出檔案才會跟畫面上看到的一致。匯出路徑沒有互動畫布那個獨立的泳道標籤
  // 欄寬，直接從 x=0 畫到 x=width，跟 laneFills 本來就是同樣的全寬方式一致。
  const boundaryLines=scene.laneBands.map((band,index)=>{
    if(!LINE_AFTER[band.layer])return '';
    const next=scene.laneBands[index+1];
    const y=next?(band.y+band.height+(next.y-band.y-band.height)/2):band.y+band.height;
    return `<line x1="0" y1="${y}" x2="${width}" y2="${y}" stroke="#c9c2b8" stroke-width="0.9" stroke-dasharray="2 6"/>`;
  }).join('');
  // fix-svg-export-marker-legend-scope: this Set has to live outside the
  // per-card closure below -- it accumulates which marker types appear on
  // *any* card so the legend built after the loop knows what to explain.
  // Declaring it inside the closure left every add() writing to a set that
  // died with that card, so the legend's later read threw ReferenceError on
  // every export.
  const usedMarkerTypes=new Set();
  const cards=scene.cards.map(card=>{
    const node=nodeById.get(card.id);if(!node)return '';
    const claims=node.claims||[],researcher=claims.some(cl=>cl.source_level==='researcher');
    const inferred=claims.some(cl=>cl.source_level==='inference');
    // narrow-inference-flag-to-unsupported-claims：只看這張卡自己的 claim，
    // 跟互動畫布 blueprintCardHTML 的 hasInferenceFlag 一致——連到的關係是
    // 不是推論不再算，那是關係線自己的視覺在講的事。
    const hasInferenceFlag=inferred&&!node.muted_inference_flag;
    const palette=blueprintExportColors(node.layer);
    // 推論卡片跟畫布一樣用中性外觀，只有推論依據的整張套契約透明度。
    const stroke=researcher?'#74579d':palette.stroke;
    const fill=researcher?'#f4edfb':palette.fill;
    const text=researcher?'#51405f':palette.text;
    const cardOpacity=inferenceOnlyCard(node)?` opacity="${exportRelationColours().opacity}"`:'';
    const status=researcher?'研究者指定':'';
    // simplify-inference-markers-and-coverage-states：徽章圓圈畫在卡片矩形
    // 邊界外側（不是卡片內部右上角），跟互動畫布 .marker-badges 移到卡外側
    // 的設計一致；badgeGap 留一點間距，確保整顆圓都在卡片頂端之外。
    const badgeRadius=9,badgeMargin=8,badgeGap=2,badgeStep=badgeRadius*2+3;
    // 匯出原本只畫 ⚑，F/W/D 一顆都沒有——交出去的圖比螢幕上少講了「這裡是失誤點
    // ／等候點／決策點」。順序與配色照互動畫布：標記在左、認識論警示在右，最右邊
    // 那顆離卡片右緣 badgeMargin。
    const exportBadges=[
      ...cardMarkerTypes(node).map(type=>{usedMarkerTypes.add(type);return {glyph:MARKER_CODE[type]||'?',fill:'#173d85',ink:'#fff'};}),
      ...(cardEpistemicLabels(hasInferenceFlag).length
        ?[{glyph:'⚑',fill:'#b9791d',ink:'#fff3d8'}]:[])
    ];
    const cardBadges=exportBadges.map((badge,index)=>{
      const cx=card.x+card.w-badgeMargin-badgeRadius-(exportBadges.length-1-index)*badgeStep;
      const cy=card.y-badgeGap-badgeRadius;
      return `<circle cx="${cx}" cy="${cy}" r="${badgeRadius}" fill="${badge.fill}" stroke="#fff" stroke-width="1.5"/><text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" fill="${badge.ink}" font-size="10" font-weight="800" font-family="Avenir Next, Noto Sans TC, PingFang TC, sans-serif">${badge.glyph}</text>`;
    }).join('');
    // fix-svg-export-card-layout-drift：卡片內部不再保留頂端淨空（badge 已經
    // 移到卡外側），文字垂直置中直接用卡片幾何中心，跟互動畫布現在對稱的
    // 上下 padding 一致——含徽章跟不含徽章的同一 tier 卡片文字位置相同。
    const contentMidY=card.y+card.h/2-(status?6:0);
    return `<g class="node-card"${cardOpacity}><rect x="${card.x}" y="${card.y}" width="${card.w}" height="${card.h}" rx="8" fill="${fill}" stroke="${stroke}" stroke-width="1.5" ${researcher?'stroke-dasharray="6 4"':''}/>${exportTextBlock(node.label,card.x+card.w/2,contentMidY,text,12,12,650)}${status?exportTextBlock(status,card.x+card.w/2,card.y+card.h-12,stroke,12,9.5,700):''}${cardBadges}</g>`;
  }).join('');
  // fix-svg-export-card-layout-drift：獨立的「待驗證：」參考卡矩形跟對應的
  // 灰色虛線圖例拿掉了——這種格子現在跟互動畫布一樣，走 coverage_state 的
  // 「還要查」呈現路徑（見 blankCellMarkup），不再另外畫一種樣式；匯出的
  // SVG 本來就不畫空格的 coverage_state 標記（cards 只畫有節點的格子），
  // 所以這裡沒有替代畫法，單純移除。
  // 這份 SVG 是離線也看得懂的獨立檔案，卡片標記的意思要在畫面裡自己講清楚，
  // 不能假設看的人一定開過互動網頁版的圖例。
  // EPISTEMIC_BADGE_LEGEND_TEXT 涵蓋四種狀況，比原本只講「無證據推論」一種
  // 的舊文字長，所以這個底框跟著加高（寬度不變，靠 exportTextBlock 自動換行）
  // ——底框只是視覺底色，不是文字的硬邊界，加高不影響其他匯出座標。
  // F/W/D 現在也畫在匯出的卡片上了，圖例就得解釋它們——否則拿到檔案的人
  // 看到的是沒人說明的符號，正好違反上面那句「離線也看得懂」。只解釋這張圖
  // 真的出現過的標記，沒用到的不佔版面。
  const markerLegendRow=Object.keys(MARKER_CODE).filter(type=>usedMarkerTypes.has(type)).map((type,index)=>{
    const cx=width-484+index*62,cy=height-57;
    return `<circle cx="${cx}" cy="${cy}" r="7" fill="#173d85"/><text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="8" font-weight="800" font-family="Avenir Next, Noto Sans TC, PingFang TC, sans-serif">${MARKER_CODE[type]||'?'}</text><text x="${cx+12}" y="${cy+1}" dominant-baseline="middle" fill="#536176" font-size="9" font-weight="500" font-family="Avenir Next, Noto Sans TC, PingFang TC, sans-serif">${type.replace('點','')}</text>`;
  }).join('');
  const legendTop=markerLegendRow?height-72:height-42,legendHeight=markerLegendRow?60:30;
  const inferenceLegend=`<g><rect x="${width-500}" y="${legendTop}" width="234" height="${legendHeight}" rx="4" fill="#fff"/>${markerLegendRow}<circle cx="${width-484}" cy="${height-27}" r="7" fill="#b9791d"/><text x="${width-484}" y="${height-26}" text-anchor="middle" dominant-baseline="middle" fill="#fff3d8" font-size="8" font-weight="800" font-family="Avenir Next, Noto Sans TC, PingFang TC, sans-serif">⚑</text>${exportTextBlock(EPISTEMIC_BADGE_LEGEND_TEXT,width-355,height-27,'#536176',24,9,500)}</g>`;
  // draw-only-relations-the-grid-cannot-express 1.5: same as the interactive
  // canvas -- an outline around an implicit same_event group's member cards,
  // drawn before the cards so their fill still paints on top of the border.
  const groupBoxes=(scene.groups||[]).map(g=>`<rect x="${g.x-6}" y="${g.y-6}" width="${g.w+12}" height="${g.h+12}" rx="6" fill="none" stroke="#8a8580" stroke-width="1.5" stroke-dasharray="4 3"/>`).join('');
  return `<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><title>${esc(runCaseLabel({meta:(d.meta||{})})||'服務藍圖')}</title><rect width="100%" height="100%" fill="#fff"/>${laneFills}<defs>${relationMarkerDefs('export-arrow',colours)}</defs>${headers}${lanes}${dividers}${groupBoxes}${boundaryLines}${relationPaths}${relationBridges}${cards}${inferenceLegend}</svg>`;
}
function blueprintFilename(ext){
  const raw=(S.viewingVersion&&S.viewingVersion.name)||(S.report&&S.report.meta&&S.report.meta.case_id)||'service';
  const safe=String(raw).normalize('NFKC').replace(/[^\w\u3400-\u9fff-]+/g,'-').replace(/^-+|-+$/g,'')||'service';
  return `${safe}-service-blueprint.${ext}`;
}
function downloadBlueprintBlob(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadBlueprintSVG(){
  if(S.viewingVersion)return downloadSavedVersionExport('svg');
  const svg=blueprintExportSVG();if(!svg)return;
  downloadBlueprintBlob(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),blueprintFilename('svg'));
  const status=$('#blueprint-export-status');if(status)status.textContent='完整 SVG 已下載。';
}
async function downloadBlueprintPNG(){
  if(S.viewingVersion)return downloadSavedVersionExport('png');
  const status=$('#blueprint-export-status'),svg=blueprintExportSVG(),scene=S.blueprintView.scene;
  if(!svg||!scene)return;
  if(status)status.textContent='正在建立完整 PNG…';
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{
    const image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('SVG 無法轉成圖片'));image.src=url;});
    const area=scene.bounds.width*scene.bounds.height;
    const ratio=Math.min(2,Math.max(.5,Math.sqrt(24000000/Math.max(1,area))));
    const canvas=document.createElement('canvas');
    canvas.width=Math.ceil(scene.bounds.width*ratio);canvas.height=Math.ceil(scene.bounds.height*ratio);
    const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);
    context.drawImage(image,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw new Error('瀏覽器沒有建立圖片檔');
    downloadBlueprintBlob(blob,blueprintFilename('png'));
    if(status)status.textContent='完整 PNG 已下載。';
  }catch(error){
    if(status)status.textContent=`PNG 下載失敗：${error.message}。你仍可下載 SVG。`;
  }finally{URL.revokeObjectURL(url);}
}

async function downloadSavedVersionExport(format){
  if(!S.cur||!S.viewingVersion)return;
  const status=$('#blueprint-export-status');if(status)status.textContent='正在下載已儲存版本⋯';
  try{
    const url='/api/saved-export?run='+encodeURIComponent(S.cur)+'&id='+encodeURIComponent(S.viewingVersion.id)+'&format='+encodeURIComponent(format);
    const response=await fetch(url);if(!response.ok){const body=await response.json();throw new Error(body.error||'下載失敗');}
    downloadBlueprintBlob(await response.blob(),blueprintFilename(format));
    if(status)status.textContent='已下載儲存當下的完整 '+format.toUpperCase()+'。';
  }catch(error){if(status)status.textContent='下載失敗：'+error.message;}
}

function svgDataURL(svg){
  return 'image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}
async function blueprintPNGDataURL(){
  const svg=blueprintExportSVG(),scene=S.blueprintView.scene;
  if(!svg||!scene)throw new Error('藍圖尚未準備完成');
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
  try{
    const image=new Image();
    await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(new Error('SVG 無法轉成圖片'));image.src=url;});
    const ratio=Math.min(2,Math.max(.5,Math.sqrt(24000000/Math.max(1,scene.bounds.width*scene.bounds.height))));
    const canvas=document.createElement('canvas');canvas.width=Math.ceil(scene.bounds.width*ratio);canvas.height=Math.ceil(scene.bounds.height*ratio);
    const context=canvas.getContext('2d');context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height);
    // Save API intentionally accepts the same compact MIME;base64 form as
    // svgDataURL(); canvas.toDataURL() includes an extra `data:` prefix.
    return canvas.toDataURL('image/png').replace(/^data:/,'');
  }finally{URL.revokeObjectURL(url);}
}
async function saveReviewedVersion(){
  if(!S.cur||!S.report)return;
  const name=window.prompt('版本名稱');
  if(name===null)return;
  if(!name.trim()){alert('請填寫版本名稱。');return;}
  // tier-blueprint-review-status-disclosure 決定八：按鈕原地變化狀態，處理中
  // 期間先鎖住不能再按一次，失敗訊息留在原地（既有 #blueprint-export-status
  // 這條路徑已經是這個模式，這裡補上原本缺的「處理中禁用」那一段）。
  const btn=$('#save-version');if(btn)btn.disabled=true;
  const status=$('#blueprint-export-status');if(status)status.textContent='正在儲存審閱版本⋯';
  try{
    const svg=blueprintExportSVG(),png=await blueprintPNGDataURL();
    const r=await fetch('/api/save-version',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run:S.cur,name:name.trim(),svg:svgDataURL(svg),png})});
    const result=await r.json();if(result.error)throw new Error(result.error);
    const successText=`已儲存「${result.name}」${result.state==='reviewed'?'（已審閱）':'（待審閱）'}。`;
    if(status)status.textContent=successText;
    await loadVersions();
    const currentStatus=$('#blueprint-export-status');if(currentStatus)currentStatus.textContent=successText;

    if(status)status.textContent=`儲存失敗：${error.message}`;

  }
}

/* ══ 一則證據的唯一呈現方式 ══ */
// 出處＝誰說的＋在哪一段。逐字稿的檔案路徑（`統一時代百貨店/MUJI店內顧客/…/….txt`）
// 不渲染——研究者要判斷的是「誰說的、在哪一段」，不是檔案放在哪一層資料夾；缺欄位
// 就少一行，不用路徑補位。unify-evidence-presentation：原本只有卡片面板走這條，
// 推論關係與歷程步驟各自手寫一行出處（其中一條印的正是這裡特地避開的路徑），
// 現在全部走同一支。
function provenanceHTML(source){
  const p=source&&source.provenance;
  // 2026-10-16 readable-source-location：關著是「誰・位置」，點開才看到檔名（不帶資料夾）
  // 與存檔的原始 locator；section／頁／段有存才列，沒有就不補。
  if(!p)return `<div class="loc">${sourceLineHTML({locator:source&&source.source_locator,source:source&&source.source,incomplete:true})}</div>`;
  const place=[p.section,p.page?`第 ${p.page} 頁`:'',p.paragraph?`第 ${p.paragraph} 段`:''].filter(Boolean).join('｜');
  const who=p.participant_or_role||'';
  const file=p.incomplete?p.source_file:(p.document_title||p.source_file);
  return `<div class="loc">${sourceLineHTML({who,place,locator:p.locator,source:file,incomplete:p.incomplete||(!who&&!place&&!readableLocator(p.locator))})}</div>`;
}
// 一則證據＝一個有邊界的區塊：先講摘要（AI 的一句判讀），原話收在點開才看到的
// 區塊裡（淺黃底，一眼看得出是原始材料不是判讀），出處小字收尾，然後一條分隔線。
// 原本五到七行沒有任何邊界，連續幾則會黏成一片。
//
// open：研究者是特地按了「查看證據來源」「依據」才到這個面板的——原文就是他來的
// 目的，收起來只是多一次點擊。摘要／原話／出處的順序不因此改變。
function quoteBlock(text,open){
  return text?`<details class="evidence-quote"${open?' open':''}><summary>看原話</summary><blockquote>${esc(text)}</blockquote></details>`:'';
}
// summary 省略時整段不渲染，不留一個空的標題行——有些證據本來就沒有 AI 摘要
// （矛盾裡的兩則說法、單獨開啟的一則來源），硬給一個標題等於憑空生一句判讀。
// fix-misleading-evidence-presentation：服務藍圖卡片面板的證據不聲稱自己是受訪者原話——
// 存檔無法證明每一筆都是口說，標題用中性的「相關資料」；訪員問題只在存檔有的時候顯示。
// 其他畫面不傳 related，輸出與先前完全相同。
function relatedDataDetails(text,open,question){
  return text?`<details class="evidence-quote"${open?' open':''}><summary>相關資料</summary>${question?`<p class="evidence-question">${esc(question)}（訪員）</p>`:''}<blockquote>${esc(text)}</blockquote></details>`:'';
}
// AI 推論關係的證據是研究者判斷「這條關係敢不敢用」的依據，直接平鋪、不用摺疊。
function relationEvidenceHTML(list){
  return (list||[]).filter(e=>e&&e.text).map(e=>{
    const p=e.provenance||{};
    const who=p.participant_or_role||e.role||'',locator=p.locator||e.locator||'';
    const file=p.incomplete?p.source_file:(p.document_title||p.source_file||e.source);
    return `<div class="evidence-item">${e.question_context?`<p class="evidence-question">${esc(e.question_context)}（訪員）</p>`:''}<blockquote>${esc(e.text)}</blockquote><div class="loc">${sourceLineHTML({who,locator,source:file,incomplete:!who&&!readableLocator(locator)})}</div></div>`;
  }).join('');
}
// 完全相同的文字才算同一段；不比相似、不看措辭，差一個標點就兩邊都印。
function evidenceAlreadyShown(text,shown){return !!text&&shown.has(text);}
function evidenceBlock({tag,summary,note,quote,source,open,related,question}){
  return `<div class="evidence-block">
      ${tag||''}${summary?`<p class="evidence-summary">${esc(summary)}</p>`:''}
      ${related?relatedDataDetails(quote,open,question):quoteBlock(quote,open)}
      ${note?`<p class="loc">${esc(note)}</p>`:''}
      ${source||''}
    </div>`;
}

/* ══ popup ══ */
function popup(step,layer,nodeId,invoker=null){
  const c=S.report.cells.find(x=>x.step===step&&x.layer===layer);
  if(!c)return;
  // 卡片點擊一律要開得起彈窗（決定：evidence behind a card is reachable from
  // the card）——就算這張卡沒有可解析的證據，也要說「沒有」，不能悄悄不開。
  let claims,markers,title,description,inferenceFlagNode=null;
  // cell.nodes 這份內嵌清單的 id 不保證跟 S.report.nodes（畫布卡片／待確認
  // 清單跳轉用的扁平清單）同步，對不上就退回扁平清單找——兩邊都找不到才
  // 落到下面「整格顯示」那條路，不能因為子清單沒同步就悄悄不開彈窗。
  const node=nodeId?((c.nodes&&c.nodes.find(n=>n.id===nodeId))||(S.report.nodes||[]).find(n=>n.id===nodeId)):null;
  if(node){
    claims=node.claims||[];markers=node.markers||[];title=node.label||'（無標籤）';description=node.description||'';
    inferenceFlagNode=node;
  }else{
    claims=c.claims||[];markers=c.markers||[];
    title=c.label||(c.nodes&&c.nodes.length?c.nodes.map(n=>n.label).filter(Boolean).join('、'):'')||'（無標籤）';
    // 多節點合併顯示的路徑沒有單一節點可對應，description 留空——不猜要顯示哪一個。
    description='';
  }
  const relId=nodeId||(c.nodes&&c.nodes.length===1?c.nodes[0].id:null);
  const relatedRelations=relId?compiledRelations().relations.filter(r=>r.from===relId||r.to===relId):[];
  // distinguish-planned-from-observed-actions：生成端已經把「已宣布但還沒
  // 生效」的政策標成 status: planned，這裡只是把這個結構化狀態呈現出來——
  // 不是 UI 自己讀逐字稿猜時態。
  const isPlanned=!!(inferenceFlagNode&&inferenceFlagNode.status==='planned');
  // 「這句話是誰說的／這個動作是誰做的」兩行已移除（simplify-card-evidence-
  // presentation）：實際資料裡 speaker 欄位 44 筆全空，第一行永遠印同一句退回值；
  // 第二行雖然有值，但講的事（顧客做了顧客行動）卡片名稱與所在層已經說了。
  // 儲存端的 attribution 欄位保留不動，只是不渲染。
  const claimHTML=cl=>{
    if(cl.source_level==='researcher')return evidenceBlock({
      tag:'<span class="tag t-rsrch">研究者指定</span>',summary:cl.text,
      note:'這句話由研究者在確認畫面自己指定，沒有逐字稿出處。'});
    if(cl.source_level==='inference'||cl.inferred)return evidenceBlock({
      tag:'<span class="tag t-inf">AI 推論</span>',summary:cl.text,
      note:'資料沒有直接說明，這是依現有資料提出的可能關係。'});
    // 同一段文字已經在上面的 AI 推論關係證據印過就只留摘要（完全相同才算，不比相似）。
    const shownAbove=evidenceAlreadyShown(cl.source_text,relationQuotes);
    return evidenceBlock({summary:cl.text,quote:shownAbove?'':cl.source_text,source:shownAbove?'':provenanceHTML(cl),related:true,question:cl.question_context});
  };
  const MARKER_HELP={失誤點:'F：留意顧客抱怨與服務品質。',等候點:'W：留意顧客或流程等待。',決策點:'D：這是員工判斷或流程分支。',交接點:'H：留意責任在角色間的移交。',放棄點:'A：留意顧客或流程參與者中止未完成。'};
  const markerHTML=m=>evidenceBlock({
    summary:MARKER_HELP[m.type]||m.type||'節點符號',note:m.note,
    quote:m.source_text,source:provenanceHTML(m),related:true,question:m.question_context});
  // unify-evidence-presentation：標記原本一律當成一則獨立證據呈現，但它的「摘要」
  // 是每張卡都一樣的圖例句，引文則常常是上面某一則 claim 已經印過的同一段——實測
  // 這個案例六個標記全部如此，等於同一段逐字稿在同一張卡上出現兩次。引文已經被
  // claim 印過的標記降成一行小字（那句圖例本來就是它唯一新增的資訊）；引文在這張卡
  // 上沒有別處出現的標記維持完整證據區塊，不會因為這條規則掉了它唯一的證據。
  const claimQuotes=new Set(claims.map(cl=>cl.source_text).filter(Boolean));
  const echoedMarkers=markers.filter(m=>m.source_text&&claimQuotes.has(m.source_text));
  const standaloneMarkers=markers.filter(m=>!(m.source_text&&claimQuotes.has(m.source_text)));
  // 同一張卡可以有好幾個同型標記（三個等候點）——那是三個位置各自被標到，不是
  // 三件要留意的不同事。圖例句每型只講一次，重複三遍只是把同一句話印三次。
  const markerNotes=[...new Set(echoedMarkers.map(m=>MARKER_HELP[m.type]||m.type||'節點符號'))];
  // 一張卡可能同時有 D 跟 F——兩件不同的事，原本用全形空格接在同一行，讀起來
  // 像一句話裡的兩個子句，看不出是兩個獨立標記。一張卡一種標記維持原本的單行；
  // 兩種以上才需要拆行，跟「3 個地方沒通過檢查」用同一種清單樣式。
  const markerNoteHTML=markerReasonListHTML(markerNotes);
  // require-marker-specific-reason-note：markerNotes 是「這個類別通常代表
  // 什麼」，每型只講一次，跟這則標記本身無關；下面這份是「這一則具體為什麼」，
  // 每則各自不同，不能去重——三個等候點各自的理由不是同一句話講三遍。沒有
  // note 的標記（例如這個 change 之前產生的舊資料）本來就不貢獻任何一行，
  // 不補一句佔位字。
  const echoedMarkerReasonHTML=markerReasonListHTML(echoedMarkers.map(m=>m.note).filter(Boolean));
  // blueprint-relation-visual-redesign：AI 推論的關係不再畫成線，卡片上只留
  // 一顆標記——理由與證據要在這裡看得到，點卡片就是這顆標記唯一的入口。
  // simplify-inference-card-presentation：每條關係以「這張卡的動作」當主詞
  // 講之前/之後，不是抽象的兩節點箭頭；每條各自可以接受/跳過（各自寫回
  // relation.muted，不共用一顆整卡靜音鈕），標題已經講是系統推論，不再逐條
  // 重複標「無證據」。
  const inferenceRelations=relatedRelations.filter(rel=>rel.source==='inference');
  const relationQuotes=new Set(inferenceRelations.flatMap(rel=>(rel.evidence||[]).map(e=>e&&e.text)).filter(Boolean));
  // 一張卡可以同時有多條「之後」推論——不是系統對同一件事猶豫不決，是不同
  // 角色各自的下一步（例如乘客那邊的下一步、司機那邊的下一步）。只講「他」
  // 分不出這幾條是互斥的猜測還是各自獨立的分支，補上對方所在層的角色詞。
  const RELATION_ACTOR_WORD={顧客行動:'顧客',前台行動:'前台服務人員',後台行動:'後台人員',支援流程:'支援單位',實體證據:'相關單位'};
  // 2026-09-29 decision-first：先講 AI 推了什麼、研究者要判斷什麼；再給依據；
  // AI 自己的判斷說明收在最後、預設收合。
  const inferenceRelationHTML=rel=>{
    // fix-misleading-evidence-presentation：推論只說一次、用一句話；順序不再在「AI 判斷說明」裡重述。
    // 相關資料直接平鋪（不摺疊、不巢狀）：訪員問題（有存才有）→ 證據文字 → 次要的「角色・位置」。
    const from=nodeName(rel.from),to=nodeName(rel.to);
    const statement=(rel.type==='sequence'||!rel.type)
      ?`系統將「${from}」視為「${to}」之前的行為。`
      :`系統推測「${from}」→「${to}」屬於「${relationTypeLabel(rel.type)}」關係。`;
    const evidence=relationEvidenceHTML(rel.evidence);
    const reasoning=[
      rel.note?withoutEvidenceIds(rel.note):'',
      evidence?'':'沒有找到能直接證明這個先後順序的段落。'
    ].filter(Boolean);
    return inferenceDecisionHTML({
      heading:'AI 推論的前後關係',target:'relation',id:rel.id||'',decision:rel.inference_review,
      body:`<p class="inference-statement">${esc(statement)}</p>`,
      question:'這個關係合理嗎？',evidence,reasoning});
  };
  const inferenceRelationsHTML=inferenceRelations.map(inferenceRelationHTML).join('');
  // tier-blueprint-review-status-disclosure 決定四：矛盾角標點開後要在這裡看到
  // 「哪裡矛盾」，先講主題再列說法一／說法二／需要確認——跟畫面下方彙整清單
  // 用的是同一份 conflicts 資料、同一種「claim 引用了矛盾的證據」反推邏輯。
  const relatedConflicts=nodeId?(S.report.conflicts||[]).filter(cft=>nodesMatchingConflict(cft,S.report.nodes||[]).some(n=>n.id===nodeId)):[];
  // unify-evidence-presentation：兩則說法原本是整張卡最長、又唯一不收合的原文——
  // 最需要有一句摘要在前面的材料反而沒有。改成走同一個證據區塊：矛盾的描述當摘要，
  // 兩則說法一起收在同一個「看原話」裡（各自冠上說話的人）。兩則共用一個摺疊而不是
  // 各給一個，是因為這兩段就是要對著讀——分開收會讓人開了一則就忘了另一則，那正是
  // 這條矛盾被報出來要防的事。
  const conflictHTML=cft=>{
    const evidence=cft.evidence||[];
    const accounts=evidence.map((e,i)=>{
      const text=(e||{}).text;
      return text?`${conflictSpeaker(e||{},i)}：${text}`:'';
    }).filter(Boolean).join('\n\n');
    return `<div class="sub">說法對不上</div>
      <p class="conflict-parties">${esc(conflictSpeakerPair(evidence))}</p>
      ${evidenceBlock({summary:withoutEvidenceIds(cft.description,reportIdLookup({conflicts:[cft]})),quote:accounts,related:true})}
      <p class="conflict-account"><b>需要確認：</b>${esc(cft.review_question||'請確認實際採用哪一個說法，並據此修正藍圖。')}</p>`;
  };
  const relatedConflictsHTML=relatedConflicts.map(conflictHTML).join('');
  const noEvidence=!claims.length&&!markers.length&&!inferenceRelations.length&&!relatedConflicts.length;
  // simplify-inference-card-presentation：這顆整卡靜音鈕現在只管 claim 層級
  // 的無證據推論（node.muted_inference_flag）——關係層級的推論已經各自有
  // 自己的接受/跳過控制，不再共用這一顆鈕（simplify-inference-markers-and-
  // coverage-states 的多節點合併格限制維持：inferenceFlagNode 是 null 時
  // 不提供這個按鈕）。
  const inferredClaims=claims.filter(cl=>cl.source_level==='inference'||cl.inferred);
  const nodeDecisionHTML=inferenceFlagNode&&inferredClaims.length?inferenceDecisionHTML({
    heading:'AI 推論的內容',target:'node',id:inferenceFlagNode.id,decision:inferenceFlagNode.inference_review,
    body:`<ul class="inference-claims">${inferredClaims.map(cl=>`<li>${esc(withoutEvidenceIds(cl.text||'',reportIdLookup(S.report)))}</li>`).join('')}</ul>`,
    question:'這個推斷合理嗎？',evidence:'',
    reasoning:['資料沒有直接說明，這是依現有資料推出、解釋這個互動所需的最少內容。']}):'';
  // distinguish-planned-from-observed-actions：計畫節點的標題把狀態、生效
  // 時間／範圍、完整描述合成一句話，不分成標題＋另一段——讀者一行掃完就
  // 知道全貌，不用先展開才發現這其實還沒生效；沒有 effective 就不出現那個
  // 子句，不留占位字。
  const effectiveClause=isPlanned
    ?[inferenceFlagNode.effective&&inferenceFlagNode.effective.date?`${inferenceFlagNode.effective.date} 起`:'',
       inferenceFlagNode.effective&&inferenceFlagNode.effective.scope||''].filter(Boolean).join('・')
    :'';
  const plannedTitle=isPlanned
    ?`計畫（尚未生效${effectiveClause?'，'+effectiveClause:''}）：${description||title}`
    :'';
  // 面板標題原本寫死「藍圖節點」——「節點」是資料結構的詞，而且它比卡片自己的名字
  // （原本只是內文裡一個 13px 的 h3）更大更黑，等於最沒有資訊的字份量最重。標題改
  // 用卡片自己的名字，內文那個重複的小標題一併移除。
  const panelTitle=isPlanned?plannedTitle:title;
  const toBe=!!node&&isToBeReport();
  if(toBe){
    // reduce-to-be-sbp-cognitive-load：改善後藍圖的詳情另走這一段，舊藍圖下面那段完全不變。
    const evidenceClaims=claims.filter(cl=>!isInferredClaim(cl));
    const toBeClaimHTML=cl=>cl.source_level==='researcher'?claimHTML(cl):evidenceBlock({
      summary:toBeClaimSummary(cl,title,description),quote:cl.source_text,source:provenanceHTML(cl),related:true,question:cl.question_context});
    const shownQuotes=new Set(evidenceClaims.map(cl=>cl.source_text).filter(Boolean));
    const empty=!description&&!claims.length&&!markers.length&&!inferenceRelations.length&&!relatedConflicts.length;
    const toBeContent=`<p class="inspector-meta">${esc(layer)}・步驟 ${step}</p>
      <section class="inspector-section">
      ${toBeCardIntroHTML(node,description)}
      ${markerNoteHTML}
      ${echoedMarkerReasonHTML}
      ${relatedConflictsHTML}
      ${evidenceClaims.map(toBeClaimHTML).join('')}
      ${toBeInferredPartHTML(node)}
      ${standaloneMarkers.map(markerHTML).join('')}
      ${toBeInferredRelationsHTML(inferenceRelations,shownQuotes)}
      ${empty?'<p class="empty">沒有找到支持這張卡片的證據。</p>':''}</section>
      ${toBeExternalRefsHTML(node)}
      <div class="actions"><button type="button" class="ghost" id="as-is-card-close">關閉</button></div>`;
    openInspector({kind:'blueprint-cell',id:nodeId,title:panelTitle,relatedNodeIds:[nodeId]},toBeContent,invoker);
    const closeToBe=$('#as-is-card-close');if(closeToBe)closeToBe.onclick=()=>closeInspector();
    return;
  }
  const sourceLabel=node?asIsCardSource(node).label:'';
  const linkedTo=relatedRelations.map(rel=>{
    const tag=id=>{
      const other=(S.report.nodes||[]).find(n=>n.id===id);if(!other)return '';
      return `${other.label}${asIsCardSource(other).kind==='inference'?'（AI 推的）':''}`;
    };
    return `${tag(rel.from)} → ${tag(rel.to)}`;
  }).filter(Boolean);
  const content=`<p class="inspector-meta">${esc(layer)}・步驟 ${step}${sourceLabel?`・${esc(sourceLabel)}`:''}</p>
    ${nodeDecisionHTML||inferenceRelationsHTML?`<section class="inspector-section inference-decisions">${nodeDecisionHTML}${inferenceRelationsHTML}</section>`:''}
    <section class="inspector-section">
    ${(nodeDecisionHTML||inferenceRelationsHTML)&&(claims.length>inferredClaims.length||standaloneMarkers.length||relatedConflicts.length)?'<div class="sub">依據</div>':''}
    ${(!isPlanned&&description)?`<p class="node-description">${esc(withoutEvidenceIds(description,reportIdLookup(S.report)))}</p>`:''}
    ${(isPlanned&&inferenceFlagNode.committed_actor)?`<p class="committed-actor">誰承諾要做：<b>${esc(roleLabel(inferenceFlagNode.committed_actor))}</b></p>`:''}
    ${markerNoteHTML}
    ${echoedMarkerReasonHTML}
    ${relatedConflictsHTML}
    ${claims.filter(cl=>!inferredClaims.includes(cl)).map(claimHTML).join('')}
    ${standaloneMarkers.map(markerHTML).join('')}
    ${noEvidence?'<p class="empty">沒有找到支持這張卡片的證據。</p>':''}</section>
    ${linkedTo.length?`<p class="inspector-meta as-is-linked">連到：${esc(linkedTo.join('；'))}</p>`:''}
    <div class="actions"><button type="button" class="ghost" id="as-is-card-close">關閉</button></div>`;
  openInspector({kind:'blueprint-cell',id:nodeId||`${step}|${layer}`,title:panelTitle,relatedNodeIds:nodeId?[nodeId]:[]},content,invoker);
  const kill=()=>closeInspector();
  const closeButton=$('#as-is-card-close');if(closeButton)closeButton.onclick=kill;
  // 再按一次目前的判斷＝收回，回到待確認。
  document.querySelectorAll('[data-inference-decision]').forEach(button=>button.onclick=()=>{
    const same=button.getAttribute('aria-pressed')==='true';
    submitInferenceReview(button.dataset.inferenceTarget,button.dataset.inferenceId,same?null:button.dataset.inferenceDecision,step,layer,nodeId);
  });
}

// surface-blank-cell-meaning: an empty cell's popup — what its coverage
// state means, and (3.1-3.4) two research-decision actions that write back
// to the run's draft. The system itself never assigns confirmed_absent or
// not_applicable; only a researcher clicking one of these buttons does.
function coverageCellPopup(step,layer){
  const cell=S.report&&S.report.cells&&S.report.cells.find(x=>x.step===step&&x.layer===layer);
  if(!cell)return;
  const label=COVERAGE_STATE_LABEL[cell.coverage_state]||'';
  const stepInfo=(S.report.steps||[]).find(s=>s.no===step);
  const stepName=stepInfo?stepInfo.name:`步驟 ${step}`;
  const html=`<div class="scrim" id="scrim"><div class="pop">
    <div class="where">步驟 ${esc(stepName)} · ${esc(layer)}</div>
    <h3>${esc(label)}</h3>
    <p style="font-size:13.5px">${esc(cell.blank_note||'')}</p>
    <div class="sub">研究者標記</div>
    <p class="loc">是否確定這裡本來就不會發生事情，或這一層不適用於這個服務？系統不會自己下這個判斷，只有研究者能決定。</p>
    <div style="margin:6px 0">
      <input type="text" id="cov-evidence-ref" placeholder="佐證用的證據編號，例如 E-12" style="width:100%;box-sizing:border-box;margin-bottom:6px">
      <button class="ghost" id="cov-mark-absent">標記「這裡本來就不會發生事情」</button>
      <p class="warn" id="cov-mark-absent-warn" hidden>請先填入一條佐證用的證據編號，再標記。</p>
    </div>
    <div class="actions">
      <button class="ghost" id="cov-mark-na">標記「這一層不適用於這個服務」</button>
      <button class="ghost" id="closepop">關閉</button>
    </div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  const kill=()=>$('#scrim')&&$('#scrim').remove();
  $('#closepop').onclick=kill;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')kill();};
  $('#cov-mark-absent').onclick=()=>{
    const ref=($('#cov-evidence-ref').value||'').trim();
    if(!ref){$('#cov-mark-absent-warn').hidden=false;return;}
    submitCellCoverage(step,layer,'confirmed_absent',ref);kill();
  };
  $('#cov-mark-na').onclick=()=>{submitCellCoverage(step,layer,'not_applicable');kill();};
}
// simplify-inference-markers-and-coverage-states 1.3：研究者確認過一張卡片
// 的「無證據推論」徽章之後可以靜音，寫回該 run 的 draft。同一個節點在
// S.report 裡出現在兩個地方（頂層 nodes 清單、以及每個 cell 自己的 nodes
// 清單）——JSON 解出來後是各自獨立的物件，兩處都要補上同一個狀態，不然
// 畫布用的是頂層清單、彈窗用的是 cell 清單，會看到不一致的靜音狀態。
const INFERENCE_DECISION_LABEL={plausible:'合理',needs_adjustment:'需要調整',insufficient_evidence:'證據不足'};
const INFERENCE_DECISION_STATE={plausible:'AI 推論・研究者接受',needs_adjustment:'待修正',insufficient_evidence:'AI 推論・證據不足'};
function inferenceDecisionHTML({heading,target,id,decision,body,question,evidence,reasoning}){
  const state=INFERENCE_DECISION_STATE[decision]||'待確認';
  const buttons=Object.entries(INFERENCE_DECISION_LABEL).map(([value,label])=>
    `<button type="button" class="ghost${decision===value?' active':''}" aria-pressed="${decision===value}" data-inference-decision="${value}" data-inference-target="${target}" data-inference-id="${esc(id)}">${label}</button>`).join('');
  return `<div class="inference-decision" data-inference-state="${esc(decision||'pending')}">
    <p class="inference-decision-head"><b>${esc(heading)}</b><span class="inference-state">${esc(state)}</span></p>
    ${body}
    <p class="inference-question">${esc(question)}</p>
    <div class="inference-decision-buttons" role="group" aria-label="${esc(question)}">${buttons}</div>
    ${evidence?`<p class="inference-sub">相關資料</p>${evidence}`:''}
    ${reasoning.length?`<details class="inference-reasoning"><summary>AI 判斷說明</summary>${reasoning.map(line=>`<p>${esc(line)}</p>`).join('')}</details>`:''}
  </div>`;
}
async function submitInferenceReview(target,id,decision,step,layer,nodeId){
  try{
    const r=await decisionFetch('inference-reviews','/api/inference-review',{run:S.cur,target,id,decision});
    const j=await r.json();
    if(j.error){showToast('沒有存到：'+j.error);return;}
    if(target==='relation')(S.report.relations||[]).forEach(rel=>{if(rel&&rel.id===id){rel.inference_review=j.decision;rel.muted=j.decision==='plausible';}});
    else{
      const patch=n=>{if(n&&n.id===id){n.inference_review=j.decision;n.muted_inference_flag=j.decision==='plausible';}};
      (S.report.nodes||[]).forEach(patch);(S.report.cells||[]).forEach(cell=>(cell.nodes||[]).forEach(patch));
    }
    renderReportIntoPage();
    popup(step,layer,nodeId);
    await afterAsIsEdit();
  }catch(e){showToast('沒有存到：'+e.message);}
}
async function submitCellCoverage(step,layer,coverageState,absenceEvidenceRef){
  try{
    const r=await decisionFetch('blueprint','/api/cell-coverage',{run:S.cur,step,layer,coverage_state:coverageState,absence_evidence_ref:absenceEvidenceRef});
    const j=await r.json();
    if(j.error){showToast(noSaveText(j.error));return;}
    const cell=S.report&&S.report.cells&&S.report.cells.find(x=>x.step===step&&x.layer===layer);
    if(cell){
      cell.coverage_state=coverageState;
      if(coverageState==='confirmed_absent'){cell.blank='confirmed_absent';cell.absence_evidence_ref=absenceEvidenceRef;}
      else{delete cell.blank;delete cell.absence_evidence_ref;}
    }
    renderReportIntoPage();
    await afterAsIsEdit();
  }catch(e){showToast(noSaveText(researcherSafeError(e.message,'請稍後再試。')));}
}

// report-view-fidelity-budget 3.6: expanding a collapsed column opens a
// single-column focus view with every card and relation it holds -- the
// underlying scene never dropped them, this just shows them somewhere
// other than the crowded canvas. Closing this popup returns to the
// collapsed summary block because nothing about the collapse decision
// (derived fresh from the scene on every render) was changed.
function columnFocusPopup(step){
  const scene=S.blueprintView&&S.blueprintView.scene;
  if(!scene)return;
  const stepCards=scene.cards.filter(c=>c.step===step);
  const nodeById=new Map((S.report.nodes||[]).map(n=>[n.id,n]));
  const stepInfo=(S.report.steps||[]).find(s=>s.no===step);
  const stepName=stepInfo?stepInfo.name:`步驟 ${step}`;
  const byLayer=new Map();
  for(const card of stepCards){
    const list=byLayer.get(card.layer)||[];list.push(card);byLayer.set(card.layer,list);
  }
  const cardsHTML=LAYERS.filter(layer=>(byLayer.get(layer)||[]).length).map(layer=>{
    const items=byLayer.get(layer).map(card=>`<li>${esc((nodeById.get(card.id)||{}).label||'（未命名節點）')}</li>`).join('');
    return `<div class="sub">${esc(layer)}</div><ul class="relation-members">${items}</ul>`;
  }).join('');
  const stepCardIds=new Set(stepCards.map(c=>c.id));
  const relations=(S.report.relations||[]).filter(r=>stepCardIds.has(r.from)||stepCardIds.has(r.to));
  const relationsHTML=relations.length?`<div class="sub">進出這個階段的關係</div><ul class="relation-members">${relations.map(r=>`<li>${esc(nodeName(r.from))} → ${esc(nodeName(r.to))}（${esc(relationTypeLabel(r.type))}）</li>`).join('')}</ul>`:'';
  const html=`<div class="scrim" id="scrim"><div class="pop">
    <div class="where">單欄焦點檢視</div>
    <h3>${esc(stepName)}</h3>
    <p style="font-size:13.5px">這個階段有 ${stepCards.length} 個動作，畫面上原本收合顯示。</p>
    ${cardsHTML}
    ${relationsHTML}
    <div class="actions"><button class="ghost" id="closepop">關閉</button></div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  const kill=()=>$('#scrim')&&$('#scrim').remove();
  $('#closepop').onclick=kill;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')kill();};
}

/* 清單項目連到圖上：斷點（"3→4"）連到較前那一步第一個有資料的格子（決定十三）。 */
function goToCell(anchor){
  let el;
  if(anchor.includes('→')){
    const step=anchor.split('→')[0];
    el=[...document.querySelectorAll('[data-cell]')]
      .find(n=>n.dataset.cell.split('|')[0]===step);
  }else{
    el=document.querySelector(`[data-cell="${anchor}"]`);
  }
  if(!el)return;
  const wrap=$('#bpwrap');
  if(wrap){
    const wr=wrap.getBoundingClientRect(),er=el.getBoundingClientRect();
    if(er.left<wr.left||er.right>wr.right)
      wrap.scrollLeft+=er.left-wr.left-Math.max(0,(wr.width-er.width)/2);
  }
  el.scrollIntoView({behavior:'smooth',block:'center'});
  document.querySelectorAll('.node.hl').forEach(n=>n.classList.remove('hl'));
  el.classList.add('hl');
}

function currentToBeFingerprint(){return S.toBeDetail&&S.toBeDetail.review&&S.toBeDetail.review.fingerprint||null;}
async function acceptToBe(){
  const fingerprint=currentToBeFingerprint();if(!S.cur||!fingerprint)return;
  S.toBeDecisionPending=true;render();
  try{
    const response=await scopedPost('/api/to-be-review',{run:S.cur,fingerprint,decision:'accept'});
    const result=await response.json();if(!response.ok)throw new Error(result.error||'方案決策未完成');
    await refreshToBe();
    const toBe=(S.workbench.runtime.stages||[]).find(item=>item.id==='review-to-be');
    if(toBe)Object.assign(toBe,{availability:'complete',status:'accepted',primary_action_available:false});
    render();
  }catch(error){S.toBeDecisionPending=false;$('#workbench-live').textContent=researcherSafeError(error.message,'這個決定沒有送出成功，請稍後再試。');render();}
}

async function submitToBeRevision(event){

function _clearRunHasUpdate(name){

async function openExistingRun(name){
  // 換世代之前先讓上一個專案排隊中的旅程存檔寫完（最多等 10 秒），否則它們會隨世代作廢。
  await waitForJourneySaves();
  // cross-project-state-isolation：開啟（含重新開啟同一個專案）就換世代，之前發出、
  // 還沒回來的讀寫一律作廢；各站上一個專案的研究內容與「已載入」標記一起清掉。
  newProjectScope();
  S.reportRun=null;S.versions=[];
  S.axialCodingReview=null;S.axialCodingReviewRun=null;S.axialPairBusy=false;S.selectiveError=null;
  S.hmwPicker=null;S.hmwPickerRun=null;S.hmwSubmitBusy=false;
  S.personaMatrixSegAxes=null;S.personaMatrixSegAxesRun=null;S.personaMatrixProjection=null;S.personaProjRun=null;
  S.personaContent=null;S.personaEditError=null;S.personaHmwKeepBusy=false;
  S.journeyChannelMap=null;S.journeyChannelMapRun=null;S.journeyCandidateSave=null;S.journeySavesPending=0;S.emotionSavesInFlight={};S.journeyCandidateError=null;S.journeyKeepBusy=false;
  S.personaMatrixTargetSeg=null;S.personaMatrixTargetSegRun=null;S.personaMatrixTargetSegError=null;
  S.goalGate=null;S.freshResearchDetail=null;S.researchDetail=null;S.toBeDetail=null;
  S.codingDeliverable=null;S.codingDeliverableRun=null;
  // fix-walkthrough-flow-blockers：另一份 run 的旅程編輯只屬於那份 run；開新的
  // run 時放下它，否則上一份沒重新檢查的編輯會把這份的第 6、7 站也鎖住。
  S.journeyFlowActive=false;S.journeyState=null;S.journeySteps=[];S.journeyStages=[];
  S.journeyBaseline=null;S.journeyBaselineRun=null;S.journeyRecheck=null;S.journeyRecheckError=null;S.cjmPopover=null;
  S.intake=null;
  // defer-research-evaluation-station：服務藍圖的狀態也只屬於上一份 run。不清的話，
  // 落在服務藍圖站時 skipIfLoaded 會沿用上一份的藍圖與確認狀態（現在已確認的專案
  // 也停在這一站，這種切換更常見）。
  S.report=null;S.asIsBuild=null;S.asIsConfirmation=null;S.asIsFreshness=null;S.implementationResearch=null;S.asIsConfirmError=null;
  // This is an explicit researcher choice, never the old silent first-run
  // fallback.  It enables safe review and preview without another model call.
  // Re-requests the projection for this run so stage gating describes the
  // run being opened, not whichever run bootstrap last defaulted to.
  try{
    const d=await fetchBootstrapPayload(name);
    if(!applyBootstrapPayload(d)){render();return;}
  }catch(error){
    S.bootstrapError={what_happened:'開啟這個案例失敗。',why_it_matters:'目前無法確認這個案例的階段狀態是否為最新版本。',next_action:'重新載入'};render();return;
  }
  S.viewingVersion=null;
  // route-current-stage-through-framework-points: used to hardcode
  // review-as-is regardless of how far this run actually got — a run that
  // hasn't decided selective-coding/persona-target-selection/primary-hmw
  // yet, or hasn't confirmed a journey, would still land on 現況服務 with
  // nothing to show. Land wherever the server says this run's own runtime
  // currently is, same source boot() uses.
  S.step=stageStepById(S.workbench.runtime&&S.workbench.runtime.current_stage||'project-home');
  render();
  loadStageContent(stageContractByStep(S.step).id,{skipIfLoaded:true});
  // 載完才清：清在載入前，中途失敗就會留下一份「已經看過」但其實沒看到的紀錄。
  _clearRunHasUpdate(name);
  render();
}

function moveJourneyColumn(from,to){
  const steps=journeyColumnSteps();

  ensureJourneyEditFlow();
  const [moved]=steps.splice(from,1);steps.splice(to,0,moved);
  adoptNeighbourStage(steps,to);
  syncJourneyEditState({rerender:true});
}

function applyJourneyRecheckResult(result){
  const journey=result&&result.reconciled_journey,scenario=primaryScenario(journey);
  if(!journey||!scenario||!Array.isArray(scenario.steps))throw new Error('完整歷程尚未準備好，請再試一次。');
  closeInspector({returnFocus:false,skipDirtyCheck:true});
  S.journeyRecheck=result;S.journeyRecheckOutput=result.run;
  const previousColumns=new Map(S.journeySteps.map(step=>[step.id,journeyBoundStep(step)]));
  S.journeySteps=scenario.steps.map(step=>copyJSON(step));
  S.journeyStages=copyJSON(scenario.stages||[]);
  S.journeySteps.forEach(step=>{const bound=previousColumns.get(step.id);if(bound!==null&&bound!==undefined)journeyColumnBindings.set(step,bound);});
  S.journeyState='rechecked';S.journeyRecheckError=null;S.lastGenError=null;
  render();announceJourneyState('rechecked');
}
async function fetchJourneyRecheckResult(endpoint){
  const response=await fetch(endpoint);const result=await response.json();
  if(!response.ok||result.error)throw new Error(result.error||'完整歷程尚未準備好。');
  applyJourneyRecheckResult(result);
}
async function doJourneyRecheck(){
  if(S.previewMode||S.poll||!S.selectedCase||!S.journeyFlowActive)return;
  const c=S.selectedCase,baseline=S.journeyRecheck&&S.journeyRecheck.reconciled_journey||S.journeyBaseline;
  if(!baseline){failJourneyRecheck('找不到可供重新檢查的完整歷程。');return;}
  const base=(S.journeyBaselineRun||S.cur||c.name||'journey').replace(/[^\w一-鿿.-]/g,'-');
  const output=`${base}-journey-check-${Date.now()}`.slice(0,120);
  const note=(S.confirmNote||'').trim();
  const body={case:c.path,out:output,baseline_journey:copyJSON(baseline),edited_journey:journeyFromDisplayedSteps(c),execution:executionPayload()};
  if(note)body.researcher_note=note;
  S.journeyState='rechecking';S.journeyRecheckError=null;S.lastGenError=null;render();announceJourneyState('rechecking');
  try{
    const response=await fetch('/api/journey-recheck',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const accepted=await response.json();
    if(!response.ok||accepted.error)throw new Error(accepted.error||'歷程資料檢查未能開始。');
    S.journeyRecheckOutput=accepted.output_identity||output;
    if(accepted.state==='done'&&accepted.result_endpoint){await fetchJourneyRecheckResult(accepted.result_endpoint);return;}
    S.poll=setInterval(async()=>{
      try{
        const status=await fetchJobStatus();
        if(status.kind!=='journey_recheck')return;
        if(status.state==='done'||status.state==='failed'){
          clearInterval(S.poll);S.poll=null;
          if(status.state==='done'&&status.result_endpoint)await fetchJourneyRecheckResult(status.result_endpoint);
          else failJourneyRecheck(status.error&&status.error.what_happened||'歷程資料檢查未能完成。');
        }
      }catch(error){clearInterval(S.poll);S.poll=null;failJourneyRecheck(error.message);}
    },800);
  }catch(error){failJourneyRecheck(error.message);}
}

function researcherJobMessage(status){
  if(status.state==='failed')return status.failure&&status.failure.what_happened||'產生未完成，請查看錯誤訊息。';
  if(status.state==='done')return '已完成，正在開啟結果。';
  return status.phase||'處理中';
}

// unify-processing-indicator：#log2 跟①上傳的 processingIndicatorHTML()／
// journeyStatePanel() 的 rechecking 分支共用同一套「動畫進度軌＋文字」視覺，
// 差別只在錯誤時關掉動畫、改成 role="alert"（還在跑不該用 alert 打斷）。
function setGenStatus(text,{error=false}={}){
  const el=$('#log2'),track=$('#log2-track'),label=$('#log2-text');
  if(!el)return;
  el.hidden=false;el.setAttribute('role',error?'alert':'status');
  if(track)track.hidden=error;
  if(label)label.textContent=text;
}

async function startCoding(retryRun=null){
  if(S.poll||!S.selectedCase)return;
  const c=S.selectedCase;
  // provider-setup：沒有選 AI 執行方式就不送任何請求，說還沒開始、沒用額度、去哪裡選。
  if(!S.provider)return codingFailure({heading:'還沒有開始編碼',
    what_happened:'還沒有選擇 AI 執行方式。',
    why_it_matters:'還沒有開始編碼，也還沒有使用任何額度。',
    next_action:'請到右上角「設定」選擇 Codex、Claude Code 或 OpenAI API，再按「開始編碼」。',
    failure_type:'provider_not_selected'});
  // first-run-research-purpose-with-start-coding：新的一輪先存研究目的；重試不受影響。
  if(!retryRun&&!S.codingRun){
    try{await saveFirstRunPurpose();}
    catch(error){S.researchPurposeError=researcherSafeError(error.message,'研究目的沒有存起來。');render();return;}
  }
  const out=retryRun||S.codingRun||`${c.name.replace(/[^\w一-鿿-]/g,'')}-${Date.now()}`.slice(0,120);
  S.codingRun=out;
  S.proposalStarting='正在檢查執行設定⋯';S.proposalLog=null;render();
  let response,started;
  try{
    response=await fetch('/api/start-coding',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({case:c.path,out,execution:executionPayload()})});
    started=await response.json();
  }catch(error){return codingFailure({what_happened:'無法送出編碼請求：'+error.message});}
  if(!response.ok||started.error){
    // first-ai-start-readiness (O3)：沒有可用的 AI 時，說去哪裡設定，而不是「重試這一輪」。
    await loadProviderStatus();
    const layers=providerLayers();
    if(!retryRun&&layers&&!layers.every(l=>l.ok))return codingFailure({heading:'還沒有開始編碼',
      what_happened:`${PROVIDER_LABELS[S.provider]} 在這台電腦上的狀態還沒準備好。`,
      why_it_matters:'還沒有開始編碼，也還沒有使用任何額度。',
      next_action:'請依 README 安裝並登入 Codex 或 Claude Code，或到右上角「設定」改選其他 AI 執行方式，再按「開始編碼」。',
      failure_type:'ai_unavailable'});
    return codingFailure({what_happened:started.error||'伺服器未接受編碼請求。'});
  }
  if(started.state==='done'){
    S.proposalStarting=null;
    await openProjectRun(out);
    return;
  }
  S.codingActive=true;S.proposalStarting='正在準備編碼';render();
  watchCodingJob(out);
}
function codingFailure(info){
  S.codingActive=false;S.proposalStarting=null;S.proposalLog=null;render();
  // researcher-readable-coding-failure：編碼本身跑到一半停下時，伺服器帶回的是驗證器原文；
  // 改用這一輪 run.json 的步驟狀態說明，原文留在第 1 站的技術細節。
  const meta=((S.runs||[]).find(run=>run.name===S.codingRun)||{}).meta;
  const view=info.cause==='coding_runtime_failure'&&meta&&['failed','cancelled'].includes(meta.coding_state)?codingFailureView(meta):null;
  openFailureDialog({heading:view?view.heading:(info.heading||'編碼尚未完成'),
    what_happened:view?view.lines[0]:(info.what_happened||'編碼未能完成。'),
    why_it_matters:view?'顧客任務候選尚未準備好。':(info.why_it_matters||'顧客任務候選尚未準備好。'),
    next_action:view?view.lines[1]:(info.next_action||'排除原因後重試這一輪編碼。'),
    upstream:info.upstream,upstream_source:info.upstream_source,
    failureContext:{operation:'開始編碼',stage:view&&view.stopped?view.stopped.label:'Align',failure_type:info.failure_type||info.reason,error_code:info.code||S.lastGenErrorCode}});
}
function watchCodingJob(out){
  if(S.poll)return;
  S.poll=setInterval(async()=>{
    let status;
    try{status=await fetchJobStatus();}
    catch(error){return;}
    if(status.kind!=='fresh_coding'||status.out!==out)return;
    S.proposalStarting=researcherJobMessage(status);S.proposalLog=status.log||null;render();
    if(status.state!=='done'&&status.state!=='failed'&&status.state!=='cancelled')return;
    clearInterval(S.poll);S.poll=null;S.codingActive=false;S.proposalStarting=null;S.proposalLog=null;
    if(status.state==='done'){
      await openProjectRun(out);
    }else{
      if(status.state==='failed'){
        try{
          const probe=await fetch('/api/bootstrap?run='+encodeURIComponent(out));
          if(probe.ok)await openProjectRun(out);
        }catch(error){}
      }
      codingFailure(status.failure||{what_happened:status.state==='cancelled'?'編碼已取消。':'編碼未能完成。'});
    }
  },800);
}

// 匯入的藍圖帶不動提案，因為它不是在這裡產生的。研究者要的不是一段解釋，是能
// 重跑一次。所需的東西其實都在：案例路徑、證據、已確認歷程都還在 S.selectedCase
// 裡，buildGenerationPayload() 也組得出完整 body——擋住它的只有 previewMode 這個
// 開機旗標，以及「畫面上沒有這顆按鈕」。所以這裡就是清掉旗標、切到②（生成與進度
// 本來就在那一頁），然後走既有的 doGen()，不另外造一條生成路徑。
async function regenerateForProposal(){
  if(S.poll)return;
  if(!S.selectedCase){alert('還沒有選定案例，請先回到①選擇案例。');return;}
  // 不轉頁、也不借用 ② 的 doGen()——doGen() 假設畫面上有 #gen 那顆按鈕，這一頁沒有，
  // 它一進去就會在 $('#gen').disabled 炸掉（第一版就是這樣靜靜什麼都沒發生）。
  // 這裡自己送、自己輪詢，進度顯示走關卡那條既有的跑動列。
  // 送的是「重讀案例、產生歷程初版」那一支，不是直接產藍圖。直接產藍圖會被 server
  // 擋下來，而且擋得對：它只接受兩種歷程——(a) 跟它自己保存的 AI 初版一字不差，
  // (b) 它自己跑過的重查結果。匯入的 run 兩者都沒有（沒有 journey_proposal.yaml），
  // 所以第一版送過去得到 JourneyRecheckRequestRejected。重查那條路也走不通：它要
  // 案例底下有 raw/ 目錄，這個案例的逐字稿放在 transcripts_raw/。
  // 剩下唯一誠實的路，就是 ① 本來就在走的那條——讓 AI 重讀案例產出歷程初版，
  // 落在②由研究者確認，確認後才產生藍圖。中間那一次確認不是多餘的關卡，
  // 是這個產品的設計本身。
  S.previewMode=false;
  const c=S.selectedCase;
  const out=c.name.replace(/[^\w一-鿿-]/g,'')+'-'+new Date().toISOString().slice(0,10)+'-'+Date.now();
  const body={case:c.path,out,effort:'high',discover_journey:true,execution:executionPayload()};
  if((c.evidence_files||[]).length)body.from_evidence=c.evidence_files[0];
  // 剛上傳的專案：告訴伺服器檔案放在哪裡（沒送時伺服器會找案例旁的 raw/）。
  else if(S.intake&&S.intake.raw_dir&&S.intake.case===c.path)body.input=S.intake.raw_dir;
  S.proposalStarting='正在重新讀這個案例的資料⋯';renderReviewGate();
  const fail=(what,upstream,next)=>{
    S.proposalStarting=null;renderReviewGate();
    openFailureDialog({heading:'沒有重新產生',what_happened:what,upstream,
      why_it_matters:'現有的匯入版本仍然在，但它帶不動提案。',
      next_action:next||'排除上面的問題之後再試一次。'});
  };
  // 失敗原因由 server 判定時，三句話都用它的——不要在前端再猜一次。
  const failWith=info=>{
    S.proposalStarting=null;renderReviewGate();
    openFailureDialog({heading:'沒有重新產生',
      what_happened:info.what_happened||'產生這份藍圖的工作中途停下來了。',
      why_it_matters:info.why_it_matters||'現有的匯入版本仍然在，但它帶不動提案。',
      next_action:info.next_action||'再試一次。'});
  };
  let started;
  try{
    started=await(await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)})).json();
  }catch(error){return fail('送出產生請求時發生錯誤。',error.message,'確認伺服器仍在執行，然後再試一次。');}
  if(started&&started.error)return fail('伺服器沒有接受這次產生請求。',started.error+(started.code?`（${started.code}）`:''));
  S.poll=setInterval(async()=>{
    let status;
    try{status=await fetchJobStatus();}catch(error){return;}
    S.proposalStarting=researcherJobMessage(status);renderReviewGate();
    if(status.state!=='done'&&status.state!=='failed')return;
    clearInterval(S.poll);S.poll=null;S.proposalStarting=null;
    if(status.state==='failed'){
      // server 已經把失敗原因翻成研究者看得懂的三句話（provider／model 名稱留在
      // server 那一側）。原本這裡固定寫「調整案例資料後再試一次」，第一次真的失敗
      // 時就指錯了地方——那次是伺服器沒有金鑰，改再多逐字稿也不會成功。
      const f=status.failure||{};
      return failWith(f);
    }
    // 落在②：歷程初版已經產好並由 server 保存，研究者確認之後那一頁自己會產生藍圖。
    await openPendingJourneyProposal(out);
  },1200);
}
async function doGen(){
  if(S.previewMode||S.poll)return;
  if(S.journeyFlowActive&&!['unchanged','rechecked'].includes(S.journeyState))return;
  // 未選案例不送——不靜默用 S.cases[0]（P0-B 修正）。正常路徑下這顆按鈕在
  // 沒有 S.selectedCase 時根本不會被渲染出來（見 viewConfirm() 的擋法），
  // 這裡是防呆，不是主要防線。
  const c=S.selectedCase;
  if(!c){alert('還沒有選定案例，請先回到①上傳選擇案例。');return;}
  // 跟 viewConfirm() 讀同一個 buildGenerationPayload() ——確認畫面顯示的摘要文字
  // 跟這裡送出的 body 必須是同一次計算，不能各自算一次（P0-A/B 修正的核心，這次擴大到
  // researcher_note／case／from_evidence 全部欄位）。
  const {body}=buildGenerationPayload(c,S);
  S.lastGenError=null; // 開新一輪生成，清掉上一輪留下的失敗旗標（deriveTaskState 依賴這個欄位）
  $('#gen').disabled=true;setGenStatus('啟動中⋯');
  const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const j=await r.json();
  if(j.error){
    S.lastGenError=j.error;S.lastGenErrorCode=j.code||null;
    setGenStatus('錯誤：'+j.error+(j.code?`（${j.code}）`:''),{error:true});
    $('#gen').disabled=false;return;
  }
  S.poll=setInterval(async()=>{
    const s=await fetchJobStatus();
    setGenStatus(researcherJobMessage(s));
    if(s.state==='done'||s.state==='failed'){
      clearInterval(S.poll);S.poll=null;$('#gen').disabled=false;
      if(s.state==='done'){
        // Re-request the projection for the run that just finished
        // generating, not whichever run bootstrap last defaulted to, so
        // stage gating describes the run the researcher now has open.
        const d=await fetchBootstrapPayload(s.out);
        if(!applyBootstrapPayload(d)){render();return;}
        go(3);loadReport();
      }
      else{S.lastGenError='產生未完成，請修正資料後再試一次。';setGenStatus(S.lastGenError,{error:true});}
    }
  },1200);
}

async function markReviewed(){
  if(!S.cur)return;
  // 雙向 toggle：已經 reviewed 就送出取消，否則送出標記
  // （allow-unmarking-reviewed-runs 決定二）。確認已失效（指紋不吻合）時也算
  // 「尚未確認」的方向，按下去是重新確認，不是取消（tier-blueprint-review-
  // status-disclosure 決定九）。
  const target=computeConfirmationState(S.report||{}).state==='confirmed'?'unreviewed':'reviewed';
  const btn=$('#mark-reviewed'),errEl=$('#mark-reviewed-error');
  // tier-blueprint-review-status-disclosure 決定八原本說：失敗原因留在按鈕旁邊，
  // 不用阻擋式彈窗。make-proposal-start-legible 只針對「這一條路」改變它，理由記在
  // openFailureDialog() 旁邊——當時的失敗是設定錯誤，沒有可據以行動的理由，打斷
  // 就只是噪音；現在外部服務真的接得通，失敗會帶回一個等了一段時間才拿到、而且
  // 使用者可以據以行動的理由。按鈕旁邊那行字仍然保留，所以不依賴他有看到對話框。
  const originalText=btn?btn.textContent:'';
  if(errEl){errEl.hidden=true;errEl.textContent='';}
  const body={run:S.cur,review_state:target};
  if(target==='reviewed'){
    // require-explicit-authorization-for-live-model-calls: 確認現況同時是
    // 啟動外部調研的動作。送出前先揭露這次會做什麼，會花費線上額度時要求
    // 明確同意。這裡只是揭露與便利——同一條規則由伺服器端獨立強制執行，
    // 就算這段被跳過或繞過，伺服器一樣會擋下請求。
    let disclosure=null;
    try{
      const previewExecution=executionPayload({retainKey:true});
      const previewQuery=new URLSearchParams({run:S.cur,mode:previewExecution.mode});
      if(previewExecution.mode==='api')previewQuery.set('provider',previewExecution.provider);
      disclosure=await(await fetch('/api/as-is-research/preview?'+previewQuery.toString())).json();
    }catch(error){disclosure=null;}
    if(disclosure&&disclosure.spend_capable){
      if(!confirm(disclosure.plain_summary+'\n\n確定要繼續嗎？'))return;
      body.live_research_acknowledged=true;
    }
  }
  // 揭露與同意都過了才取執行方式，研究者在確認框按取消時 key 不會被清掉。
  if(target==='reviewed')body.execution=executionPayload();
  // 進度不是靠按鈕變字：關卡區出現一條「正在跑」的列，按鈕同時變成不可用。
  S.proposalStarting='正在確認服務藍圖並開始研究⋯';
  renderReviewGate();
  const settle=()=>{S.proposalStarting=null;renderReviewGate();};
  try{
    const r=await decisionFetch('blueprint','/api/review',body);
    const j=await r.json();
    if(j.error){
      settle();
      const restored=$('#mark-reviewed');
      if(restored){restored.disabled=false;restored.textContent=originalText;}
      const target=$('#mark-reviewed-error');
      if(target){target.hidden=false;target.textContent='開始提案失敗：'+j.error;}
      const localFailure=j.error_source!=='external';
      openFailureDialog({heading:'沒有開始提案',
        what_happened:'確認服務藍圖的請求沒有完成。',
        upstream:j.error,upstream_source:j.error_source,
        why_it_matters:'服務藍圖沒有被確認，研究也沒有開始。',
        next_action:localFailure
          ?'照上面那一行處理，然後再按一次「開始提案」。'
          :'看上面外部服務的回覆；排除之後再按一次「開始提案」。'});
      return;
    }
    // defer-research-evaluation-station：這是 pre-V1 舊格式專案的 /api/review 路徑，
    // 刻意保留不改（Public Preview 不承諾 pre-V1 相容）；stageStepById 的後援讓它落在服務藍圖站。
    if(target==='reviewed'&&j.as_is_research){
      S.asIsResearch=operationToResearchState(j.as_is_research);S.researchDetail=null;
      await loadReport();
      const stages=S.workbench.runtime.stages||[];
      const asIs=stages.find(item=>item.id==='review-as-is'),toBe=stages.find(item=>item.id==='review-to-be');
      if(asIs)Object.assign(asIs,{availability:'complete',status:'confirmed',primary_action_available:false});
      if(toBe)Object.assign(toBe,{availability:'current',status:S.asIsResearch.status,research:S.asIsResearch,primary_action:S.asIsResearch.primary_action,primary_action_available:!!S.asIsResearch.primary_action_available,capability_available:false,proposal_eligible:false});
      S.workbench.runtime.current_stage='review-to-be';S.step=stageStepById('review-to-be');S.mode='to-be-blueprint';
      S.proposalStarting=null;render();
      await refreshAsIsResearch({renderAfter:true});
      // 現況確認成功、但調研本身立刻失敗時，工作區會陳述失敗——這種也是他等過的，
      // 一樣打斷，並且把外部服務給的訊息帶出來。
      const failed=S.asIsResearch&&S.asIsResearch.state==='research_failed';
      if(failed)openFailureDialog({heading:S.asIsResearch.heading||'調研沒有完成',
        what_happened:S.asIsResearch.what_happened,
        upstream:(j.as_is_research&&j.as_is_research.error||{}).user_message,
        upstream_source:(j.as_is_research&&j.as_is_research.error||{}).source,
        why_it_matters:S.asIsResearch.why_it_matters,
        next_action:S.asIsResearch.next_action});
    }else{S.proposalStarting=null;await loadReport();}
  }catch(e){
    settle();
    const restored=$('#mark-reviewed');
    if(restored){restored.disabled=false;restored.textContent=originalText;}
    const target=$('#mark-reviewed-error');
    if(target){target.hidden=false;target.textContent='開始提案失敗：'+e.message;}
    openFailureDialog({heading:'沒有開始提案',
      what_happened:'送出請求時發生錯誤，這一步沒有完成。',
      upstream:e.message,upstream_source:'local',
      why_it_matters:'服務藍圖沒有被確認，研究也沒有開始。',
      next_action:'確認伺服器仍在執行，然後再按一次「開始提案」。'});
  }
}

function operationToResearchState(operation){
  const contract=S.workbench&&S.workbench.as_is_research||{},defs=new Map((contract.states||[]).map(item=>[item.id,item]));
  const raw=operation&&operation.state,phase=operation&&operation.phase;

function journeyEmotionCurveHTML(steps){

    const level=journeyEmotionLevel(step);

function wireEmotionCurve(container){
  const svg=container.querySelector('.cjm-emotion-line'),path=svg&&svg.querySelector('path:not(.cjm-emotion-gap)'),gap=svg&&svg.querySelector('path.cjm-emotion-gap');
  const dots=[...container.querySelectorAll('.cjm-emotion-dot')];
  const levelFromPercent=pct=>{
    const clamped=Math.max(0,Math.min(100,pct));
    const raw=EMOTION_LEVELS-((clamped-EMOTION_PAD)/(100-2*EMOTION_PAD))*(EMOTION_LEVELS-1);
    return Math.max(1,Math.min(EMOTION_LEVELS,Math.round(raw)));
  };
  const redrawLine=()=>{
    if(!path)return;
    let d='',g='',previous=null;
    dots.forEach((dot,i)=>{
      if(dot.classList.contains('cjm-emotion-unset'))return;
      const x=parseFloat(dot.style.left),y=parseFloat(dot.style.top);
      if(previous){const seg=`M${previous.x},${previous.y} L${x},${y} `;if(previous.i===i-1)d+=seg;else g+=seg;}
      previous={x,y,i};
    });
    path.setAttribute('d',d.trim());
    if(gap)gap.setAttribute('d',g.trim());
  };
  const setLevel=(dot,level)=>{
    const y=journeyEmotionYPercent(level);
    dot.style.top=y+'%';dot.setAttribute('aria-valuenow',String(level));
    dot.className='cjm-emotion-dot cjm-emotion-level-'+level;
    dot.innerHTML=`<svg viewBox="0 0 20 20" aria-hidden="true">${EMOTION_FACES[level-1]}</svg>`;
    dot.setAttribute('aria-label',`${dot.dataset.emotionStepLabel||''} 情緒：${EMOTION_LEVEL_LABELS[level-1]}，上下鍵可調整`);
    redrawLine();

    const owner=dot.dataset.emotionAnnotation;
    if(owner&&(S.journeyChannelMap||{}).solution_selection_model){
      // 存檔要排隊（約 3 秒才重繪），期間拖下一個點，前一筆的重繪會把這個點畫回舊值。
      // 這一點最後一筆存檔成功才放掉暫存值；沒存到就留著，畫面照研究者拖的位置並顯示錯誤。

    }

  };
  dots.forEach(dot=>{
    dot.dataset.emotionStepLabel=(dot.getAttribute('aria-label')||'').split(' 情緒')[0];
    const onMove=ev=>{
      const rect=container.getBoundingClientRect();
      const clientY=ev.touches?ev.touches[0].clientY:ev.clientY;
      setLevel(dot,levelFromPercent((clientY-rect.top)/rect.height*100));
    };
    const onUp=()=>{
      document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);
      const level=Number(dot.getAttribute('aria-valuenow'));
      if(level)save(dot,level);
    };
    dot.addEventListener('pointerdown',ev=>{
      if(dot.disabled)return;
      ev.preventDefault();onMove(ev);
      document.addEventListener('pointermove',onMove);document.addEventListener('pointerup',onUp);
    });
    dot.addEventListener('keydown',ev=>{
      const current=dot.getAttribute('aria-valuenow');

  // 2026-10-02 研究者裁定：Solution 格子只放勾選與那一句解方；問題分析留在資料裡，不上格子。
  const solutionRow=`<tr data-cjm-row="solutions">${solutionHead}${steps.map(step=>{

  }).join('')}</tr>`).join('');
  return `<section class="card cjm-workspace" data-journey-candidate data-solution-selection-model>
    <p class="cjm-map-heading"><b>CUSTOMER JOURNEY MAP</b><span>${momentModel?'檢視每一步的體驗，勾選想發展解方的時刻；勾選的時刻就是採用。':'檢視每一步的體驗，選擇適用的做法；「查看管道」不會採用該做法。'}</span></p>

      <tr>${cjmTopicRowHTML(header,span)}</tr>

      ${emotionRow}<tr data-cjm-row="satisfaction">${cjmRowHeadHTML('SATISFACTION','satisfaction')}${steps.map(satisfactionCell).join('')}</tr>${cjmGroupRowHTML('solution',span)}${solutionRow}${!momentModel||steps.some(step=>(step.solution_candidates||[]).length)?channelRows:''}</tbody></table></div>

// 「另一種走法」：舊旅程照舊唯讀列在表格下方，不用展開。新旅程（可選時刻）的前台不顯示

  </div>`).join('')}</div>`;

function journeySelectedSolution(step){
  const list=step.as_is_solutions||[];
  const picked=(S.journeySolutionPick||{})[step.id];
  return Number.isInteger(picked)&&picked<list.length?picked:0;
}
function journeySolutionCellHTML(step,edit){
  const list=step.as_is_solutions||[];
  if(!list.length)return `<td class="cjm-cell cjm-empty" data-solution-step="${esc(step.id)}"></td>`;
  const selected=journeySelectedSolution(step);
  return `<td class="cjm-cell cjm-content" data-solution-step="${esc(step.id)}"><ul class="cjm-solutions${list.length>1?'':' is-single'}">${list.map((solution,index)=>{
    const at=`data-jc-step="${esc(step.id)}" data-jc-index="${index}"`;
    const touch=(solution.touchpoints||[]).map((text,t)=>edit('touchpoint',`${at} data-jc-touchpoint="${t}"`,text)).join('、');
    const on=index===selected;
    return `<li class="cjm-solution${on?' is-selected':''}" data-pick-solution="${index}" data-step-id="${esc(step.id)}" aria-current="${on}">
      ${list.length>1?`<button type="button" class="cjm-solution-pick" data-pick-solution="${index}" data-step-id="${esc(step.id)}" aria-pressed="${on}" aria-label="看這個做法的管道">${on?'●':'○'}</button>`:''}
      <span class="cjm-solution-text">${edit('solution',at,solution.text)}</span>
      ${touch?`<span class="cjm-touchpoints">接觸點：${touch}</span>`:''}</li>`;
  }).join('')}</ul></td>`;

// 目前選的做法在這個管道扮演的角色。沒有參與就留一個安靜的「—」，不補內容；
// 舊格式只記一個 channel，就在那一列寫出接觸點，不重抄做法本身。
function journeyChannelCellHTML(step,row,edit){
  const list=step.as_is_solutions||[];
  const attrs=`data-channel-step="${esc(step.id)}" data-channel-row="${row}"`;
  if(!list.length)return `<td class="cjm-cell cjm-empty" ${attrs}></td>`;
  const index=journeySelectedSolution(step),solution=list[index];
  if(solution.delivery){
    const role=solution.delivery[row];
    if(!role)return `<td class="cjm-cell cjm-empty" ${attrs}><span class="cjm-channel-none" aria-label="這個做法沒有用到這個管道">—</span></td>`;
    const tag=role.basis==='inference'?'<span class="cjm-inferred">AI 推的</span>':'';
    return `<td class="cjm-cell cjm-content" ${attrs}>${edit('delivery',`data-jc-step="${esc(step.id)}" data-jc-index="${index}" data-jc-channel="${row}"`,role.text)}${tag}</td>`;
  }
  if(solution.channel!==row)return `<td class="cjm-cell cjm-empty" ${attrs}><span class="cjm-channel-none">—</span></td>`;
  const touch=(solution.touchpoints||[]).join('、');
  return `<td class="cjm-cell cjm-content" ${attrs}>${touch?esc(touch):'<span class="cjm-channel-none">經由這個管道交付</span>'}</td>`;
}
function pickJourneySolution(stepId,index){
  const map=S.journeyChannelMap||{};
  const step=(map.steps||[]).find(item=>item.id===stepId);if(!step)return;
  S.journeySolutionPick={...(S.journeySolutionPick||{}),[stepId]:index};
  // 就地換掉這一步的做法格與四個管道格，不動捲動位置與其他欄。
  const edit=(kind,attrs,text)=>`<span class="pc-editable" contenteditable="plaintext-only" spellcheck="false" data-jc-kind="${kind}" data-jc-original="${esc(text)}" ${attrs}>${esc(text)}</span>`;
  const cell=document.querySelector(`[data-solution-step="${CSS.escape(stepId)}"]`);
  if(cell)cell.outerHTML=journeySolutionCellHTML(step,edit);
  CHANNEL_ROW_ORDER.forEach(row=>{
    const target=document.querySelector(`[data-channel-step="${CSS.escape(stepId)}"][data-channel-row="${row}"]`);
    if(target)target.outerHTML=journeyChannelCellHTML(step,row,edit);
  });
  wireJourneyCandidateCells();
}
function editJourneyCandidateStep(body){
  // 確認要等這一筆存完，跟 blur 存檔走同一條佇列。
  S.journeyCandidateSave=trackJourneySave((S.journeyCandidateSave||Promise.resolve()).then(()=>_editJourneyCandidateStep(body)));
  return S.journeyCandidateSave;
}
// 旅程候選的存檔要排隊，一筆從送出到重繪約 3 秒。排隊中離開頁面或切專案，後面幾筆就不會送出：
// 切專案前先等它們存回原專案（openExistingRun），關分頁或重新整理時讓瀏覽器問一次。
function trackJourneySave(promise){
  S.journeySavesPending=(S.journeySavesPending||0)+1;
  const done=()=>{S.journeySavesPending=Math.max(0,(S.journeySavesPending||0)-1);};
  promise.then(done,done);
  return promise;
}
const JOURNEY_SAVE_SWITCH_WAIT_MS=10000;
function waitForJourneySaves(){
  if(!S.journeySavesPending||!S.journeyCandidateSave)return Promise.resolve();
  showToast('正在儲存顧客旅程的修改，存好就切換。');
  return Promise.race([S.journeyCandidateSave.catch(()=>{}),new Promise(resolve=>setTimeout(resolve,JOURNEY_SAVE_SWITCH_WAIT_MS))]);
}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('beforeunload',event=>{
  if(!S.journeySavesPending)return;
  event.preventDefault();event.returnValue='';
});
async function _editJourneyCandidateStep(body){
  try{
    const r=await decisionFetch('journey','/api/journey-candidate/field',{run:S.cur,...body});
    const res=await r.json();
    if(!r.ok||res.error)throw new Error(res.error||'沒有存到');
    S.journeyChannelMap=res;S.journeyCandidateError=null;
    // solution-reconfirmation：旅程改了，服務藍圖站的狀態也要重新讀。
    await loadAsIsBuild();await refreshJourneyRuntime();
  }catch(error){S.journeyCandidateError='沒有存到：'+researcherSafeError(error.message,'請稍後再試。');}
  render();
}

    if(!window.confirm('刪除這一步？這一步的行動與做法會一起刪掉。'))return;
    editJourneyCandidateStep({kind:'delete_step',step_id:button.dataset.jcDelete,value:''});});
  document.querySelectorAll('[data-jc-insert]').forEach(button=>button.onclick=()=>editJourneyCandidateStep({kind:'insert_step',step_id:button.dataset.jcInsert,position:button.dataset.jcPosition,value:'新步驟'}));

  document.querySelectorAll('[data-jc-kind]').forEach(el=>el.onblur=()=>saveJourneyCandidateField(el));

    if(event.key!=='Enter'||event.shiftKey||event.isComposing||event.keyCode===229)return;

  }));
  document.querySelectorAll('[data-jc-level]').forEach(el=>el.onchange=()=>{if(el.value)editJourneyCandidateStep({kind:el.dataset.jcLevel,step_id:el.dataset.jcStep,value:el.value});});
  document.querySelectorAll('[data-jc-select-solution]').forEach(input=>input.onchange=()=>{

      .filter(item=>item.dataset.jcStep===stepId&&item.checked).map(item=>item.dataset.jcSelectSolution);
    editJourneyCandidateStep({kind:'solution_selection',step_id:stepId,value:'',selected_solution_ids:selected});
