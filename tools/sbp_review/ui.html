<!--workbench-tokens-->
<style>
:root{
  /* converge-workbench-shell-and-visual-grammar：舊調色盤只剩名稱，數值一律
     引用由介面契約投影出來的 --wb-* 變數（見 server.py 的 WORKBENCH_TOKEN_CSS），這裡不寫
     任何色碼。--blue 系列已逐處換成語意變數，不再存在。 */
  --bg:var(--wb-surface-app); --surface:var(--wb-surface-work); --surface-2:var(--wb-surface-hover); --ink:var(--wb-text-primary);
  --green:var(--wb-status-confirmed); --green-soft:var(--wb-surface-raised);
  --amber:var(--wb-status-pending); --amber-soft:var(--wb-status-pending-surface);
  --violet:var(--wb-claim-researcher); --violet-soft:var(--wb-surface-raised);
  --red:var(--wb-status-failed); --red-soft:var(--wb-status-failed-surface);
  --line:var(--wb-border-subtle); --line-soft:var(--wb-border-subtle);
  --muted:var(--wb-text-muted);
  /* 誰說的／誰做的（歸屬）跟推論／研究者指定是兩種不同的判斷，用契約的
     synthesis 色跟 amber／violet 分開（distinguish-first-hand-from-reported-claims 2.3）。 */
  --teal:var(--wb-claim-synthesis); --teal-soft:var(--wb-surface-raised);
  --slate:var(--wb-text-secondary); --slate-soft:var(--wb-surface-raised);
  /* 藍圖卡片按 layer 分色：研究者 2026-09-26 裁定泳道與卡片改用契約的中性
     blueprint_lane，不再用寫死的層級色（和強調色撞色）。 */
  --layer-customer:var(--wb-text-secondary); --layer-customer-soft:var(--wb-lane-customer); --layer-customer-strong:var(--wb-lane-customer);
  --layer-front:var(--wb-text-secondary); --layer-front-soft:var(--wb-lane-front);
  --layer-back:var(--wb-text-secondary); --layer-back-soft:var(--wb-lane-back);
  --layer-support:var(--wb-text-secondary); --layer-support-soft:var(--wb-lane-support);
  --layer-evidence:var(--wb-text-secondary); --layer-evidence-soft:var(--wb-lane-evidence);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:var(--wb-line-body);font-size:var(--wb-type-body-size)}

.build{font-size:11px;font-weight:500;color:var(--muted);margin-left:8px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:20px;margin-bottom:16px}
/* sbp-status-render-consistency：服務藍圖上方狀態區的容器只負責整段重畫，不產生自己的版面框。 */
.as-is-station-status{display:contents}
/* tier-blueprint-review-status-disclosure 決定：完整範例預覽提示是一次性訊息，
   不該每次載入都佔用常駐版位，可關閉且關閉後不佔空間（不是只有 CSS 隱藏）。 */
h2{font-size:15px;margin:0 0 12px}
h2 .n{color:var(--muted);font-weight:400;font-size:13px}
p.lead{margin:0 0 16px;font-size:14px;color:var(--muted)}


/* ── 通用 ───────────────────────────────── */
/* converge-workbench-shell-and-visual-grammar：按鈕統一高度與膠囊外形。內容區的
   實心按鈕用深色；強調色只給頁尾 ReviewGate 裡唯一的主要動作（見 #review-gate .go）。 */
button.go{background:var(--wb-action-dark);color:var(--wb-text-inverse);border:0;min-height:var(--wb-control-height);padding:0 22px;
  border-radius:var(--wb-radius-pill);font:inherit;font-size:var(--wb-type-body-size);font-weight:var(--wb-type-card-weight);cursor:pointer}
button.go:hover:not(:disabled){background:var(--wb-action-dark-hover)}
button.go:disabled{background:var(--wb-surface-selected);color:var(--wb-text-muted);opacity:1;cursor:not-allowed}
button.ghost{background:var(--wb-action-secondary);border:1px solid var(--wb-border-strong);color:var(--wb-action-secondary-text);min-height:var(--wb-control-height);padding:0 18px;
  border-radius:var(--wb-radius-pill);font:inherit;font-size:var(--wb-type-body-size);cursor:pointer}
button.ghost:hover:not(:disabled){background:var(--wb-surface-selected)}
button.accent{background:var(--wb-action-secondary);border:1px solid var(--wb-border-strong);color:var(--wb-text-primary);min-height:var(--wb-control-height);padding:0 18px;
  border-radius:var(--wb-radius-pill);font:inherit;font-size:var(--wb-type-body-size);font-weight:var(--wb-type-card-weight);cursor:pointer}
button.accent:hover:not(:disabled){background:var(--wb-surface-selected)}
button.ghost.danger{border-color:var(--wb-action-destructive);color:var(--wb-action-destructive)}
button.ghost.danger:hover:not(:disabled){background:var(--wb-status-failed-surface)}
button:focus-visible{outline:var(--wb-focus-width) solid var(--wb-focus);outline-offset:var(--wb-focus-offset)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;align-items:center}
.warn{background:var(--wb-status-pending-surface);border:1px solid var(--wb-status-pending);padding:9px 13px;
  border-radius:0 7px 7px 0;font-size:13px;margin:12px 0}

dl.kv{margin:0;font-size:14px}
dl.kv dt{font-weight:600;margin-top:12px}
dl.kv dd{margin:1px 0 0 0;color:var(--muted)}
.rolerow{display:flex;gap:12px;padding:4px 0;font-size:14px}
.rolerow b{min-width:82px;font-weight:600}
.rolerow span{color:var(--muted);font-size:13px}
.miss{color:var(--red)}
.bar{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--wb-text-secondary);transition:width .3s}

/* 閱讀中會用到的（縮放、關係顯示）直接放；看完才用得到的（下載、存版本）收成一組，
   免得兩種用途等重搶注意力。 */
.toolbar-finish{position:relative}
.toolbar-finish{margin-left:auto}
.toolbar-finish summary{display:grid;place-items:center;width:32px;height:32px;cursor:pointer;
  border:1px solid var(--line);border-radius:8px;line-height:1;letter-spacing:1px;
  font-size:16px;color:var(--wb-text-secondary,var(--muted));list-style:none}
.toolbar-finish summary::-webkit-details-marker{display:none}
.toolbar-finish[open] summary{background:var(--wb-surface-raised)}
.toolbar-finish-list{position:absolute;right:0;top:calc(100% + 5px);z-index:6;display:grid;gap:6px;
  padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface,var(--wb-surface-raised));
  box-shadow:0 6px 18px rgba(15,25,45,.12);white-space:nowrap}
/* 摘要句本身就是展開判讀的按鈕：整句可點，右邊帶一個展開提示。 */
/* 只有「研究者自己啟動、等過、而且失敗理由可據以行動」才用這個打斷式對話框。 */
#failure-dialog{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  padding:24px;background:rgba(14,22,40,.42)}
#failure-dialog[hidden]{display:none}
.failure-dialog-panel{max-width:520px;width:100%;padding:22px 24px;border-radius:12px;
  background:var(--surface,var(--wb-surface-raised));border:1px solid var(--wb-status-failed);
  box-shadow:0 18px 44px rgba(14,22,40,.28)}
.failure-dialog-panel h2{margin:0 0 10px;font-size:18px}
.failure-dialog-line{margin:0 0 8px;font-size:14px;line-height:1.7;color:var(--ink)}
.failure-dialog-upstream{margin:0 0 8px;padding:10px 12px;border-radius:7px;
  background:var(--wb-surface-raised);font-size:13.5px;line-height:1.7;color:var(--ink)}
.failure-dialog-panel .actions{margin-top:14px;display:flex;justify-content:flex-end}
.scenario-notice{margin:0}
/* scenario-lead 是一句直接顯示的判斷（這張圖畫的是⋯＋AI 判讀結論＋幾筆檢查沒過），
   不再是需要點開才看得到的按鈕；只有還想看理由或逐筆檢查結果時，才點旁邊那顆
   小的 scenario-lead-more。 */
.scenario-lead{margin:0;text-align:left;line-height:1.65}
.scenario-lead-more{display:inline-block;border:0;background:none;padding:0;
  font:inherit;font-size:12.5px;font-weight:700;color:var(--wb-text-primary);
  white-space:nowrap;cursor:pointer}
.scenario-lead-more:hover,.scenario-lead-more:focus-visible{text-decoration:underline}
.conflict-parties{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--wb-text-primary,var(--ink))}
.blocked-explanation{border:1px solid var(--wb-status-failed)}
.blocked-explanation h2{font-size:17px}
.blocked-line{margin:0;font-size:14px;line-height:1.7}
.blocked-line b{margin-right:6px}
.judgment-findings{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.blocked-findings{margin:10px 0 12px;padding-left:20px;display:grid;gap:6px}
.blocked-findings li{font-size:14px;color:var(--wb-text-primary,var(--ink))}
/* declare-analysis-chain-and-journey-coverage：非阻斷發現跟上面共用清單樣式，
   只換掉會讓人誤以為「出錯」的邊框色——這一塊從來不會鎖住確認鍵。 */
.judgment-advisory{border-top-color:var(--wb-border-subtle,var(--line))}
.judgment-advisory .blocked-findings li{color:var(--wb-text-secondary,var(--muted))}
.review-gate-blocker{display:block;margin-top:5px;font-size:var(--wb-type-small-size);font-weight:var(--wb-type-small-weight);color:var(--wb-status-failed)}
.review-gate-primary{display:flex;flex-direction:column;align-items:flex-end}
/* ── 確認 ───────────────────────────────── */
textarea.note{width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;
  font:inherit;font-size:13.5px;resize:vertical;margin-top:8px}
/* 同類資訊分組（格式塔鄰近原則）：卡片內每一組欄位自成一塊，組跟組之間用留白＋
   分隔線隔開，讀者一眼就能分辨「這幾行在講同一件事」，不是一串平鋪的雜項。 */
.card-group+.card-group{margin-top:20px;padding-top:20px;border-top:1px solid var(--wb-border-subtle,var(--line))}

/* ── 藍圖 ───────────────────────────────── */
/* 目視測試發現：7 步放不進版面，橫向捲動存在但沒有提示，使用者不知道右邊還有欄。
   用右緣漸層遮罩當可捲動的信號，捲到底就淡出。 */
.bpouter{position:relative}
.bpouter::after{content:"";position:absolute;top:0;right:0;bottom:6px;width:44px;
  background:linear-gradient(90deg,transparent,var(--surface));pointer-events:none;
  opacity:1;transition:opacity .2s}
.bpouter.atend::after{opacity:0}
.scrollhint{font-size:11.5px;color:var(--muted);text-align:right;margin:0 0 6px}
.bpwrap{overflow-x:auto;padding-bottom:6px;position:relative}
/* render-blueprint-from-computed-layout：.bp 不再是 CSS Grid——卡片與線的座標
   來自 buildBlueprintScene() 算好的版面模型，容器本身只是一個固定尺寸的定位
   context，每張卡片、每個表頭/泳道標籤、每條分隔線都用 inline style 的
   left/top/width/height 絕對定位到模型算出的座標，畫面尺寸由 style 直接設定
   （scene.bounds），不需要瀏覽器排版後再量測。*/
.bp{position:relative;isolation:isolate}
/* 舊格式（沒有 graph 的 run）唯一還在用 CSS Grid 排版的地方——這裡的覆寫把
   上面的絕對定位規則換回原本的 grid-flow 版面，範圍限定在 .bp.legacy 底下。 */
.bp.legacy{display:grid;column-gap:14px;padding-right:34px}
.bp.legacy .hd,.bp.legacy .lane,.bp.legacy .node,.bp.legacy .divider{position:relative;left:auto;top:auto;width:auto;height:auto}
.bp.legacy .hd{margin:0 3px 8px}
.bp.legacy .node{margin:8px 4px;display:block}
.bp.legacy .divider{grid-column:1/-1;margin:5px 3px}
.cellwrap{min-width:0;z-index:1}
.bp .hd{position:absolute;top:0;z-index:1;font-size:12px;font-weight:700;color:var(--wb-text-secondary);padding:6px 8px;text-align:center;
  background:var(--wb-surface-app);border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;cursor:default}
.bp .lane{position:absolute;left:0;z-index:1;font-size:12.5px;font-weight:700;padding:8px 6px;color:var(--ink);
  display:flex;align-items:center;white-space:nowrap;box-sizing:border-box}
/* render-blueprint-from-computed-layout：顧客行動比其他四層醒目——參考圖裡
   CUSTOMER ACTIONS 那排永遠是全圖視覺重量最重的一排，其他四層維持既有顏色。 */
.bp .lane.layer-customer{background:var(--layer-customer-strong);color:var(--layer-customer);font-weight:800}
.bp .lane.layer-front{background:var(--layer-front-soft);color:var(--layer-front)}
.bp .lane.layer-back{background:var(--layer-back-soft);color:var(--layer-back)}
.bp .lane.layer-support{background:var(--layer-support-soft);color:var(--layer-support)}
.bp .lane.layer-evidence{background:var(--layer-evidence-soft);color:var(--layer-evidence)}
/* blueprint-relation-visual-redesign：泳道分界改成整排淡色底，不再是一條貫
   穿全圖、贏過關係線視覺權重的前景線（Gestalt 連續性：一條不斷的線無論多
   細都會先被看到）。z-index 排在關係線（0）跟卡片（1）之下。 */
.bp .lane-fill{position:absolute;left:0;z-index:-1;pointer-events:none}
.bp .lane-fill.layer-customer{background:var(--layer-customer-strong);opacity:.55}
.bp .lane-fill.layer-front{background:var(--layer-front-soft)}
.bp .lane-fill.layer-back{background:var(--layer-back-soft)}
.bp .lane-fill.layer-support{background:var(--layer-support-soft)}
.bp .lane-fill.layer-evidence{background:var(--layer-evidence-soft)}
.node{position:absolute;z-index:1;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);
  font-size:12.5px;line-height:1.45;cursor:pointer;transition:.12s;box-sizing:border-box;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;text-align:center}
/* simplify-inference-markers-and-coverage-states：F/W/D 標記跟合併後的
   「無證據推論」徽章改成掛在卡片外側（見下方 .node .marker-badges），卡片
   內部不再需要保留頂端淨空——上下 padding 固定成同一個數字，不因卡片是否
   帶標記而改變。跟匯出 SVG 的 exportTextBlock 座標算式暫時仍各自獨立，
   SVG 匯出路徑尚未跟進這次改動，見 tasks.md 之外的已知落差。 */
.blueprint-world .node.bp-card{padding:8px 12px 8px 12px;overflow:visible}
.node.bp-card .node-line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node:hover{border-color:var(--wb-border-strong);box-shadow:0 1px 6px var(--wb-border-subtle)}
/* layer 底色是基底層——inf／rsrch 的虛線樣式宣告在後面，CSS 層疊順序保證
   兩者疊加時虛線樣式贏，layer 底色不會蓋掉「這是推論／研究者指定」的訊號。 */
.node.layer-customer{background:var(--layer-customer-strong);border-color:var(--layer-customer);border-width:2px}
.node.layer-front{background:var(--layer-front-soft);border-color:var(--layer-front)}
.node.layer-back{background:var(--layer-back-soft);border-color:var(--layer-back)}
.node.layer-support{background:var(--layer-support-soft);border-color:var(--layer-support)}
.node.layer-evidence{background:var(--layer-evidence-soft);border-color:var(--layer-evidence)}
.node.inf{border-style:dashed;border-color:var(--amber);background:var(--amber-soft)}
.node.rsrch{border-style:dashed;border-color:var(--violet);background:var(--violet-soft)}
.node.rsrch .mk{color:var(--violet)}
.node.ref{border:2px dashed #77849a;color:#536176;background:#f7f8fa;text-align:left;justify-content:flex-start}
.node.hl{outline:3px solid var(--wb-focus);outline-offset:1px}
/* surface-blank-cell-meaning：上面那個「空白格不畫，狀態留給待查清單」的
   決定被推翻了——系統早就判定了事實（coverage_state）、schema 強制記錄了
   事實、伺服器也送到前端了，藍圖上卻一個字都沒有，研究者指著一格空白完全
   看不出它是哪一種空白。改成每一格都用可辨識的底紋＋一句話標記自己的狀態，
   點得開看細節。`.node.blank` 完全無邊框無底色的樣式只留給沒有
   `coverage_state` 的舊格式資料（那批 run 沒有這個欄位可顯示）。 */
.node.blank:not(.cov){border:none;background:none;box-shadow:none;cursor:default}
.node.blank:not(.cov):hover{border:none;box-shadow:none}
.node.blank.cov{cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;box-sizing:border-box}
.node.blank.cov .cov-label{font-size:11px;font-weight:600;line-height:1.35}
.node.blank.cov:focus-visible{outline:3px solid var(--wb-focus);outline-offset:1px}
/* simplify-inference-markers-and-coverage-states 3.1/3.4：四種 coverage_state
   呈現收成兩種顯示分類——「還要查」(unobserved、expected_unverified)維持
   琥珀色虛線斜紋；「已確認不用查」(confirmed_absent、not_applicable)改成
   純色、不帶斜紋，跟 .node.collapsed-cell（收合摘要，per-lane 輕量圓角
   chip，不再是跨泳道的整欄斜紋方塊）也是不同視覺語言，不會混在一起看錯。 */
.node.blank.cov.cov-follow-up{background:repeating-linear-gradient(45deg,#fff7ed,#fff7ed 6px,#fde9d0 6px,#fde9d0 12px);border:1.5px dashed var(--amber);color:#8a5a12}
.node.blank.cov.cov-resolved{background:#f2f2f2;border:1.5px solid #c7c7c7;color:#6b6b6b}
.node.no-data{cursor:default;opacity:.7}
.node .mk{font-size:10.5px;font-weight:700;display:block;margin-bottom:2px}
.node.inf .mk{color:var(--amber)}
.node .refs{font-size:10px;color:var(--muted);margin-top:4px}
.node .marker{display:inline-block;font-size:10.5px;color:var(--wb-text-primary);margin:3px 3px 0 0}
/* simplify-inference-markers-and-coverage-states：這排徽章掛在卡片外側
   （右上角、往上位移到卡片邊界外），不再佔用卡片內部空間——卡片內部
   padding 因此不必再幫它留一塊頂端淨空（見上面 .node.bp-card 的規則）。 */
.node .marker-badges{position:absolute;right:4px;top:-10px;display:flex;gap:3px;z-index:2}
/* 固定 18×18，不是 min-width＋左右 padding——字母加上左右各 4px 之後超過 18px，
   量到 W 是 23×18、D 是 20×18，而 ⚑ 剛好 18×18，同一排徽章兩種形狀。每顆徽章
   只放一個字符，寬高鎖死即可。 */
.marker-badge{display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;width:18px;height:18px;padding:0;border:2px solid var(--wb-text-inverse);border-radius:50%;background:#173d85;color:var(--wb-text-inverse);font-size:10.5px;font-weight:800;
  line-height:1;box-shadow:0 1px 4px rgba(14,38,86,.35)}
/* blueprint-relation-visual-redesign：AI 推論的關係不再畫成線，改成卡片上
   這顆標記——跟 F/W/D 同一套視覺樣式，但用既有的「推論」琥珀色系，不跟
   F/W/D 那種客觀事件標記共用顏色，兩種判斷才不會混在一起看。 */
.marker-badge.inference-badge{background:var(--amber);color:#3d2a06}
/* 誰說的／誰做的標記——跟上面 .node.inf／.node.rsrch 的虛線卡框刻意不同：
   這是卡片內一顆小標籤，不動整張卡的邊框與底色，兩種判斷才不會混在一起看。 */
.node .attn{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;
  border:1px solid;margin-top:3px}
.node .attn.attn-reported{color:var(--teal);background:var(--teal-soft);border-color:var(--teal)}
.node .attn.attn-undetermined{color:var(--slate);background:var(--slate-soft);border-color:var(--slate)}
/* blueprint-relation-visual-redesign：Shostack 服務藍圖的三條古典分界線
   （互動線／可見線／內部互動線）改成貼齊左緣的浮動標籤，不再貫穿全圖——
   標籤語意保留，只是不再用一條長度贏過所有關係線的不斷線來畫它。 */
.divider{position:absolute;left:0;z-index:2;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.divider span{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:3px 8px;display:inline-block}
/* draw-only-relations-the-grid-cannot-express 1.5: an implicit same-cell
   same_event relation is expressed by this outline instead of a line. */
.relation-group-box{position:absolute;z-index:0;pointer-events:none;border:1.5px dashed #8a8580;border-radius:6px}
/* report-view-fidelity-budget 3.5: a column collapsed for being far denser
   than the rest of the graph, or carrying more relation lines than a
   readable number of lanes -- summary block, not the individual cards. */
.node.collapsed-cell{cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;box-sizing:border-box;background:transparent;border:1.5px dashed #b0a790;border-radius:8px;z-index:1}
.node.collapsed-cell .collapsed-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:#f4f1ec;border:1px solid #d8d0c0;font-size:12px;font-weight:600;color:#6b6154;white-space:nowrap}
.node.collapsed-cell:hover .collapsed-chip,.node.collapsed-cell:focus-visible .collapsed-chip{border-color:#8a7f6c;color:#4a4436}
.node.collapsed-cell:focus-visible{outline:3px solid var(--wb-focus);outline-offset:1px}
svg.arrows{position:absolute;z-index:0;inset:0;overflow:visible}
.blueprint-world .relation-hit{stroke:rgba(0,0,0,.001);stroke-width:16;fill:none;cursor:pointer;pointer-events:stroke}
.blueprint-world .relation-hit:focus{outline:none}.blueprint-world .relation-hit:hover~.relation-stroke,.blueprint-world .relation-hit:focus~.relation-stroke{stroke:#144bb8;stroke-width:2.2;opacity:1}
.blueprint-world .relation-group.relation-dim .relation-stroke{opacity:.14}
.blueprint-world .relation-group.relation-active .relation-stroke{stroke:#144bb8;stroke-width:2.2;opacity:1}
.blueprint-world .relation-bridge-gap,.blueprint-world .relation-bridge-top{pointer-events:none}
.relation-tooltip{position:fixed;z-index:60;pointer-events:none;transform:translate(12px,12px);background:var(--wb-surface-raised);
  border:1px solid #144bb8;border-radius:999px;padding:3px 9px;color:#173d85;font-size:12px;font-weight:750;
  box-shadow:0 2px 10px rgba(14,38,86,.18)}
.node.relation-endpoint{outline:3px solid #144bb8;outline-offset:2px}
.relation-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:4px 0 8px}
.relation-controls .hint{font-size:12px;color:var(--muted);margin-right:auto}
.relation-controls button{font-size:12px;padding:5px 9px}
.relation-overview{border:1px solid var(--line-soft);background:#f8faff;border-radius:8px;padding:10px;margin:12px 0}
.relation-overview h3{font-size:13px;margin:0 0 7px}.bundle-list{display:flex;flex-wrap:wrap;gap:7px}
.bundle{border:1px solid var(--line);background:var(--surface);padding:5px 8px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
.bundle.inference{border-style:dashed;border-color:var(--amber)}.bundle[aria-pressed=true]{border-color:var(--wb-border-selected);box-shadow:0 0 0 2px var(--wb-accent-tint)}
.relation-members{margin:10px 0 0;padding:0;list-style:none}.relation-members li{margin:5px 0}.relation-members button{border:0;background:none;color:var(--wb-text-primary);padding:0;text-align:left;cursor:pointer;font:inherit;font-size:12px}
.sequence-channel{font-size:12px;color:var(--muted);margin:0 0 9px}.sequence-channel b{color:var(--wb-text-primary)}
.diagram-shell{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}.diagram-viewport{height:620px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fbfcff;touch-action:none}
.diagram-viewport svg{width:100%;height:100%;display:block;cursor:grab}.diagram-viewport svg.dragging{cursor:grabbing}.diagram-side{border:1px solid var(--line-soft);border-radius:8px;padding:10px;max-height:620px;overflow:auto}
.diagram-side h3{font-size:13px;margin:0 0 8px}.diagram-list{display:grid;gap:5px}.diagram-list button{border:1px solid var(--line-soft);border-radius:5px;background:var(--surface);font:inherit;font-size:12px;padding:6px;text-align:left;cursor:pointer}.diagram-list button[aria-pressed=true]{border-color:var(--wb-border-selected);background:var(--wb-accent-tint)}
.diagram-controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 0 10px}.diagram-controls select{font:inherit;font-size:12px;padding:5px}.diagram-detail{font-size:12px;margin-top:10px;border-top:1px solid var(--line-soft);padding-top:8px}.diagram-detail blockquote{margin:6px 0;padding:6px;background:var(--wb-surface-raised);border-radius:5px}.edge.evidence{stroke:#1c3f9e}.edge.inference{stroke:#9b6410;stroke-dasharray:7 4}.edge.selected{stroke-width:3.5;opacity:1}.diagram-node rect{fill:var(--surface);stroke:var(--line)}.diagram-node text{font-size:12px;fill:var(--ink);font-weight:600}.diagram-boundary{stroke:#8c9ab3;stroke-dasharray:6 4}.diagram-boundary-text{font-size:11px;fill:var(--muted)}.diagram-stage-header{font-size:13px;font-weight:700;fill:var(--wb-text-primary);text-anchor:middle}.diagram-lane-label{font-size:11px;font-weight:700;fill:var(--ink)}
@media(max-width:900px){.diagram-shell{grid-template-columns:1fr}.diagram-side{max-height:260px}.diagram-viewport{height:520px}}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend b{font-weight:700;color:var(--ink)}

/* ── 需要你確認的 ───────────────────────── */
.todo{border:1px solid var(--wb-border-subtle);background:var(--wb-surface-work);padding:10px 14px;
  border-radius:var(--wb-radius);margin-bottom:9px;font-size:13.5px}
.todo.inf{background:var(--wb-surface-work)}
.todo b{display:block;font-size:13px}
.todo .steps{display:block;font-size:12.5px;color:var(--ink);margin:2px 0 4px}
.todo span{color:var(--muted);font-size:12.5px}
.more{font-size:12.5px;color:var(--muted);padding:4px 0}

.todolist{margin:0;padding-left:22px}
.todolist li{margin-bottom:14px;font-size:13.5px}
.todo-link{color:var(--wb-text-primary);font-weight:600;text-decoration:none}
.todo-link:hover{text-decoration:underline}
.todolist .why{font-size:13px;color:var(--muted);margin:3px 0}
.todolist .why b{color:var(--ink);font-weight:600;display:inline-block;min-width:84px}
.tag{display:inline-flex;align-items:center;min-height:var(--wb-tag-height);font-size:var(--wb-type-tag-size);padding:0 10px;border-radius:var(--wb-radius-pill);font-weight:var(--wb-type-tag-weight);margin-left:7px;vertical-align:middle}
.tag.t-gap{background:var(--red-soft);color:var(--red)}
.tag.t-inference{background:var(--amber-soft);color:var(--amber)}
.tag.t-researcher{background:var(--violet-soft);color:var(--violet)}

/* ── 本次判讀摘要：先說能不能用，再交代判斷邊界與人工確認 ── */
.briefing{border:1px solid var(--wb-border-subtle);background:var(--wb-surface-raised)}
.briefing-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:9px}
.briefing-head h2{margin-bottom:2px}.briefing-kicker{display:block;color:var(--muted);font-size:11.5px}
.briefing-verdict{white-space:nowrap;border:1px solid var(--amber);background:var(--amber-soft);color:var(--amber);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:800}
.briefing-verdict.ready{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.briefing-verdict.hold{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.briefing-summary{font-size:14px;margin:2px 0 12px;color:var(--ink);max-width:78ch}
.briefing-boundaries{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.briefing-boundaries li{position:relative;padding-left:17px;font-size:13.5px;color:var(--ink)}
.briefing-boundaries li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.briefing-boundary-link{border:0;background:none;color:var(--ink);padding:0;font:inherit;text-align:left;cursor:pointer}
/* 「另有 N 項註記」是展開入口，不是跟註記並列的第七條註記：縮排對齊清單、
   字級降一階，讀起來附屬於上面那串。 */
.boundaries-more{margin:2px 0 0;padding:2px 0;font-size:12.5px;color:var(--wb-text-secondary,var(--muted))}
.briefing-boundary-link:hover{color:var(--wb-text-primary);text-decoration:underline}
.research-confirmation{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);
  margin-top:14px;padding-top:12px;font-size:12.5px;color:var(--muted)}
.research-confirmation b{color:var(--ink)}.research-confirmation .actions{margin:0 0 0 auto}
.briefing-findings{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.briefing-finding{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);padding:9px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.briefing-finding:hover{border-color:var(--wb-border-strong)}
.briefing-finding b{display:block;margin-top:3px}

/* ── tier-blueprint-review-status-disclosure：狀態列只留一個色點＋短標籤，
   完整判讀摘要收進覆蓋層，待確認事項另外彙整成一份可捲動清單 ── */
.judgment-overlay{position:absolute;inset:0;z-index:5;background:rgba(255,255,255,.98);border:1px solid var(--line);
  border-radius:9px;padding:18px;overflow:auto;display:none}
.judgment-overlay.open{display:block}
.pending-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:4px}
.pending-table{width:100%;border-collapse:collapse;font-size:13px}
.pending-table tr+tr td{border-top:1px solid var(--line)}
.pending-table tr:hover td{background:var(--surface-2)}
.pending-table td{padding:10px 12px;vertical-align:top}
.pending-table .pending-action{width:1%;text-align:right;vertical-align:middle}
.pending-list .pending-title{display:flex;align-items:center;gap:7px}
.pending-list .pending-detail{display:block;margin:3px 0 0 14px}
/* 「背了幾個動作、現在誰在替他講」是這一列的補充，不是另一個主題：跟著主題走，
   字級小一階、顏色降一階，讓它讀起來附屬於前面那句，不是並列的第二件事。 */
.pending-list .pending-detail{color:var(--wb-text-secondary,var(--muted));font-size:12.5px;font-weight:400;line-height:1.6}
.pending-list .pending-topic i{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto}
.pending-list .pending-jump{white-space:nowrap}

.pending-list .empty{padding:8px 10px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: no-preference){
  .node.jump-highlight{animation:jumpHighlight 1.4s ease-out}
}
.node.jump-highlight{outline:3px solid var(--wb-focus);outline-offset:2px}
@keyframes jumpHighlight{from{box-shadow:0 0 0 6px var(--wb-accent-tint)}to{box-shadow:0 0 0 0 transparent}}
.tag.t-break{background:var(--wb-surface-raised);color:var(--wb-text-secondary)}

table.usage{width:100%;border-collapse:collapse;font-size:12.5px}
table.usage td{padding:5px 8px;border-bottom:1px solid var(--line-soft)}
table.usage td:first-child{font-weight:600}
table.usage td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
table.usage tr.sum td{border-bottom:0;border-top:1px solid var(--line);font-weight:700;color:var(--ink)}

/* ── popup ──────────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(14,38,86,.42);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.pop{background:var(--surface);border-radius:12px;max-width:620px;width:100%;max-height:82vh;
  overflow:auto;padding:22px}
.pop .where{font-size:12px;color:var(--muted);font-weight:600}
.pop h3{margin:5px 0 0;font-size:17px}
.pop .sub{margin:16px 0 8px;font-size:12px;font-weight:700;color:var(--muted);
  border-top:1px solid var(--line-soft);padding-top:13px}
.pop .loc{font-size:12px;color:var(--muted)}
/* unify-evidence-presentation：這兩條原本掛在 .pop 底下，但標籤現在渲染在右側
   詳情面板（#inspector）裡——規則整條落空，實測 backgroundColor 是透明，等於
   整張卡最重要的認識論標示跟旁邊的字一樣重。改成不限容器。 */
.t-inf{background:var(--amber-soft);color:var(--amber)}
.t-rsrch{background:var(--violet-soft);color:var(--violet)}
/* 一則證據＝一個有邊界的區塊。摘要最重，原話點開才看到（淺黃底＝原始材料），
   出處小字收尾，區塊之間一條線。 */
/* 政策已宣布但還沒生效的卡片保留這一行：committed_actor 回答的是「誰承諾要做」，
   卡片名稱與所在層都沒有講這件事。被移除的是觀測卡片上那兩行永遠同值的歸屬。 */
.committed-actor{margin:6px 0 0;font-size:13px;color:var(--ink)}
.inference-check{display:inline-flex;align-items:center;gap:7px;margin-top:10px;
  font-size:13.5px;color:var(--ink);cursor:pointer}
.inference-check input{width:16px;height:16px;cursor:pointer;accent-color:var(--wb-text-primary)}
.evidence-block{padding:12px 0;border-bottom:1px solid var(--line-soft)}
.evidence-block:last-child{border-bottom:0}
.evidence-summary{margin:0 0 6px;font-size:14.5px;color:var(--ink);line-height:1.6}
.evidence-quote summary{cursor:pointer;font-size:12.5px;color:var(--wb-text-primary);list-style:none;
  display:inline-block;padding:2px 0}
.evidence-quote summary::-webkit-details-marker{display:none}
.evidence-quote summary::before{content:"▸ ";font-size:11px}
.evidence-quote[open] summary::before{content:"▾ "}
.evidence-quote blockquote{margin:6px 0 0;padding:10px 12px;background:var(--wb-surface-app);
  border:1px solid var(--wb-border-subtle);border-radius:6px;color:var(--ink);white-space:pre-line;
  /* converge-blueprint-presentation：逐字稿原文用研究用襯線字（契約 typography.source-family），
     一眼分得出哪些是原話、哪些是介面文字；行高取契約的 quote。字級刻意不放大：
     原話排在摘要底下時不能比摘要大（既有規格），區分靠字體，不靠字級。 */
  font-family:'Noto Serif TC','Source Han Serif TC','Songti TC',serif;font-size:13.5px;line-height:var(--wb-type-quote-line)}
.evidence-block .who{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}
.evidence-block .loc{font-size:12px;color:var(--muted)}
/* fix-misleading-evidence-presentation：AI 推論關係的「相關資料」平鋪在判斷控制項下面——
   訪員問題（有存才有）→ 證據文字 → 一行次要的「角色・位置」。出處行刻意比證據文字小、
   比問題淡：時間碼不改變設計判斷，只留作回查。 */
.evidence-question{margin:6px 0 4px;font-size:12.5px;color:var(--muted);line-height:1.5}
.evidence-item{padding:8px 0;border-bottom:1px solid var(--line-soft)}
.evidence-item:last-child{border-bottom:0}
.evidence-item blockquote{margin:0;padding:10px 12px;background:var(--wb-surface-app);
  border:1px solid var(--wb-border-subtle);border-radius:6px;color:var(--ink);white-space:pre-line;
  font-family:'Noto Serif TC','Source Han Serif TC','Songti TC',serif;font-size:13.5px;line-height:var(--wb-type-quote-line)}
.evidence-item .loc{margin:4px 0 0;font-size:12px;color:var(--muted)}
.inference-statement{margin:0 0 8px}
.marker-note{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
ul.marker-note{padding-left:18px;display:grid;gap:4px;list-style:disc}
.empty{color:var(--muted);font-size:13.5px}
.journey-step-tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;margin-top:4px;opacity:0;transition:opacity .12s}
.cjm-step-head:hover .journey-step-tools,.cjm-step-head:focus-within .journey-step-tools{opacity:1}
.journey-step-tools button{height:28px;min-height:28px;padding:0 8px;font-size:var(--wb-type-tag-size)}
.journey-add-between-btn{opacity:0;width:22px;height:16px;line-height:14px;padding:0;border:1px dashed var(--wb-border-strong);border-radius:4px;background:var(--wb-surface-raised);font-size:12px;color:var(--wb-text-secondary);cursor:pointer;transition:opacity .12s}
.cjm-step-head:hover .journey-add-between-btn,.journey-add-between-btn:focus-visible{opacity:1}
.journey-drag-handle{cursor:grab;color:var(--wb-text-secondary);font-size:14px;padding:0 2px;user-select:none}
.journey-drag-handle:active{cursor:grabbing}
/* fix-walkthrough-ui-feedback：抓起來的整欄用強調色標出，放下的位置整欄亮起插入線。 */
.cjm-table .is-dragging{background:var(--wb-accent-tint);outline:2px solid var(--wb-accent);outline-offset:-2px}
.cjm-table .drag-over{box-shadow:inset 4px 0 0 var(--wb-accent)}
.journey-state-panel:focus{outline:none}
.journey-basis{white-space:nowrap}.research-round-complete{margin:14px 0;padding:14px 16px;border:1px solid var(--wb-border-subtle);border-radius:8px;background:var(--wb-surface-raised)}.research-round-complete h3{margin:0 0 6px;font-size:16px}.research-round-complete p{margin:4px 0}.journey-state-panel{margin:14px 0;padding:14px 16px;border:1px solid var(--wb-as-is);border-radius:8px;background:var(--wb-surface-raised)}.journey-state-panel:focus{outline:3px solid var(--wb-focus);outline-offset:3px}.journey-state-panel[data-state="recheck-failed"]{border-left-color:var(--wb-status-failed)}.journey-state-kicker{display:block;margin-bottom:4px;color:var(--wb-text-muted,var(--muted));font-size:12px;font-weight:800;letter-spacing:.06em}.journey-state-panel h3{margin:0 0 6px;font-size:16px}.journey-state-panel p{margin:4px 0;max-width:72ch}.journey-review-summary{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:14px 0;padding:12px 14px;border:1px solid var(--wb-border-warning);background:var(--wb-surface-raised)}.journey-review-summary p{margin:0}.journey-assessment-state{display:inline-flex;padding:3px 8px;border-radius:999px;background:var(--wb-surface-selected);font-size:12px;font-weight:750}.journey-evidence-list{display:grid;gap:10px}
.journey-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.journey-cards article{border:1px solid var(--line);border-radius:8px;padding:10px}.journey-cards details{margin-top:8px}.viewtabs{display:flex;gap:8px;position:sticky;top:8px;z-index:5}.viewtabs button[aria-pressed="true"]{background:var(--wb-action-dark);color:white}
.cjm-branch-glyph{color:var(--wb-as-is);font-weight:700;line-height:1.4}
.cjm-branch-body{flex:1;min-width:0}
.cjm-branch-notice{margin:12px 0;padding:12px 14px;border:1px solid var(--wb-border-warning);background:var(--wb-surface-raised)}
.cjm-branch-notice h3{margin:0 0 4px;font-size:15px}
.journey-branch-form{display:grid;gap:12px}.journey-branch-form label{display:grid;gap:5px;font-weight:650}.journey-branch-form input,.journey-branch-form select,.journey-branch-form textarea{width:100%;box-sizing:border-box}
.journey-branch-preview{padding:10px 12px;background:var(--wb-surface-app);border-radius:7px}.journey-branch-preview ul{margin:6px 0 0;padding-left:20px}
/* branch-direct-manipulation (pass 2): the "+分支" trigger lives quietly in
   the step header, revealed on hover so 7-10 of them don't clutter the row
   by default; existing branches anchored there show as small pill chips. */
.cjm-table thead th{position:relative}
.cjm-branch-anchor{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px;font-weight:400}
.cjm-branch-chip{padding:2px 7px;border-radius:999px;border:1px solid var(--wb-border-strong);background:var(--wb-surface-raised);font-size:10.5px;font-weight:600;color:var(--ink);cursor:pointer}
.cjm-branch-add-here{padding:2px 6px;border-radius:999px;border:1px dashed var(--wb-border-strong);background:transparent;font-size:10.5px;color:var(--wb-text-secondary);cursor:pointer;opacity:0;transition:opacity .12s}
.cjm-table thead th:hover .cjm-branch-add-here,.cjm-branch-add-here:focus-visible{opacity:1}
.cjm-branch-inline{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid #c9d1dc;border-radius:8px;background:var(--wb-surface-raised)}
.cjm-branch-label-input{width:100%;font-size:13.5px;font-weight:700;padding:4px 6px;border:1px solid transparent;background:transparent;border-radius:5px;box-sizing:border-box}
.cjm-branch-label-input:hover{border-color:var(--wb-border-subtle)}
.cjm-branch-label-input:focus{border-color:var(--wb-focus);background:var(--wb-surface-raised)}
.cjm-branch-from{margin:4px 0 8px;font-size:12px;color:var(--wb-text-secondary)}
.cjm-branch-step-list{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.cjm-branch-step-inline{display:flex;align-items:center;gap:2px;border:1px solid var(--wb-border-subtle);border-radius:6px;background:var(--wb-surface-raised)}
.cjm-branch-step-inline input{width:9ch;padding:5px 6px;border:0;background:transparent;font-size:12.5px;border-radius:6px 0 0 6px}
.cjm-branch-step-inline input:focus{outline:2px solid var(--wb-focus);outline-offset:-2px}
.cjm-branch-step-inline button{border:0;background:transparent;padding:0 6px;color:var(--wb-text-secondary);cursor:pointer;align-self:stretch}
.cjm-branch-step-inline button:disabled{opacity:.35;cursor:default}
.cjm-branch-merge{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--wb-text-secondary);margin-bottom:8px}
.cjm-branch-merge select{font-size:12.5px;padding:3px 4px}
.cjm-branch-footer{display:flex;gap:12px}
.linklike.danger{color:var(--red)}

/* ── 單一互動式服務藍圖 ───────────────────
   視覺語法取自使用者指定的標準 SBP：白色工作紙、橘色強調顧客流程、
   其餘層逐步變淡、細灰分界與正交箭頭。畫布可以比 viewport 大，字級不會
   為了塞進螢幕而縮小；平移/縮放只改 blueprint-world 的視圖狀態。 */
main{max-width:1640px}
.blueprint-deliverable{padding:22px 22px 16px;overflow:hidden}
.blueprint-heading{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.blueprint-heading h2{font-family:"Avenir Next","Noto Sans TC","PingFang TC",sans-serif;font-size:20px;letter-spacing:.01em;margin:0}
.blueprint-heading .n{display:block;margin-top:3px}
.blueprint-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:14px 0 16px;padding-top:12px;border-top:1px solid var(--line-soft)}
.blueprint-toolbar button{padding:7px 11px;font-size:13px;background:var(--wb-surface-raised)}
.blueprint-toolbar .toolbar-sep{width:1px;height:24px;background:#e0ddd9;margin:0 3px}
.blueprint-toolbar .scale-readout{min-width:48px;text-align:center;color:#69645f;font-size:12px;font-variant-numeric:tabular-nums}
.blueprint-export-status{font-size:12px;color:#6d6863;margin:6px 0 0;min-height:20px;text-align:right}
.blueprint-viewport{height:min(72vh,820px);min-height:560px;position:relative;overflow:hidden;border:1px solid #ddd8d2;background:var(--wb-surface-raised);cursor:grab;touch-action:none;outline:none;user-select:none}
.blueprint-viewport:focus-visible{box-shadow:0 0 0 3px var(--wb-accent-tint);border-color:var(--wb-focus)}
.blueprint-viewport.dragging{cursor:grabbing}
.blueprint-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.blueprint-world .bp{font-family:"Avenir Next","Noto Sans TC","PingFang TC",sans-serif;background:var(--wb-surface-raised)}
.blueprint-world .bp .hd{top:10px;background:transparent;color:#615d59;font-size:13px;font-weight:500;font-style:italic;border-radius:0;padding:6px 10px;white-space:normal;line-height:1.3}
.blueprint-world .bp .lane{background:transparent!important;color:#5e5a56!important;font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.035em;padding:8px 14px;border-left:2px solid #8a8580}
.blueprint-world .bp .lane::before,.blueprint-world .bp .lane::after{content:"";position:absolute;left:-2px;width:12px;border-top:1px solid #8a8580}
.blueprint-world .bp .lane::before{top:0}.blueprint-world .bp .lane::after{bottom:0}
/* blueprint-relation-visual-redesign：這個畫布用參考藍圖的橘色系，行底色
   要低透明度，避免整排色蓋過卡片自己的橘色階或關係線。 */
.blueprint-world .bp .lane-fill{opacity:.14}
.blueprint-world .bp .lane-fill.layer-customer{background:var(--wb-lane-customer)}
.blueprint-world .bp .lane-fill.layer-front{background:var(--wb-lane-front)}
.blueprint-world .bp .lane-fill.layer-back{background:var(--wb-lane-back)}
.blueprint-world .bp .lane-fill.layer-support{background:var(--wb-lane-support)}
.blueprint-world .bp .lane-fill.layer-evidence{background:transparent}
.blueprint-world .node{border-radius:8px;border-width:1.5px;color:var(--wb-text-primary);font-size:12px;line-height:1.35;padding:8px 10px;box-shadow:none;transition:border-color .15s,box-shadow .15s,transform .15s}
.blueprint-world .node:hover,.blueprint-world .node:focus-visible{border-color:var(--wb-border-strong);box-shadow:0 5px 18px rgba(120,70,35,.14);outline:none;transform:translateY(-1px)}
.blueprint-world .node.blank:not(.cov),.blueprint-world .node.no-data{pointer-events:none;cursor:default}
.blueprint-world .node.blank:not(.cov):hover,.blueprint-world .node.blank:not(.cov):focus-visible,.blueprint-world .node.no-data:hover,.blueprint-world .node.no-data:focus-visible{border:none;box-shadow:none;outline:none;transform:none}
.blueprint-world .node.layer-evidence{background:var(--wb-surface-raised);border-color:var(--wb-border-strong)}
.blueprint-world .node.layer-customer{background:var(--wb-surface-raised);border-color:var(--wb-border-strong);color:var(--wb-text-primary);border-width:1.5px}
.blueprint-world .node.layer-front{background:var(--wb-surface-raised);border-color:var(--wb-border-strong)}
.blueprint-world .node.layer-back{background:var(--wb-surface-raised);border-color:var(--wb-border-strong)}
.blueprint-world .node.layer-support{background:var(--wb-surface-raised);border-color:var(--wb-border-strong)}
/* converge-blueprint-presentation（研究者 2026-09-26 裁定）：AI 推的卡片不換框色、
   不換底色，跟一般卡片同一套中性外觀，只靠徽章講「有推論」；整張卡都只有推論
   依據時再整張套契約的推論透明度（.inf-only）。研究者消音後兩個 class 都不會出現。 */
.blueprint-world .node.inf{border-color:var(--wb-border-strong);background:var(--wb-surface-raised);color:var(--wb-text-primary)}
.blueprint-world .node.inf-only{opacity:var(--wb-inference-opacity)}
.blueprint-world .node.rsrch{border-style:dashed;border-color:#74579d;background:#f4edfb;color:#51405f}
.blueprint-world .node .attn{display:none}
.blueprint-world .node .marker-badge.inference-badge,.blueprint-legend .marker-badge.inference-badge{background:#b9791d;color:#fff3d8}
.blueprint-world .divider{font-size:10.5px;font-weight:500;color:#716d68;z-index:0}
.blueprint-world .divider span{background:var(--wb-surface-raised);border-color:#d8d3cc}
/* converge-blueprint-presentation（研究者 2026-09-26 裁定）：關係線依意思讀，
   不依版面算出來的路線類別。有人講過與 AI 推的都用主要文字色、同一線寬；研究者
   畫的用研究者色；AI 推的整條線連箭頭套契約的推論透明度，不另外換色。hover／
   active 高亮規則特異度較高，滑過去照樣變藍。 */
.relation-stroke{stroke:var(--wb-text-primary);stroke-width:1.65}
.relation-stroke.relation-researcher{stroke:var(--wb-claim-researcher)}
.relation-stroke.relation-inferred{opacity:var(--wb-inference-opacity)}
.blueprint-legend{display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:12px;color:#6d6863;margin:12px 2px 0}
.blueprint-legend .legend-line{margin-right:7px;vertical-align:middle;overflow:visible}
.blueprint-legend .legend-line line{stroke:var(--wb-text-primary);stroke-width:1.65}
.blueprint-legend .legend-line path{fill:var(--wb-text-primary)}
/* 半透明＝AI 推的：一張縮小的卡片，用跟畫布同一個契約透明度。 */
.blueprint-legend i.legend-inference-key{display:inline-block;width:22px;height:14px;margin-right:7px;vertical-align:middle;
  border:1.5px solid var(--wb-text-primary);border-radius:3px;background:var(--wb-surface-raised);opacity:var(--wb-inference-opacity)}
.blueprint-legend .badge-dot{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:8px;background:var(--amber);color:#3d2a06;font-size:9px;font-weight:800;margin-right:7px;vertical-align:middle}
.blueprint-legend .tip{margin-left:auto}
/* tier-blueprint-review-status-disclosure 決定十：圖例收合成 icon 列，
   hover 用既有 title，點擊／鍵盤（Enter/Space）另外彈出同樣的說明——
   觸控與鍵盤使用者沒有 hover，不能只靠 title。 */
.legend-item{display:inline-flex;align-items:center;border:0;background:none;padding:2px;margin:0;cursor:pointer;border-radius:4px}
.legend-item .marker-badge{margin-right:5px}
.legend-item .legend-text+.marker-badge{margin-left:14px}
.legend-item:focus-visible{outline:2px solid var(--wb-focus);outline-offset:2px}
.unmapped-enum-value{color:#8a5a00;font-style:italic;border-bottom:1px dashed #b9791d}
.legend-tooltip{position:fixed;z-index:60;background:var(--wb-surface-raised);border:1px solid var(--line);border-radius:7px;
  padding:6px 10px;font-size:12.5px;color:var(--ink);box-shadow:0 4px 16px rgba(14,38,86,.18);max-width:260px}
.existing-output{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft)}
.existing-output h3{font-size:14px;margin:0 0 4px}.existing-output-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.version-history{margin-top:13px;padding-top:12px;border-top:1px solid var(--line-soft)}
.version-history h3{font-size:13px;margin:0 0 7px}.version-history ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.version-history li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}.version-history .hint{margin-left:auto}
.readonly-note{margin:0 0 12px;padding:9px 11px;border:1px solid var(--wb-text-secondary);background:var(--wb-surface-raised);font-size:13px}
@media(max-width:800px){
  .blueprint-heading{display:block}.blueprint-toolbar{margin:12px 0 14px}.blueprint-viewport{min-height:520px;height:66vh}
}

/* ── Canonical desktop workbench shell (contract_version: 1) ────────────────
   The visual direction is a quiet research instrument: graphite structure,
   indigo As-is focus, teal To-be proposals, and strong editorial hierarchy.
   Existing blueprint colors retain their own semantic responsibility. */
:root{
  /* 版面常數（不是語意 token）。所有顏色、字級、間距、圓角、動態的數值只由
     介面契約產生，由 server 在送出這份文件時注入 <style id="workbench-tokens">，這裡不保留副本。 */
  --wb-case-height:76px;--wb-gate-min-height:88px;--wb-nav-width:76px;--wb-inspector-width:380px;
}
html,body{height:100%;max-width:100%;overflow:hidden}
/* converge-workbench-shell-and-visual-grammar：可點的卡片 hover 時淡暖底＋微放大 1.02；
   選中用強調色框（border.selected）；減少動態時不縮放。 */
.project-card,.hmw-candidate,.pm-axis,.axial-pair-row,.core-category-candidate,.toggle-card,.axial-card{border-radius:var(--wb-radius-card);transition:transform var(--wb-motion-fast),background var(--wb-motion-fast)}
.project-card:hover,.hmw-candidate:hover,.pm-axis:hover,.axial-pair-row:hover,.core-category-candidate:hover,.toggle-card:hover,.axial-card:hover{background:var(--wb-surface-hover);transform:scale(1.02)}
@media (prefers-reduced-motion: reduce){.project-card:hover,.hmw-candidate:hover,.pm-axis:hover,.axial-pair-row:hover,.core-category-candidate:hover,.toggle-card:hover,.axial-card:hover{transform:none}}
.hmw-candidate.picked,.pm-axis.picked,.axial-pair-row.is-selected,.toggle-card.selected,.project-card.open{border-width:2px}

body{background:var(--wb-surface-app);color:var(--wb-text-primary);font-size:var(--wb-type-body-size);line-height:var(--wb-line-body)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:fixed;left:var(--wb-space-4);top:var(--wb-space-3);z-index:200;transform:translateY(-180%);
  padding:8px 12px;background:var(--wb-action-primary);color:var(--wb-text-inverse);border-radius:var(--wb-radius)}
.skip-link:focus{transform:translateY(0)}
.workbench-shell{--nav-col:var(--wb-nav-width);height:100dvh;display:grid;grid-template-columns:var(--nav-col) minmax(0,1fr);
  grid-template-rows:var(--wb-case-height) minmax(0,1fr) minmax(var(--wb-gate-min-height),auto);
  grid-template-areas:"case case" "nav work" "nav gate";background:var(--wb-surface-app);overflow:hidden}
#case-context{grid-area:case;position:relative;z-index:30;display:grid;grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr);align-items:center;gap:24px;
  min-width:0;padding:0 var(--wb-space-6);background:var(--wb-surface-raised);border-bottom:1px solid var(--wb-border-subtle)}
.product-mark{display:flex;align-items:center;gap:10px;min-width:max-content;font-size:var(--wb-type-card-size);font-weight:var(--wb-type-card-weight);letter-spacing:.045em;color:var(--wb-text-primary)}

.case-context-copy{min-width:0;display:flex;align-items:baseline;justify-content:center;gap:12px}
.case-context-copy .context-label{margin:0;font-size:var(--wb-type-small-size);font-weight:var(--wb-type-card-weight);letter-spacing:0;text-transform:none;color:var(--wb-text-secondary)}
.context-home{max-width:40ch;padding:0;border:0;background:transparent;color:var(--wb-text-primary);font:inherit;font-size:var(--wb-type-card-size);font-weight:var(--wb-type-card-weight);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.context-home:hover{text-decoration:underline;text-underline-offset:4px}
.shell-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.shell-menu{display:grid;place-items:center;width:var(--wb-control-height);padding:0!important}
.shell-menu svg{display:block}
.context-block{min-width:0}.context-label{display:block;margin-bottom:2px;color:var(--wb-text-muted);font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}
.context-value{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--wb-text-primary);font-size:14px;font-weight:650}
.context-detail{width:100%;padding:0;border:0;background:transparent;font:inherit;text-align:left;cursor:pointer}
.context-version{color:var(--wb-text-secondary);font-size:13px}.build{display:block;margin:1px 0 0;color:var(--wb-text-muted);font-size:10px;font-weight:500}
#stage-navigation{grid-area:nav;min-width:0;display:flex;flex-direction:column;padding:var(--wb-space-6) var(--wb-space-4);overflow:hidden;
  background:var(--wb-surface-app);border-right:1px solid var(--wb-border-subtle)}
.stage-nav-heading{margin:0 0 14px;padding:0 8px;color:var(--wb-text-muted);font-size:var(--wb-type-tag-size);font-weight:var(--wb-type-tag-weight);letter-spacing:.06em;text-transform:uppercase}
.stage-nav-list{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.stage-nav-home{margin:0 0 var(--wb-space-5);padding-bottom:var(--wb-space-5);border-bottom:1px solid var(--wb-border-subtle)}
.stage-nav-home .stage-nav-button{grid-template-columns:28px minmax(0,1fr)}
.home-nav-icon{display:grid;place-items:center;width:26px;height:26px;font-size:20px;line-height:1;color:var(--wb-text-secondary)}
.stage-nav-home .stage-nav-button[aria-current="step"] .home-nav-icon{color:var(--wb-accent)}
.page-note{max-width:60ch;margin:12px 0 0;color:var(--wb-text-secondary);font-size:var(--wb-type-body-size);font-weight:var(--wb-type-body-weight)}
.basis-region{margin:0 0 var(--wb-space-8)}
.basis-region>h2{margin:0 0 4px;font-size:var(--wb-type-section-size);font-weight:var(--wb-type-section-weight)}
.basis-region-note{margin:0 0 var(--wb-space-4);color:var(--wb-text-secondary);font-size:var(--wb-type-small-size)}
.basis-source-list{margin:0;padding:var(--wb-space-4) var(--wb-space-5);list-style:none;display:grid;gap:6px;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius-card);background:var(--wb-surface-raised)}
/* converge-workbench-shell-and-visual-grammar：研究步驟用編號標出順序（契約順序＋1，Home 另列）。
   目前這站＝暖灰褐膠囊底＋強調色實心編號；已確認＝白底編號＋✓；還沒到＝淡框。
   強調色在側欄只出現在目前這站的編號上。 */
.stage-nav-button{position:relative;width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;
  min-height:var(--wb-control-height);padding:8px 12px;border:0;border-radius:var(--wb-radius-pill);background:transparent;
  color:var(--wb-text-secondary);font:inherit;font-size:var(--wb-type-body-size);font-weight:var(--wb-type-body-weight);text-align:left;cursor:pointer;
  transition:background var(--wb-motion-fast)}
.stage-nav-button:hover:not(:disabled){background:var(--wb-surface-hover)}
.stage-nav-button[aria-current="step"]{background:var(--wb-surface-selected);color:var(--wb-text-primary);font-weight:var(--wb-type-card-weight)}
.stage-nav-button:disabled{opacity:1;cursor:not-allowed;color:var(--wb-text-muted)}
.stage-nav-button[aria-disabled="true"]{cursor:not-allowed;color:var(--wb-text-muted)}
.stage-index{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--wb-border-subtle);border-radius:50%;
  font-size:var(--wb-type-tag-size);font-weight:var(--wb-type-tag-weight);color:var(--wb-text-muted)}
.stage-nav-button[data-availability="complete"] .stage-index{border-color:var(--wb-border-strong);background:var(--wb-surface-raised);color:var(--wb-text-primary)}
.stage-nav-button[data-availability="complete"]:not([aria-current="step"])::after{content:"✓";color:var(--wb-text-secondary);font-size:var(--wb-type-small-size)}
.stage-nav-button[aria-current="step"] .stage-index{border-color:var(--wb-accent);background:var(--wb-accent);color:var(--wb-accent-text)}
.stage-copy{min-width:0}.stage-label{display:block;font-size:inherit;font-weight:inherit;line-height:var(--wb-type-card-line)}
.stage-blocked-reason{margin:8px 8px 0;padding:9px 10px;border:1px solid var(--wb-border-warning);background:var(--wb-surface-raised);color:var(--wb-text-secondary);font-size:var(--wb-type-tag-size)}
#stage-work-area{grid-area:work;min-width:0;max-width:none;margin:0;padding:0;overflow:auto;background:var(--wb-surface-work);scrollbar-gutter:stable}
#page-header{position:relative;padding:var(--wb-space-8) var(--wb-space-8) var(--wb-space-4);background:var(--wb-surface-work)}
/* rework-shell-and-project-home：頁首三行——小字站名、標題（page_title）、這一站的判斷。
   h1 仍是導覽移動焦點的目標。 */
.page-kicker{margin:0 0 10px;color:var(--wb-text-secondary);font-size:var(--wb-type-small-size);font-weight:var(--wb-type-body-weight)}
#page-header h1{margin:0;max-width:40ch;color:var(--wb-text-primary);font-size:var(--wb-type-title-size);
  font-weight:var(--wb-type-title-weight);line-height:var(--wb-type-title-line);text-wrap:balance}
.decision-statement{max-width:60ch;margin:12px 0 0;color:var(--wb-text-secondary);font-size:var(--wb-type-body-size);font-weight:var(--wb-type-body-weight)}
.warning-summary{display:flex;align-items:center;gap:8px;margin:14px 0 0;padding:9px 11px;border:1px solid var(--wb-border-warning);
  border-radius:0 var(--wb-radius) var(--wb-radius) 0;background:var(--amber-soft);color:var(--wb-text-primary);font-size:var(--wb-type-small-size);font-weight:var(--wb-type-card-weight)}
.warning-summary::before{content:"!";display:grid;place-items:center;flex:none;width:20px;height:20px;border:1px solid currentColor;border-radius:50%;font-size:var(--wb-type-tag-size);font-weight:var(--wb-type-tag-weight)}
#main{max-width:none;margin:0;padding:var(--wb-space-6) var(--wb-space-8) calc(var(--wb-space-8) + 8px)}
#main>section.card,#main>#rep>section.card{border-color:var(--wb-border-subtle);border-radius:var(--wb-radius);box-shadow:none}
.workbench-modes{display:flex;gap:4px;margin:0 0 var(--wb-space-4);padding:4px;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-surface-app);width:max-content;max-width:100%}
.workbench-mode{min-height:36px;padding:6px 14px;border:0;border-radius:6px;background:transparent;color:var(--wb-text-secondary);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.workbench-mode[aria-pressed="true"],.workbench-mode[aria-selected="true"]{background:var(--wb-surface-work);color:var(--wb-text-primary);box-shadow:0 0 0 1px var(--wb-border-strong)}
.mode-list{display:grid;gap:10px}
#review-gate{grid-area:gate;position:relative;z-index:25;display:flex;align-items:center;justify-content:space-between;gap:var(--wb-space-6);
  min-width:0;padding:14px var(--wb-space-8);background:var(--wb-surface-raised);border-top:1px solid var(--wb-border-strong)}
#stage-navigation-body{flex:1;min-height:0;overflow-y:auto}
.stage-nav-utility{flex:none;margin:var(--wb-space-4) 0 0;padding-top:var(--wb-space-4);border-top:1px solid var(--wb-border-subtle)}
.stage-nav-utility button{width:100%;padding:8px;border:0;background:transparent;color:var(--wb-text-secondary);font:inherit;font-size:var(--wb-type-small-size);text-align:left;cursor:pointer}
.stage-nav-utility button:hover{color:var(--wb-text-primary);background:var(--wb-surface-hover)}
.app-copyright{flex:none;margin-top:var(--wb-space-4);padding-top:var(--wb-space-3);border-top:1px solid var(--wb-border-subtle);color:var(--wb-text-muted);font-size:10.5px;letter-spacing:.04em;user-select:none}
.review-gate-copy{min-width:0}.review-gate-kicker{display:block;color:var(--wb-text-muted);font-size:var(--wb-type-tag-size);font-weight:var(--wb-type-tag-weight);letter-spacing:.06em;text-transform:uppercase}
.review-gate-consequence{display:block;margin-top:3px;color:var(--wb-text-primary);font-size:var(--wb-type-small-size);font-weight:var(--wb-type-card-weight)}.review-gate-pending{display:block;color:var(--wb-text-secondary);font-size:var(--wb-type-tag-size)}
#review-gate .go{flex:none;background:var(--wb-action-primary);color:var(--wb-action-primary-text);min-height:var(--wb-control-height)}
#review-gate .go:hover:not(:disabled){background:var(--wb-accent-hover)}
#review-gate .go:disabled{background:var(--wb-surface-selected);color:var(--wb-text-muted)}
/* Navigation-only gate actions (action.navigation) reuse the existing outline
   .ghost treatment instead of the solid .go fill, so a control that only
   changes which stage is displayed is perceivable as lighter-weight than
   one that starts generation or records a decision — without reading the
   label (Navigation-only controls are visually distinct from state-changing
   controls). */
#review-gate .ghost{flex:none;min-height:var(--wb-control-height)}
#review-gate .ghost:disabled{opacity:.55;cursor:default}
#inspector{grid-area:inspect;position:fixed;z-index:70;top:calc(var(--wb-case-height) + 12px);right:16px;bottom:calc(var(--wb-gate-min-height) + 12px);
  width:min(var(--wb-inspector-width),calc(100vw - var(--nav-col) - 48px));overflow:auto;padding:var(--wb-space-6);
  border:1px solid var(--wb-border-strong);border-radius:var(--wb-floating-radius);background:var(--wb-surface-overlay);box-shadow:0 12px 32px rgba(31,37,48,.18)}
#inspector[hidden]{display:none}.inspector-header{display:flex;align-items:start;justify-content:space-between;gap:16px;margin-bottom:18px}.inspector-header h2{font-size:18px;margin:0}
.inspector-close{width:36px;height:36px;padding:0;border:1px solid var(--wb-border-subtle);border-radius:50%;background:transparent;font:inherit;cursor:pointer}
.inspector-meta{margin:0 0 14px;color:var(--wb-text-muted);font-size:12px}.inspector-section{padding:13px 0;border-top:1px solid var(--wb-border-subtle)}
.inspector-section h3{margin:0 0 7px;font-size:13px}.inspector-section p{margin:5px 0;color:var(--wb-text-secondary);font-size:13px}.inspector-section blockquote{margin:8px 0;padding:10px 12px;background:var(--wb-surface-raised);font-family:'Noto Serif TC','Source Han Serif TC','Songti TC',serif;font-size:15px;line-height:var(--wb-type-quote-line);color:var(--wb-text-primary)}
/* 面板裡的區塊標籤（「說法對不上」等）原本沒有任何樣式規則命中，落回瀏覽器預設的
   16px，比它底下的逐字稿原文還大——研究者要讀的是原文，標籤只是分隔。標籤縮小、
   原文放大，讓份量最重的三個元素是卡片名稱、原文、受訪者描述。 */
.inspector-section .sub{margin:16px 0 6px;font-size:12px;font-weight:700;color:var(--wb-text-muted);letter-spacing:.05em}
.inspector-section .conflict-account{font-size:15px;color:var(--wb-text-primary)}
.proposal-card{width:100%;padding:16px;border:3px double var(--wb-to-be);border-radius:var(--wb-radius);background:var(--wb-to-be-surface);color:var(--wb-text-primary);text-align:left}
.proposal-card h3{margin:5px 0;font-size:15px}.proposal-prefix{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--wb-to-be)}
.to-be-workspace{max-width:1280px;margin:0 auto;padding:0 var(--wb-space-8) var(--wb-space-8)}
.to-be-proposal-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 0 18px;padding:12px 16px;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-to-be-surface);font-size:13px}
.to-be-proposal-banner b{font-family:Georgia,"Noto Serif TC",serif;font-size:15px}.to-be-proposal-banner span{color:var(--wb-text-secondary)}
.to-be-comparison-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.to-be-comparison-controls>span{margin-right:auto;color:var(--wb-text-secondary);font-size:13px}
.comparison-choice{min-height:36px;padding:6px 12px;border:1px solid var(--wb-border-subtle);border-radius:6px;background:var(--wb-surface-work);color:var(--wb-text-primary);font:inherit;font-size:12px;font-weight:750;cursor:pointer}
.comparison-choice[aria-pressed="true"]{border-color:var(--wb-to-be);box-shadow:inset 0 -3px 0 var(--wb-to-be)}
.to-be-blueprint-region{overflow:auto;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-surface-work)}
.to-be-grid{--tb-steps:1;display:grid;grid-template-columns:140px repeat(var(--tb-steps),minmax(180px,1fr));min-width:max(100%,calc(140px + var(--tb-steps)*180px))}
.to-be-grid>*{min-width:0;border-right:1px solid var(--wb-border-subtle);border-bottom:1px solid var(--wb-border-subtle)}
.to-be-grid-head{position:sticky;top:0;z-index:2;padding:11px 10px;background:#f0f2f4;font-size:12px;font-weight:800;text-align:center}.to-be-grid-head.corner{left:0;z-index:3;text-align:left}
.to-be-lane{position:sticky;left:0;z-index:1;padding:14px 10px;background:#f6f7f8;font-size:12px;font-weight:800}.to-be-cell{min-height:112px;padding:10px;display:grid;align-content:start;gap:8px;background:var(--wb-surface-work)}
.to-be-node{position:relative;padding:10px 11px;border:1px solid var(--wb-as-is);border-radius:7px;background:var(--wb-as-is-surface);font-size:12px;line-height:1.45;text-align:left}
.to-be-node[data-operation="modify"],.to-be-node[data-operation="add"]{border:3px double var(--wb-to-be);background:var(--wb-to-be-surface)}
.to-be-node[data-operation="remove"]{border:1px dashed #8a6a32;background:repeating-linear-gradient(135deg,#faf8f2,#faf8f2 7px,#eee9dd 7px,#eee9dd 14px);text-decoration:line-through;text-decoration-thickness:1px}
.to-be-node[data-operation="retain"]{opacity:.82}.change-label{display:inline-flex;margin:0 0 6px;padding:2px 6px;border:1px solid currentColor;border-radius:999px;color:var(--wb-to-be);font-size:10px;font-weight:850;letter-spacing:.03em;text-decoration:none}

.cjm-row-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

.cjm-table .journey-step-tools{position:absolute;left:4px;right:4px;top:calc(100% - 6px);z-index:5;margin:0;padding:4px;border:1px solid var(--wb-border-subtle);border-radius:4px;background:var(--wb-surface-raised);pointer-events:none}
.cjm-table .cjm-step-head:hover .journey-step-tools,.cjm-table .cjm-step-head:focus-within .journey-step-tools{pointer-events:auto}
.cjm-table .journey-drag-handle{position:absolute;top:2px;right:4px}

.cjm-chip{display:block;width:100%;padding:5px 8px;border:0;border-radius:4px;background:#fbe8ea;font:inherit;font-size:12px;line-height:1.5;text-align:left;color:var(--wb-text-primary);cursor:pointer}

.as-is-blueprint .as-is-alt-toggle{padding:0;border:0;background:transparent;font:inherit;font-size:var(--wb-type-small-size);color:var(--wb-text-link);cursor:pointer}

.as-is-blueprint .as-is-grid-cell{display:flex;flex-direction:column;gap:8px;min-height:124px;padding:22px 10px;box-sizing:border-box;border-top:1px solid var(--wb-border-subtle);border-left:1px solid var(--wb-border-subtle);background:var(--wb-surface-work)}

/* reduce-to-be-sbp-cognitive-load（研究者 2026-10-16／10-17）：改善後藍圖的 AI 推斷卡用既有的淡底與虛線，
   邊框沿用泳道色；卡片和文字都不降透明度，推斷卡讀起來跟其他卡一樣清楚。要排在 .layer-* 之後才蓋得過底色。 */
