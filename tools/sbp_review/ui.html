  document.querySelectorAll('[data-jc-sat-add]').forEach(button=>button.onclick=()=>{
    S.journeySatOpen={...(S.journeySatOpen||{}),[button.dataset.jcSatAdd]:true};render();
    const box=document.querySelector(`[data-jc-sat="evaluation"][data-jc-step="${CSS.escape(button.dataset.jcSatAdd)}"]`);if(box)box.focus();});
  // 沒有 field-sizing 的瀏覽器：依內容撐高，長句不被切成兩行。
  document.querySelectorAll('.cjm-inline-text').forEach(box=>{const fit=()=>{if(CSS.supports('field-sizing','content'))return;box.style.height='auto';box.style.height=box.scrollHeight+'px';};fit();box.addEventListener('input',fit);});
  document.querySelectorAll('[data-jc-sat]').forEach(box=>box.onblur=()=>{
    const stepId=box.dataset.jcStep,index=box.dataset.jcSatIndex,kind=box.dataset.jcSatKind;
    const boxes=[...document.querySelectorAll('[data-jc-sat]')].filter(item=>item.dataset.jcStep===stepId&&item.dataset.jcSatIndex===index);
    const value=part=>{const item=boxes.find(b=>b.dataset.jcSat===part);return item?item.value.trim():'';};
    if(boxes.every(item=>item.value.trim()===item.dataset.jcOriginal)){
      if(kind==='satisfaction_item_add'&&!boxes.some(item=>item===document.activeElement)){S.journeySatOpen={...(S.journeySatOpen||{}),[stepId]:false};render();}
      return;
    }
    const evaluation=value('evaluation'),reason=value('reason');
    if(!!evaluation!==!!reason)return; // 等兩格都寫好（或都清空）再存
    if(kind==='satisfaction_item_add')S.journeySatOpen={...(S.journeySatOpen||{}),[stepId]:false};
    editJourneyCandidateStep({kind,step_id:stepId,index:Number(index),value:'',evaluation,reason});
  });
  document.querySelectorAll('[data-jc-pain-add]').forEach(button=>button.onclick=()=>{
    const stepId=button.dataset.jcPainAdd;S.journeyPainAdd={...(S.journeyPainAdd||{}),[stepId]:true};render();
    const box=document.querySelector(`[data-jc-kind="pain_point_add"][data-jc-step="${CSS.escape(stepId)}"]`);if(box)box.focus();});
  document.querySelectorAll('[data-jc-channel-add]').forEach(button=>button.onclick=()=>{
    const key=button.dataset.jcChannelAdd;S.journeyChannelAdd={...(S.journeyChannelAdd||{}),[key]:true};render();
    const [stepId,row]=key.split('|');
    const box=document.querySelector(`[data-jc-kind="candidate_delivery_add"][data-jc-step="${CSS.escape(stepId)}"][data-jc-channel="${CSS.escape(row)}"]`);if(box)box.focus();});
  const developButton=$('#build-journey-solutions');if(developButton)developButton.onclick=startJourneySolutionsBuild;
  document.querySelectorAll('[data-solution-keep]').forEach(button=>button.onclick=()=>keepSolution(button.dataset.solutionKeep));
  document.querySelectorAll('[data-jc-preview-solution]').forEach(button=>button.onclick=()=>{
    const region=document.querySelector('[data-journey-candidate] .cjm-table-region'),left=region&&region.scrollLeft||0;
    S.journeyPreviewSolution={...(S.journeyPreviewSolution||{}),[button.dataset.jcStep]:button.dataset.jcPreviewSolution};
    render();
    const updated=document.querySelector('[data-journey-candidate] .cjm-table-region');if(updated)updated.scrollLeft=left;
  });
  // 點做法（不是正在改字的那一個）就換成看它的管道；已選的那一個點下去是改字。
  document.querySelectorAll('li[data-pick-solution]').forEach(li=>li.onclick=event=>{
    if(li.classList.contains('is-selected')&&!event.target.closest('.cjm-solution-pick'))return;
    event.preventDefault();pickJourneySolution(li.dataset.stepId,Number(li.dataset.pickSolution));
  });
}
function journeyCandidateStatusHTML(map){
  const c=map.confirmation||{};
  const error=S.journeyCandidateError?`<p class="warn" role="alert">${esc(S.journeyCandidateError)}</p>`:'';
  // resolve-stale-at-researcher-gates：只有 Persona 本身改過才會走到這裡；研究者明確選
  // 保留（不呼叫 AI、內容不變）或依目前 Persona 重新建立（會用額度）。
  if(c.state==='persona_changed'){
    const keepError=S.journeyKeepError?`<p class="warn" role="alert">${esc(S.journeyKeepError)}</p>`:'';
    return `<div class="journey-state-panel" role="status" data-journey-persona-changed><p>Persona 改過了，這份顧客旅程是依先前的 Persona 整理的。</p>
      <p class="stage-runner-hint">保留目前顧客旅程不會呼叫 AI，內容不變。重新建立會依目前 Persona 整理一份新的，會用到 CLI 額度；舊的這份會先保留。</p>
      <div class="actions"><button type="button" class="ghost" data-journey-keep${S.journeyKeepBusy?' disabled':''}>保留目前顧客旅程</button>
      <button type="button" class="go" data-journey-rebuild${((S.journeyChannelMap||{}).build||{}).available===false||S.journeyBuildBusy?' disabled':''}>依目前 Persona 重新建立顧客旅程</button></div>${keepError}</div>${error}`;
  }
  if(map.solution_selection_model){
    const pending=(map.steps||[]).filter(step=>step.moment_selection&&step.solutions_stale).length;
    if(c.state==='confirmed'&&pending)return `<p class="status-line" role="status" data-journey-confirmed>CJM 已確認。</p><p class="status-line" role="status" data-journey-solutions-pending>部分已採用的解方需要重新確認：上游決定改過，請確認原本採用的解方是否仍然適用。</p>${error}`;
    if(c.state==='confirmed')return `<p class="status-line" role="status" data-journey-confirmed>CJM 與選取的 Solution 已確認；SBP 會依這份決定建立。</p>${error}`;
    const moments=(map.steps||[]).some(step=>step.moment_selection);
    return `<p class="status-line" role="status" data-journey-needs-confirmation>${c.previously_confirmed?'內容改過，需要重新確認。':moments?'先改好旅程，再勾選想發展解方的時刻並按「為選定歷程發展解方」；勾選的時刻就是採用；確認後按「建立藍圖」。可以不勾任何時刻。':'檢視並選擇適用的 Solution；確認後按「建立藍圖」。可以不選任何 Solution。'}</p>${error}`;
  }
  if(c.state==='confirmed')return `<p class="status-line" role="status" data-journey-confirmed>旅程已確認。</p>${error}`;
  return `<p class="status-line" role="status" data-journey-needs-confirmation>${c.previously_confirmed?'確認之後又改過內容，需要重新確認。':'檢視完、改好之後按「確認歷程」；確認後會前往服務藍圖，還沒有服務藍圖時接著產生。'}</p>${error}`;
}
async function refreshJourneyRuntime(){
  try{const b=await fetchBootstrapPayload(S.cur);if(b&&b.workbench&&b.workbench.contract_status==='supported')S.workbench=b.workbench;}catch(_){}
}
// 研究者改完一格直接按「確認歷程」時，blur 觸發的存檔與確認會同時送出；確認要先等
// 存檔回來，拿存檔後的版本確認，否則會確認到改之前的那一版。
function saveJourneyCandidateField(el){
  S.journeyCandidateSave=trackJourneySave((S.journeyCandidateSave||Promise.resolve()).then(()=>_saveJourneyCandidateField(el)));
  return S.journeyCandidateSave;
}
async function _saveJourneyCandidateField(el){
  const d=el.dataset,value=(el.tagName==='TEXTAREA'?el.value:el.textContent).trim();
  const before=el.dataset.jcOriginal!==undefined?el.dataset.jcOriginal:null;
  const body={run:S.cur,kind:d.jcKind,step_id:d.jcStep,stage_id:d.jcStage,value};
  if(d.jcIndex!==undefined)body.index=Number(d.jcIndex);
  if(d.jcTouchpoint!==undefined)body.touchpoint_index=Number(d.jcTouchpoint);
  if(d.jcChannel!==undefined)body.channel=d.jcChannel;
  if(d.jcSolutionId!==undefined)body.solution_id=d.jcSolutionId;
  if(d.jcKind==='candidate_delivery_add')S.journeyChannelAdd={...(S.journeyChannelAdd||{}),[`${d.jcStep}|${d.jcChannel}`]:false};
  if(d.jcKind==='pain_point_add')S.journeyPainAdd={...(S.journeyPainAdd||{}),[d.jcStep]:false};
  if(before===value){if(d.jcKind==='candidate_delivery_add'||d.jcKind==='pain_point_add')render();return;}
  try{
    const r=await decisionFetch('journey','/api/journey-candidate/field',body);
    const res=await r.json();
    if(!r.ok||res.error)keepUnsavedInput(journeyFieldKey(d),value);
    if(!r.ok||res.error)throw new Error(res.error||'沒有存到');
    S.journeyChannelMap=res;S.journeyCandidateError=null;dropUnsavedInput(journeyFieldKey(d));
    // solution-reconfirmation：旅程改了，服務藍圖站的狀態也要重新讀。
    await loadAsIsBuild();await refreshJourneyRuntime();
  }catch(error){S.journeyCandidateError='沒有存到：'+researcherSafeError(error.message,'請稍後再試。');}
  render();
}
async function confirmJourneyCandidate(){
  if(!S.cur||S.journeyCandidateBusy)return;
  S.journeyCandidateBusy=true;S.journeyCandidateError=null;
  await (S.journeyCandidateSave||Promise.resolve());
  const c=((S.journeyChannelMap||{}).confirmation)||{};
  if(!c.journey_digest||S.journeyCandidateError){S.journeyCandidateBusy=false;render();return;}
  render();
  try{
    const r=await scopedPost('/api/journey-candidate/confirm',{run:S.cur,journey_digest:c.journey_digest});
    const res=await r.json();
    if(!r.ok||res.error)throw new Error(res.error||'確認沒有存到');
    S.journeyChannelMap=res;
    await refreshJourneyRuntime();
  }catch(error){const text=researcherSafeError(error.message,'請稍後再試。');S.journeyCandidateError=text.startsWith('沒有確認：')?text:'沒有確認：'+text;S.journeyCandidateBusy=false;render();return;}
  S.journeyCandidateBusy=false;
  // 確認只保存（2026-10-02 研究者裁定），不啟動任何 AI 工作；cjm-builds-sbp：停在顧客旅程，
  // 主按鈕換成「建立藍圖」，由研究者自己按。
  await loadAsIsBuild();
  render();
}
function openJourneyCandidateEvidence(column,invoker){
  const map=S.journeyChannelMap||{},step=(map.steps||[])[column];if(!step)return;
  const records=(map.step_evidence||[])[column]||[];
  const body=records.length?journeyEvidenceRecordsHTML(records):'<p class="empty">這一步沒有連到原文。</p>';
  openInspector({kind:'journey-cell-source',id:String(column),title:`「${step.label}」這一步的原文`,relatedNodeIds:[]},body,invoker);
}
// confirm-persona-starts-journey：從 Persona 確認直接接著呼叫，屬於「機會性」
// 觸發——旅程已經存在或已經有候選時，伺服器一律回 409 且不動任何檔案，這種
// 情況不是這次點擊失敗，靜默略過即可，不當成錯誤攤在畫面上。
async function keepJourneyAgainstPersona(){
  if(!S.cur||S.journeyKeepBusy)return;
  S.journeyKeepBusy=true;S.journeyKeepError=null;render();
  try{
    const r=await decisionFetch('journey','/api/journey/persona-basis/retain',{run:S.cur});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||'沒有記下來。');
    S.journeyChannelMapRun=null;await loadJourneyChannelMap();await refreshJourneyRuntime();
  }catch(error){S.journeyKeepError=noSaveText(researcherSafeError(error.message,'沒有記下來，請再試一次。'));}
  S.journeyKeepBusy=false;render();
}
async function startJourneyBuild(opts){
  const silent=!!(opts&&opts.silent);
  if(!S.cur||S.poll||S.journeyBuildBusy)return;
  S.journeyBuildBusy=true;S.journeyBuildError=null;S.journeyBuildJob={state:'running',phase:'正在建立顧客旅程'};render();
  let accepted;
  try{
    // resolve-stale-at-researcher-gates：只有「依目前 Persona 重新建立顧客旅程」會換掉既有旅程。
    const r=await fetch('/api/build-journey',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run:S.cur,execution:executionPayload(),rebuild:!!(opts&&opts.rebuild)})});
    accepted=await r.json();
    if(!r.ok||accepted.error){
      if(silent){S.journeyBuildBusy=false;S.journeyBuildJob=null;render();return;}
      throw new Error(accepted.error||'建立顧客旅程未能開始。');
    }
  }catch(error){
    if(silent){S.journeyBuildBusy=false;S.journeyBuildJob=null;render();return;}
    S.journeyBuildBusy=false;S.journeyBuildJob=null;S.journeyBuildError=researcherSafeError(error.message,'建立顧客旅程未能開始。');render();return;
  }
  watchJourneyBuildJob();
}
function watchJourneyBuildJob(){
  S.poll=setInterval(async()=>{
    let status;try{status=await fetchJobStatus();}catch(_){return;}
    if(status.state==='running'){S.journeyBuildJob=status;render();return;}
    clearInterval(S.poll);S.poll=null;S.journeyBuildBusy=false;S.journeyBuildJob=null;
    if(status.state==='failed')S.journeyBuildError=(status.failure||{}).what_happened||'建立顧客旅程沒有完成。';
    else if(status.state==='waiting_for_model')S.journeyBuildError='已經把提示詞準備好，等模型回覆。';
    S.journeyChannelMapRun=null;await loadJourneyChannelMap();
  },1200);
}
// cjm-experience-and-moment-solutions：只對研究者勾選的時刻發展解方。
async function startJourneySolutionsBuild(){
  if(!S.cur||S.journeySolutionsJob)return;
  if(S.poll){S.journeySolutionsError='目前有其他工作正在進行，完成後再按一次。';render();return;}
  await (S.journeyCandidateSave||Promise.resolve());
  S.journeySolutionsError=null;S.journeySolutionsJob={state:'running',phase:'正在發展解方'};render();
  try{
    const r=await fetch('/api/build-journey-solutions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run:S.cur,execution:executionPayload()})});
    const accepted=await r.json();
    if(!r.ok||accepted.error)throw new Error(accepted.error||'發展解方未能開始。');
  }catch(error){S.journeySolutionsJob=null;S.journeySolutionsError=researcherSafeError(error.message,'發展解方未能開始。');render();return;}
  watchJourneySolutionsJob();
}
function watchJourneySolutionsJob(){
  S.poll=setInterval(async()=>{
    let status;try{status=await fetchJobStatus();}catch(_){return;}
    if(status.state==='running'){S.journeySolutionsJob=status;render();return;}
    clearInterval(S.poll);S.poll=null;S.journeySolutionsJob=null;
    if(status.state==='failed')S.journeySolutionsError=(status.failure||{}).what_happened||'發展解方沒有完成，旅程沒有變動。';
    else if(status.state==='waiting_for_model')S.journeySolutionsError='已經把提示詞準備好，等模型回覆。';
    S.journeyChannelMapRun=null;await loadJourneyChannelMap();await refreshJourneyRuntime();render();
  },1200);
}
// 建立（或重新建立）顧客旅程時，不論畫面目前是空的還是已有一份旅程，都在上方
// 顯示伺服器回報的進度與經過時間。空的那一頁自己已經帶著這段，不重複。
function journeyBuildRunningHTML(){
  const job=S.journeyBuildJob;
  return job&&job.state==='running'?processingIndicatorHTML(researcherPhase(job.phase,'正在建立顧客旅程'),'journey-build-progress',jobElapsedText()):'';
}
function viewJourneyMap(){
  const html=viewJourneyMapBody(),map=S.journeyChannelMap;
  return map&&map.state==='not_generated'?html:journeyBuildRunningHTML()+html;
}
function viewJourneyMapBody(){
  const pendingProposal=!S.cur&&S.journeyFlowActive&&!!S.selectedCase&&S.journeySteps.length>0;
  if(!S.cur&&!pendingProposal)return `<section class="card"><h2>顧客旅程</h2><p class="empty">還沒有選定案例，沒有東西可以呈現。</p></section>`;
  const map=pendingProposal?JOURNEY_PROPOSAL_MAP:S.journeyChannelMap;
  if(!map)return `<p class="status-line">載入中⋯</p>`;
  if(map.state==='candidate')return journeyCandidateHTML(map);
  if(map.state==='not_generated'&&map.build)return journeyBuildEmptyHTML(map.build);
  if(map.state==='not_generated')return `<section class="card"><h2>顧客旅程</h2><p class="empty">這個案例還沒有產出可呈現的資料。</p></section>`;
  if(!S.selectedCase)return journeyNoCaseHTML();
  const steps=journeyColumnSteps();
  syncJourneyColumnBindings(steps,map);
  const invalidLabels=invalidJourneyLabels(steps);
  return `<section class="card cjm-workspace" data-journey-editor>
    <div id="journey-state-disclosure">${journeyDisclosureHTML()}</div>
    <p class="cjm-map-heading"><b>CUSTOMER JOURNEY MAP</b><span>每一格都可以直接點開編輯；步驟之間可插入。</span></p>
    <div class="cjm-table-region" tabindex="0" aria-label="可水平捲動的顧客旅程圖">${journeyMapTableHTML(map,steps)}</div>
    ${journeyPopoverHTML()}
    <div class="warn" id="journey-validation-summary" role="alert" tabindex="-1" ${invalidLabels.length?'':'hidden'}></div>
    ${journeyNoteHTML()}
  </section>`;
}
async function loadReport(){
  if(!S.cur)return;
  await loadAsIsBuild();
  S.viewingVersion=null;
  S.report=null;
  // A build state means this run has no Blueprint draft yet; asking for one would
  // only come back as a not-found request on every station load.
  const d=S.asIsBuild?{error:'not_generated'}:await scopedJSON('/api/run?name='+encodeURIComponent(S.cur));
  S.report=d.error?null:d;S.reportRun=S.report?S.cur:null;
  validateSelectionAfterRefresh();
  S.relationMode='bundled';S.relationFocus=null;S.relationBundle=null;
  S.blueprintView={scale:null,tx:24,ty:24,drag:null,scene:null};
  S.diagram={scale:null,tx:0,ty:0,type:'',source:'',selected:null,scene:null,drag:null};
  renderReportIntoPage();
  _syncRunStatusPollState();
  loadVersions();
}

async function loadVersions(){
  if(!S.cur||S.viewingVersion)return;
  try{
    const d=await scopedJSON('/api/versions?run='+encodeURIComponent(S.cur));
    S.versions=d.versions||[];
    if(S.step===stageStepById('review-as-is')&&S.report)renderReportIntoPage();
  }catch(_){S.versions=[];}
}

async function openSavedVersion(id){
  if(!S.cur)return;
  const d=await(await fetch('/api/saved-version?run='+encodeURIComponent(S.cur)+'&id='+encodeURIComponent(id))).json();
  if(d.error){alert('無法開啟版本：'+d.error);return;}
  S.report=d;S.viewingVersion=d.viewing_version||null;
  S.blueprintView={scale:null,tx:24,ty:24,drag:null,scene:null};
  S.diagram={scale:null,tx:0,ty:0,type:'',source:'',selected:null,scene:null,drag:null};
  renderReportIntoPage();_syncRunStatusPollState();
}

function renderReportIntoPage(){
  const rep=$('#rep');
  if(S.workbench)renderReviewGate();
  // sbp-status-render-consistency：狀態可能在這一站第一次畫面之後才載入；上方狀態區跟藍圖本體一起
  // 依已載入的狀態整段重畫（與 viewOut() 同條件：還沒有藍圖時為空），不重畫整頁與側欄。
  const status=$('#as-is-station-status');
  if(status)status.innerHTML=S.asIsBuild?'':asIsStationStatusHTML();
  // fix-empty-blueprint-reads-unreadable：還沒有藍圖但可以建立時，放與 viewOut() 同一段建立說明，
  // 不要在載入完成後把它換成「讀不到」。
  if(rep)rep.innerHTML=S.report?renderAsIsContent(S.report)
    :S.asIsBuild?asIsBuildEmptyHTML(S.asIsBuild)
    :`<section class="card"><p class="empty">讀不到</p></section>`;
  wire();
}

boot().then(()=>{if(S.cur){/* 讓使用者自己切到產出頁再載入 */}});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&S.inspectorOpen){event.preventDefault();closeInspector();return;}
  if(event.key!=='Tab'||!S.inspectorOpen||viewportWidth()>=1600)return;
  const items=[...document.querySelectorAll('#inspector button:not([disabled]),#inspector [href],#inspector input:not([disabled]),#inspector select:not([disabled]),#inspector textarea:not([disabled]),#inspector [tabindex]:not([tabindex="-1"])')].filter(item=>!item.hidden);
  if(!items.length){event.preventDefault();$('#inspector-title').focus();return;}
  const first=items[0],last=items[items.length-1],active=document.activeElement;
  if(event.shiftKey&&(active===first||!items.includes(active))){event.preventDefault();last.focus();}
  else if(!event.shiftKey&&(active===last||!items.includes(active))){event.preventDefault();first.focus();}
});
if(window.addEventListener){window.addEventListener('resize',updateInspectorMode);window.addEventListener('resize',()=>requestAnimationFrame(drawAsIsGridLines));}
