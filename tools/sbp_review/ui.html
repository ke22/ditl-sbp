.research-explanation section{padding:var(--wb-space-4);border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius)}
.research-explanation h3{margin:0 0 6px;font-size:12px;color:var(--wb-text-muted)}.research-explanation p{margin:0;font-size:14px;color:var(--wb-text-secondary)}
.research-counts{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:var(--wb-space-3);margin:0}
.research-counts div{padding:var(--wb-space-4);border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-surface-raised)}
.research-counts dt{font-size:12px;color:var(--wb-text-muted)}.research-counts dd{margin:3px 0 0;font-size:24px;font-weight:750;color:var(--wb-to-be)}
.research-disclosure{display:grid;gap:10px;margin-top:var(--wb-space-4)}
.research-record{width:100%;padding:14px 16px;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-surface-work);color:var(--wb-text-primary);font:inherit;text-align:left;cursor:pointer}
.research-record span{display:block;margin-bottom:4px;color:var(--wb-to-be);font-size:11px;font-weight:800;letter-spacing:.04em}.research-record strong{display:block;font-size:14px}.research-record p{margin:6px 0 0;color:var(--wb-text-secondary);font-size:13px}
.research-boundary{margin-top:var(--wb-space-6);padding:var(--wb-space-4);border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-to-be-surface);font-size:13px}
@media(max-width:1199px){.research-explanation{grid-template-columns:1fr}.research-state{padding:var(--wb-space-6)}.research-state-head{grid-template-columns:1fr}}
.fixture-journey-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.fixture-journey-step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;width:100%;padding:12px;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-surface-work);color:var(--wb-text-primary);font:inherit;text-align:left;cursor:pointer}.fixture-journey-step b{color:var(--wb-as-is);font-size:12px}.fixture-journey-step span{font-size:14px;line-height:1.5}
.workbench-shell.inspector-open::before{content:"";position:fixed;z-index:60;inset:var(--wb-case-height) 0 var(--wb-gate-min-height) var(--nav-col);background:rgba(31,37,48,.22)}
.bootstrap-error{max-width:680px;margin:56px auto;padding:32px;border:1px solid var(--wb-border-warning);border-radius:var(--wb-radius);background:var(--wb-surface-work)}
.bootstrap-error h1{font-size:24px}.bootstrap-error p{color:var(--wb-text-secondary)}
.auth-login{max-width:520px;margin:56px auto;padding:32px;border:1px solid var(--wb-border-subtle);border-top:4px solid var(--wb-as-is);border-radius:var(--wb-radius);background:var(--wb-surface-work)}
.auth-login h1{margin:0 0 10px;font-size:24px}.auth-login p{color:var(--wb-text-secondary);line-height:1.6}.auth-login label{display:block;margin:20px 0 8px;font-weight:700}.auth-login input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--wb-border-strong);border-radius:6px;background:var(--wb-surface-work);color:var(--wb-text-primary);font:inherit}.auth-login .actions{margin-top:16px}.auth-login .status{margin-top:14px;color:var(--wb-text-secondary)}
.workbench-shell[data-contract-status="unsupported"] #stage-navigation,.workbench-shell[data-contract-status="unsupported"] #review-gate{display:none}
.workbench-shell[data-contract-status="unsupported"]{grid-template-columns:1fr;grid-template-areas:"case" "work" "work"}
*:focus-visible{outline:2px solid var(--wb-focus);outline-offset:2px}
@media(min-width:1600px){
  .workbench-shell.inspector-open{grid-template-columns:var(--nav-col) minmax(0,1fr) var(--wb-inspector-width);grid-template-areas:"case case case" "nav work inspect" "nav gate inspect"}
  .workbench-shell.inspector-open #inspector{position:relative;inset:auto;width:auto;margin:12px 12px 12px 0;box-shadow:none}
  .workbench-shell.inspector-open::before{display:none}
}
@media(max-width:1023px){
  #case-context{gap:10px;padding-inline:14px}
#page-header,#main,#review-gate{padding-inline:20px}
  #inspector{left:calc(var(--nav-col) + 12px);right:12px;width:auto}
}
/* rework-shell-and-project-home：側欄預設收合成編號，按「»」才展開站名（2026-09-27 版面稿）。 */
.stage-nav-toggle{display:grid;place-items:center;width:44px;height:36px;margin:0 auto 14px;padding:0;border:1px solid var(--wb-border-strong);border-radius:var(--wb-radius);background:var(--wb-surface-work);color:var(--wb-text-primary);font:inherit;cursor:pointer}
.workbench-shell.nav-expanded .stage-nav-toggle{margin:0 0 14px 8px}
.workbench-shell:not(.nav-expanded) :is(.stage-nav-heading,.stage-copy,.stage-blocked-reason,.app-copyright){position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.workbench-shell:not(.nav-expanded) #stage-navigation{padding-inline:12px}
.workbench-shell:not(.nav-expanded) .stage-nav-list{gap:20px}
.workbench-shell:not(.nav-expanded) .stage-nav-button{place-items:center;grid-template-columns:1fr;padding:0;background:transparent}
.workbench-shell:not(.nav-expanded) .stage-nav-button::after{display:none}
.workbench-shell:not(.nav-expanded) .stage-index{width:40px;height:40px;background:var(--wb-surface-work)}
.workbench-shell:not(.nav-expanded) .stage-nav-button[aria-current="step"] .stage-index{background:var(--wb-accent)}
.workbench-shell.nav-expanded{--nav-col:232px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:0ms!important;animation-iteration-count:1!important;transition-duration:0ms!important}.research-phase-track::after{width:100%;transform:none!important}}

/* rework-shell-and-project-home：首頁先開新專案、再列跑過的專案（2026-09-27 版面稿）。 */
.home-section{max-width:1270px;margin:0 0 var(--wb-space-10)}
.home-section h2{margin:0 0 var(--wb-space-4);font-size:var(--wb-type-section-size);font-weight:var(--wb-type-section-weight)}
.file-chooser{max-width:840px;display:flex;align-items:center;gap:var(--wb-space-4);padding:10px 10px 10px var(--wb-space-5);border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-surface-raised)}
.file-chooser-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--wb-text-secondary);font-size:var(--wb-type-body-size)}
.file-chooser.has-files .file-chooser-text{color:var(--wb-text-primary)}
.home-intake-actions{display:flex;align-items:center;gap:var(--wb-space-4);margin-top:var(--wb-space-4)}
.home-intake-actions .form-note{color:var(--wb-text-secondary);font-size:var(--wb-type-small-size)}
.home-intake button.go{background:var(--wb-action-primary);color:var(--wb-action-primary-text)}
.home-intake button.go:disabled{background:var(--wb-surface-selected);color:var(--wb-text-muted)}
/* 專案卡片的 ⋯ 選單、改名／刪除對話框、處理中遮罩與完成提示。 */
.project-card{position:relative}
.project-more{position:absolute;top:8px;right:8px;width:32px;height:32px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--wb-text-secondary);font-size:18px;line-height:1;cursor:pointer}
.project-more:hover,.project-more[aria-expanded="true"]{background:var(--wb-surface-hover)}
.project-menu{position:absolute;top:42px;right:8px;z-index:20;min-width:168px;margin:0;padding:6px;list-style:none;border:1px solid var(--wb-border-subtle);border-radius:8px;background:var(--wb-surface-raised);box-shadow:0 8px 24px rgba(15,25,45,.14)}
.project-menu button,.project-menu a{display:block;width:100%;box-sizing:border-box;padding:8px 10px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:14px;color:inherit;text-align:left;text-decoration:none;cursor:pointer}
.project-menu button:hover,.project-menu a:hover{background:var(--wb-surface-hover)}
.project-menu hr{margin:6px 2px;border:0;border-top:1px solid var(--wb-border-subtle)}
.project-menu .danger{color:var(--wb-status-failed)}
.project-pin{font-size:var(--wb-type-small-size);color:var(--wb-text-secondary)}
#modal-host,#busy-overlay{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:rgba(14,22,40,.36)}
#modal-host[hidden],#busy-overlay[hidden]{display:none}
.modal-panel{box-sizing:border-box;max-width:440px;width:100%;max-height:calc(100vh - 48px);overflow-y:auto;padding:22px 24px;border-radius:12px;background:var(--wb-surface-raised);border:1px solid var(--wb-border-subtle);box-shadow:0 18px 44px rgba(14,22,40,.24)}
.modal-panel h2{margin:0 0 10px;font-size:18px}
.modal-panel p{margin:0 0 10px;line-height:1.7}
.modal-panel input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--wb-border-strong);border-radius:6px;font:inherit;background:var(--wb-surface-work);color:var(--wb-text-primary)}
/* The text-input rule above must not stretch checkboxes and radios (it squeezed the export choices). */
.modal-panel input[type=checkbox],.modal-panel input[type=radio]{width:auto;flex:none;margin:0;padding:0;border:0;background:none}
.modal-panel .actions{margin-top:16px;display:flex;justify-content:flex-end;gap:8px}
.modal-panel .modal-error{color:var(--wb-status-failed);font-size:13px}
button.danger-action{background:var(--wb-status-failed);color:#fff;border-color:transparent}
.busy-panel{display:flex;align-items:center;gap:12px;padding:18px 22px;border-radius:12px;background:var(--wb-surface-raised);box-shadow:0 18px 44px rgba(14,22,40,.24);font-size:15px}
.busy-spinner{width:18px;height:18px;border:2px solid var(--wb-border-subtle);border-top-color:var(--wb-text-primary);border-radius:50%;animation:busy-spin .9s linear infinite}
@keyframes busy-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.busy-spinner{animation:none}}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;padding:10px 16px;border-radius:8px;background:var(--wb-text-primary);color:var(--wb-surface-raised);font-size:14px;box-shadow:0 8px 24px rgba(15,25,45,.2)}
#toast[hidden]{display:none}
.home-name-field{display:flex;flex-direction:column;gap:6px;margin-top:var(--wb-space-4)}
.home-name-field h3{margin:0;font-size:15px}
.home-name-field label{font-size:13px;color:var(--wb-text-secondary)}
.home-name-field input{max-width:420px;padding:9px 10px;border:1px solid var(--wb-border-strong);border-radius:6px;font:inherit;background:var(--wb-surface-work);color:var(--wb-text-primary)}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--wb-space-5);margin:0}
.project-card{border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius-card);background:var(--wb-surface-raised)}
.project-card.open{border-color:var(--wb-border-selected)}
.project-face{width:100%;min-height:116px;display:flex;flex-direction:column;justify-content:center;gap:10px;
  padding:var(--wb-space-5) var(--wb-space-6);border:0;background:transparent;cursor:pointer;text-align:left;font:inherit;color:inherit}
.project-face b{font-size:var(--wb-type-card-size);font-weight:var(--wb-type-card-weight)}
.project-meta{font-size:var(--wb-type-small-size);color:var(--wb-text-secondary)}
.project-versions{list-style:none;margin:0;padding:0 var(--wb-space-3) var(--wb-space-3);display:flex;flex-direction:column;gap:6px}
.project-versions li{position:relative;display:flex;align-items:center;gap:4px}
.project-versions .project-version{flex:1;min-width:0}
.version-more{flex:none;width:32px;height:32px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--wb-text-secondary);font-size:18px;line-height:1;cursor:pointer}
.version-more:hover,.version-more[aria-expanded="true"]{background:var(--wb-surface-hover)}
.project-menu.version-menu{top:38px;right:0;max-width:240px}
.version-menu-note{padding:4px 10px 6px;font-size:12px;color:var(--wb-text-secondary)}
.archived-versions summary{padding:var(--wb-space-3);cursor:pointer;color:var(--wb-text-secondary)}
.project-version{width:100%;min-height:var(--wb-control-height);padding:8px 12px;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);
  background:var(--wb-surface-work);cursor:pointer;font:inherit;font-size:var(--wb-type-small-size);color:inherit;text-align:left;font-variant-numeric:tabular-nums}
.project-version:hover{background:var(--wb-surface-hover)}
.workbench-shell.gate-hidden{grid-template-rows:var(--wb-case-height) minmax(0,1fr) 0}
.workbench-shell.gate-hidden #review-gate{display:none}
/* 頂欄叫出的側拉面板：輸出、設定。點外面、按 Esc、按關閉都會關。 */
.shell-panel-scrim{position:fixed;z-index:80;inset:var(--wb-case-height) 0 0 0}
.shell-panel{position:fixed;z-index:81;top:var(--wb-case-height);right:0;bottom:0;overflow:auto;padding:var(--wb-space-6);
  border-left:1px solid var(--wb-border-strong);background:var(--wb-surface-raised)}
.settings-panel{width:min(420px,100vw)}
.shell-panel h2{margin:0 0 var(--wb-space-5);font-size:var(--wb-type-section-size);font-weight:var(--wb-type-section-weight)}
.shell-panel h3{margin:0 0 6px;font-size:var(--wb-type-card-size);font-weight:var(--wb-type-card-weight)}
.text-link{padding:0;border:0;background:transparent;color:var(--wb-text-link);font:inherit;font-size:var(--wb-type-small-size);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.settings-section{margin:0 0 var(--wb-space-6)}
.settings-section .form-note{margin:0 0 var(--wb-space-3);color:var(--wb-text-secondary);font-size:var(--wb-type-small-size)}
.settings-account{margin:0 0 6px;color:var(--wb-text-secondary)}
.terminology-reference{margin:0 0 var(--wb-space-6);border-block:1px solid var(--wb-border-subtle);padding:var(--wb-space-4) 0}
.terminology-reference>summary{cursor:pointer;font-weight:var(--wb-type-card-weight);font-size:var(--wb-type-card-size)}
.terminology-reference>summary:focus-visible{outline:2px solid var(--wb-focus);outline-offset:4px}
.terminology-reference label{display:block;margin:var(--wb-space-4) 0 6px;font-size:var(--wb-type-small-size)}
.terminology-reference input{width:100%;box-sizing:border-box;min-height:40px;padding:8px 10px;border:1px solid var(--wb-border-strong);border-radius:var(--wb-radius-card);background:var(--wb-surface-work);color:var(--wb-text-primary);font:inherit}
.terminology-reference .form-note{margin:var(--wb-space-3) 0;font-size:var(--wb-type-small-size);color:var(--wb-text-secondary);line-height:1.7}
.terminology-group{margin-top:var(--wb-space-5)}
.terminology-group h4{margin:0 0 var(--wb-space-3);font-size:var(--wb-type-card-size)}
.terminology-group dl{margin:0}
.terminology-entry{padding:var(--wb-space-3) 0;border-bottom:1px solid var(--wb-border-subtle);overflow-wrap:anywhere}
.terminology-entry dt{font-weight:var(--wb-type-card-weight);font-size:var(--wb-type-small-size)}
.terminology-entry dd{margin:6px 0 0;line-height:1.75;font-size:var(--wb-type-small-size)}
.terminology-entry .terminology-alias,.terminology-entry .terminology-note{color:var(--wb-text-secondary)}
.feedback-form label{display:block;margin:14px 0 7px;font-size:13px;font-weight:800}
.feedback-form textarea{width:100%;min-height:100px;box-sizing:border-box;padding:9px 10px;border:1px solid var(--wb-border-strong);border-radius:6px;background:var(--wb-surface-work);color:var(--wb-text-primary);font:inherit;line-height:1.5;resize:vertical}
.feedback-form .inline-check{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:13px;font-weight:600}
.feedback-form .inline-check input{margin-top:3px}
.feedback-form .form-note{margin:8px 0 0;color:var(--wb-text-secondary);font-size:12px;line-height:1.5}
.feedback-form .feedback-error{margin:10px 0 0;color:var(--wb-status-failed);font-size:13px}
.selective-export-list{display:grid;gap:8px;margin:14px 0}
.selective-export-list label{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center;justify-content:flex-start;margin:0;padding:9px 10px;border:1px solid var(--wb-border-subtle);border-radius:6px;font-size:13px;font-weight:600;text-align:left}
.selective-export-list label .inspector-meta{flex-basis:100%;margin:0 0 0 22px;font-weight:400}
.selective-export-format{display:flex;gap:16px;margin:14px 0 0;font-size:13px}
.selective-export-format label{display:flex;gap:7px;align-items:center}
/* HMW 候選 */
.hmw-candidate{border:1px solid var(--line);border-radius:var(--wb-radius-card);padding:var(--wb-space-5);margin:var(--wb-space-3) 0;cursor:pointer}
.hmw-rationale{display:flex;flex-direction:column;gap:var(--wb-space-2);margin-top:var(--wb-space-3);font-size:var(--wb-type-small-size);cursor:auto}
.hmw-rationale textarea,.hmw-self textarea{width:100%;box-sizing:border-box;font:inherit;line-height:var(--wb-line-body)}
.hmw-self-open{display:block;width:100%;margin-top:var(--wb-space-5);padding:var(--wb-space-5);text-align:left;border:1px solid var(--line);border-radius:var(--wb-radius-card);background:var(--wb-surface-raised);color:var(--wb-text-primary);font-weight:var(--wb-type-card-weight);cursor:pointer;min-height:auto}
.hmw-self-open:hover{background:var(--wb-surface-hover)}
.hmw-self.picked{border:2px solid var(--wb-border-selected)}
.hmw-self h3{margin:0 0 var(--wb-space-2);cursor:pointer}
.hmw-self-note{margin:0;color:var(--wb-text-secondary);font-size:var(--wb-type-small-size)}
.hmw-candidate.picked{border-color:var(--wb-border-selected)}
.hmw-candidate h3{margin:0 0 8px;font-size:15.5px;line-height:1.6}
.hmw-line{margin:0 0 6px;font-size:14px;line-height:1.7}
.hmw-self label{display:block;margin:14px 0 6px;font-size:var(--wb-type-small-size);font-weight:var(--wb-type-card-weight);color:var(--wb-text-primary)}
.hmw-self textarea,.hmw-self select{display:block;width:100%;max-width:100%;box-sizing:border-box}
.hmw-self-formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 4px;font-size:var(--wb-type-card-size);font-weight:var(--wb-type-card-weight);color:var(--wb-text-primary)}
.hmw-self-formula input{flex:1 1 220px;min-width:0;min-height:var(--wb-control-height);padding:0 12px;border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius);background:var(--wb-surface-raised);font:inherit;font-weight:var(--wb-type-body-weight)}
.hmw-tension{margin:0 0 8px;color:var(--wb-text-secondary);font-size:var(--wb-type-body-size);line-height:var(--wb-line-body)}
.hmw-line b{display:inline-block;min-width:5.5em;color:var(--wb-text-secondary);font-weight:500}
.hmw-self{margin-top:var(--wb-space-5);padding:var(--wb-space-5);border:1px solid var(--line);border-radius:var(--wb-radius-card)}

.stage-runner{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:4px}
.stage-runner p{margin:0;font-size:14.5px;line-height:1.8}
.stage-runner-wait{color:var(--wb-as-is);font-weight:500}
.stage-runner-hint{color:var(--wb-text-secondary);font-size:14px}
.stage-runner-log{width:100%}
.stage-runner-log pre{margin:6px 0 0;padding:10px 12px;background:var(--wb-surface-raised);
  border:1px solid var(--line);border-radius:6px;font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre-wrap}

/* Persona 站：左軸清單、右矩陣、下卡片 */
.pm-layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
.pm-inputs>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:4px}
.pm-inputs>summary::-webkit-details-marker{display:none}
.pm-inputs>summary h3{margin:0}
.pm-inputs>summary h3::after{content:' ▸';color:var(--muted);font-weight:400}
.pm-inputs[open]>summary h3::after{content:' ▾'}
.pm-inputs-summary{color:var(--muted);font-size:13px}
.pm-inputs[open]>summary{margin-bottom:12px}
.pm-axis-list ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.pm-axis{display:grid;grid-template-columns:auto auto 1fr;gap:6px 8px;align-items:baseline;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--wb-radius-card);background:var(--surface,var(--wb-surface-raised));cursor:pointer}
/* converge-coding-hmw-persona-presentation：軸只是看矩陣的設定，用中性深色；這一站的
   決定是目標族群，只有目標象限（.pm-primary）用強調色。 */
/* fix-walkthrough-ui-feedback：選中的軸整塊用強調色標出（研究者 2026-09-27，取代 2026-09-26 的中性樣式），不用左側色條。 */
.pm-axis.picked{border-color:var(--wb-border-selected);background:var(--wb-accent-tint)}
.pm-axis:hover{border-color:var(--wb-border-strong)}
.pm-axis:focus-visible{outline:2px solid var(--wb-focus);outline-offset:1px}
.pm-axis-limit-notice{margin:6px 0;font-size:12.5px;color:var(--amber)}
.pm-confirm-light{margin-top:10px}
.pm-letter{font-weight:700;color:var(--wb-text-secondary)}
.pm-axis-name{font-weight:600;font-size:14.5px}
.pm-axis-poles{grid-column:1/4;font-size:12.5px;line-height:1.7;color:var(--wb-text-secondary)}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// embed-persona-matrix-selection-screens: ported verbatim from
// tools/workbench/ui.html's own withPreservedTextareas() (same signature,
// same algorithm) -- a toggle that changes what a form represents (which
// two axes are selected, which quadrant is primary) mutates state and does
// a full render(), which would otherwise wipe any textarea a researcher is
// mid-typing into. Snapshot each named textarea's value and an "identity"
// tuple describing what it currently means before the mutation; after the
// re-render, restore the value only into a selector whose identity is
// unchanged, so a rationale written for one pair of axes never silently
// carries over onto a different pair.
function withPreservedTextareas(identityBefore,selectors,action){
  const before=identityBefore();
  const saved=selectors.map(sel=>{const el=document.querySelector(sel);return el?el.value:null;});
  action();
  render();
  const after=identityBefore();
  selectors.forEach((sel,i)=>{
    if(saved[i]&&before[i]===after[i]){
      const el=document.querySelector(sel);
      if(el){el.value=saved[i];el.dispatchEvent(new Event('input'));}
    }
  });
}
// 資料檔（data_profile／blank_note 等）裡偶爾會寫 **粗體** 強調重點，
// 逐字印出星號沒有意義——escape 完再轉換，順序不能反過來。
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
// surface-generation-usage-in-review-ui：只給花費時間／內容量一個人話標籤，
// 絕不能連著 provider／model 一起顯示（既有規則：正常畫面不能出現這兩者）。
const USAGE_STAGE_LABELS={align:'萃取',journey:'歷程',compare:'比對',structure:'建模'};
function generationUsageHTML(d){
  const usage=(d.meta&&d.meta.usage)||{};
  const stages=Object.keys(USAGE_STAGE_LABELS).filter(stage=>usage[stage]);
  if(!stages.length)return '';
  const rows=stages.map(stage=>{
    const u=usage[stage]||{};
    return `<tr><td>${esc(USAGE_STAGE_LABELS[stage])}</td><td class="num">${esc(String(u.seconds??0))} 秒</td><td class="num">${esc(String(u.tokens??0))}</td></tr>`;
  }).join('');
  let totalRow='';
  if(stages.length>1){
    const totalSeconds=stages.reduce((sum,stage)=>sum+(usage[stage].seconds||0),0);
    const totalTokens=stages.reduce((sum,stage)=>sum+(usage[stage].tokens||0),0);
    totalRow=`<tr class="sum"><td>合計</td><td class="num">${esc(String(totalSeconds))} 秒</td><td class="num">${esc(String(totalTokens))}</td></tr>`;
  }
  return `<details class="generation-usage"><summary>生成明細</summary><table class="usage"><tbody><tr><td>階段</td><td class="num">花費時間</td><td class="num">內容量</td></tr>${rows}${totalRow}</tbody></table></details>`;
}
const LAYERS=['實體證據','顧客行動','前台行動','後台行動','支援流程'];
// add-blueprint-layer-colors-and-flow-arrows：一眼分辨「這張卡在哪一層」，跟
// inf／rsrch 那個「這張卡的來源」維度分開疊加，不是取代。
const LAYER_COLOR_CLASS={顧客行動:'layer-customer',前台行動:'layer-front',後台行動:'layer-back',支援流程:'layer-support',實體證據:'layer-evidence'};
// 誰說的／誰做的——三種狀態各對一句人話，畫面不能出現 state 原文
// （distinguish-first-hand-from-reported-claims 2.5）。
const ATTRIBUTION_LABEL={first_hand:'當事人自己說的',reported:'他人轉述',undetermined:'無法判定是誰說的'};
// narrow-inference-flag-to-unsupported-claims：⚑ 角標原本（tier-blueprint-
// review-status-disclosure 決定四）合併矛盾、他人轉述、無法判定是誰說的、無
// 證據推論四種狀況。實測三份真實 run 發現「連到的關係是推論」這個條件常態
// 發生在 28%～100% 的關係上，兩者用 OR 合併後 37%～85% 的卡片都會亮，篩選力
// 等於零；矛盾與轉述內容也已經有待確認清單另外呈現。角標收斂成只剩一種狀況：
// 這張卡自己的 claim 是無證據推論。互動畫布（blueprintCardHTML）跟 SVG 匯出
// 共用同一份列舉跟同一段文字，不要各自寫一份。
const EPISTEMIC_LABEL={inference:'無證據推論'};
const MARKER_CODE={失誤點:'F',等候點:'W',決策點:'D'};
// 角標的唯一產生處。圖例、互動畫布卡片都呼叫這支——這顆徽章原本在三個地方
// 各自手寫，圖例畫成一個裸粗體字母、卡片畫成藏青圓章，同一個 F 兩種長相。
// 圖例裡的徽章不另外給無障礙名稱：它包在一顆已經有 aria-label 的按鈕裡，
// 再給一次只會讓讀屏把同一件事念兩遍。
// 一型一顆，不是一筆一顆。三個等候點是三個位置各自被標到，畫成三顆一模一樣的
// W 分不出彼此，只是把同一件事講三遍。
function cardMarkerTypes(node){
  return [...new Set(((node&&node.markers)||[]).map(marker=>marker.type||'節點標記'))];
}
// narrow-inference-flag-to-unsupported-claims：這顆角標只判斷一件事——這張卡
// 自己的內容有沒有沒有逐字稿撐著的推論。矛盾、他人轉述、無法判定是誰說的三種
// 已經各自有別的地方看（待確認清單／per-claim 歸屬），不再疊進這顆角標；連到
// 這張卡的關係是不是推論，也不再算——那已經是關係線自己的琥珀色虛線在講的事。
function cardEpistemicLabels(hasInferenceFlag){
  return hasInferenceFlag?[EPISTEMIC_LABEL.inference]:[];
}
function markerBadgeHTML(glyph,{title='',ariaLabel='',epistemic=false}={}){
  const cls=epistemic?'marker-badge inference-badge':'marker-badge';
  const a11y=ariaLabel?` title="${esc(title||ariaLabel)}" aria-label="${esc(ariaLabel)}"`:' aria-hidden="true"';
  return `<span class="${cls}"${a11y}>${esc(glyph)}</span>`;
}
// require-marker-specific-reason-note：卡片詳情面板裡兩份標記文字都要用同一
// 種「一則印一行、兩則以上才拆清單」的樣式——一份是類別通用定義（popup() 的
// markerNoteHTML，已去重），一份是每則各自的具體理由（echoedMarkerReasonHTML，
// 不去重）。排版規則相同、內容各自不同，共用這支產生器，不要各寫一份。
function markerReasonListHTML(notes){
  return notes.length===0?''
    :notes.length===1?`<p class="loc marker-note">${esc(notes[0])}</p>`
    :`<ul class="loc marker-note">${notes.map(note=>`<li>${esc(note)}</li>`).join('')}</ul>`;
}
const EPISTEMIC_BADGE_LEGEND_TEXT='⚑ 待確認：卡片內容含'+EPISTEMIC_LABEL.inference+'，點角標／圖示查看詳情';
const ROLE_LABEL={customer:'顧客',provider:'服務人員',included_support:'支援單位',frontstage_delivery:'前台服務',backstage_delivery:'後台作業',internal_support:'內部支援',external_dependency:'外部協力',out_of_scope:'服務範圍外'};
const roleLabel=value=>ROLE_LABEL[value]||value||'角色未註明';
// 「前台行動」「後台行動」是服務設計的行話，泳道標題卻是研究者第一眼就看到的
// 東西——要解釋才懂的詞不該出現在那裡。資料層的值不動（那是 schema 的 layer
// 列舉），只換顯示用的名字：說出誰做的、以及顧客看不看得到。
const LAYER_DISPLAY_NAME={
  '顧客行動':'顧客做的',
  '前台行動':'顧客看得到的店家動作',
  '後台行動':'顧客看不到的店家動作',
  '支援流程':'背後撐著的流程',
  '實體證據':'顧客接觸得到的東西',
};
const layerDisplayName=layer=>LAYER_DISPLAY_NAME[layer]||layer;

// Shostack (1984)／Bitner, Ostrom & Morgan (2008)：五層之間有三條線。
// 線的意義來自有動作穿過它，所以要跟箭頭一起看。
const LINE_AFTER={
  '顧客行動':'互動線',
  '前台行動':'可見線',
  '後台行動':'內部互動線',
};
// remove-internal-ids-and-jargon：relation_layout.js 的 type／routeClass 是給
// 程式邏輯比對用的內部列舉值（rel.type==='sequence' 這種），不能直接印到畫面
// 上——CLAUDE.md 明文禁止。這兩個對照表把它們換成服務設計領域詞彙；找不到對應
// 值一律回傳固定的中文 fallback，絕對不能退回印原始英文字串。
const RELATION_TYPE_LABEL={sequence:'接續',handoff:'交接',supports:'支援',causal:'影響',same_event:'同時發生'};
const RELATION_TYPE_FALLBACK='未分類的關係類型';
const relationTypeLabel=type=>RELATION_TYPE_LABEL[type]||RELATION_TYPE_FALLBACK;
const ROUTE_CLASS_LABEL={'local-interaction':'同格互動','cross-lane-handoff':'跨層交接','cross-stage-dependency':'跨階段關聯','journey-sequence':'歷程順序'};
const ROUTE_CLASS_FALLBACK='未分類的分組方式';
// surface-blank-cell-meaning：同一條規則——coverage_state 是 schema 列舉值，
// 不能直接印到畫面上。
// simplify-inference-markers-and-coverage-states 3.1/3.3：短標籤不再各自宣稱
// 一個具體成因——expected_unverified 背後其實有兩種不同成因（證據被指派到
// 別的步驟／有一個還沒驗證的參照假設），固定寫「內容畫在別的欄位」對後一種
// 成因是誤導。短標籤改成只講「屬於哪個分類」（還要查／已確認不用查），具體
// 成因交給 cell.blank_note（tools/sbp_gen/stages.py 已經依成因寫不同的
// blank_note，這裡不重複猜）在展開細節時顯示。找不到對應值時不顯示任何
// 標記文字（一律先過這個對照表）。
const COVERAGE_STATE_LABEL={has_evidence:'有證據支持',confirmed_absent:'已確認不用查',unobserved:'還要查',expected_unverified:'還要查',not_applicable:'已確認不用查'};
const COVERAGE_STATE_CLASS={confirmed_absent:'cov-resolved',unobserved:'cov-follow-up',expected_unverified:'cov-follow-up',not_applicable:'cov-resolved'};
const routeClassLabel=routeClass=>ROUTE_CLASS_LABEL[routeClass]||ROUTE_CLASS_FALLBACK;
// converge-blueprint-presentation：畫線樣式只看關係類型與來源。同一事件兩端都有
// 箭頭，其他單向；路線類別（routeClass）只留給走線與分組。
const RELATION_STROKE_WIDTH=1.65;
function relationStyle(rel){
  return {twoWay:rel.type==='same_event',researcher:rel.source==='researcher',inferred:rel.source==='inference'};
}
// marker id 是內部錨點，只分兩種顏色：主要文字色（ink）與研究者色（rsr）。推論線
// 的透明度加在線本身，箭頭跟著一起變淡，不需要第三組 marker。
function relationMarkerDefs(prefix,colours){
  const pair=(slug,fill)=>
    `<marker id="${prefix}-${slug}" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 z" style="fill:${fill}"/></marker>`+
    `<marker id="${prefix}-${slug}-start" markerWidth="14" markerHeight="14" refX="2" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M14,0 L0,7 L14,14 z" style="fill:${fill}"/></marker>`;
  return pair('ink',colours.ink)+pair('rsr',colours.researcher);
}
function relationMarkerAttrs(prefix,style){
  const slug=style.researcher?'rsr':'ink';
  return (style.twoWay?`marker-start="url(#${prefix}-${slug}-start)" `:'')+`marker-end="url(#${prefix}-${slug})"`;
}
const CANVAS_RELATION_COLOURS={ink:'var(--wb-text-primary)',researcher:'var(--wb-claim-researcher)'};
// 下載的 SVG 是獨立檔案，讀不到頁面上的 CSS 變數，改取同一份契約的實際值。
function exportRelationColours(){
  const tokens=(S.workbench&&S.workbench.tokens)||null;
  if(!tokens)throw new Error('工作台介面規則還沒載入，無法匯出藍圖。');
  return {ink:tokens.text.primary,researcher:tokens.claim_source.researcher,opacity:tokens.claim_source['inference-opacity']};
}
function exportRelationAttrs(style,colours){
  return `stroke="${style.researcher?colours.researcher:colours.ink}" stroke-width="${RELATION_STROKE_WIDTH}"${style.inferred?` opacity="${colours.opacity}"`:''}`;
}

let S={step:1,cases:[],selectedCase:null,runs:[],cur:null,report:null,inv:null,previewMode:true,authRequired:false,authMessage:'',
       journeySteps:[],journeyStages:[],journeyBaseline:null,journeyBaselineRun:null,journeyState:null,journeyRecheck:null,
       journeyRecheckOutput:null,journeyRecheckError:null,journeyFlowActive:false,poll:null,lastGenError:null,lastGenErrorCode:null,
       feedbackFailureContext:null,

       viewingVersion:null,versions:[],asIsResearch:null,researchDetail:null,toBeDetail:null,validationDetail:null,researchPoll:null,researchAttempted:false,

       runStatusPoll:null,appliedRunFingerprint:{},runHasUpdate:{},showAllRuns:false,
       previewBannerDismissed:false,proposalStarting:null,proposalLog:null,codingRun:null,codingActive:false,
       journeyChannelMap:null,journeyChannelMapRun:null,
       // Kept for the existing channel-map endpoint compatibility. This

       journeyBranchNotice:null,journeyBranchError:null,journeyBranchEditing:null,

       axialCodingReview:null,axialCodingReviewRun:null,axialCodingError:null,
       axialOpenCard:null,axialPicked:[],axialSelfs:[],axialPairBusy:false,axialPairError:null,
       jtbdCandidatesBusy:false,jtbdCandidatesError:null,
       // embed-persona-matrix-selection-screens: segmentation-axes and

       personaMatrixSegAxes:null,personaMatrixSegAxesRun:null,personaMatrixSegAxesError:null,

       // status turning "ready"). false hides the section entirely rather

       // since the axis-picker section above already makes that obvious.
       personaTargetSectionReady:false,
       personaGenerationBusy:false,personaGenerationError:null,personaGenerationPhase:null,
       // restore-browser-generation-workflow：全新一輪上傳／歷程辨識用的暫存欄位。

// readable-source-location（2026-10-16 P1）：locator 是整理證據時模型寫的自由文字，
// 常帶著研究者讀不懂、也不是這句話位置的片段——整份訪談的頁碼範圍「PDF pp.43–58」、
// 表格欄號「[欄位 3]」、走查表的欄名「Desc／Flow」、毫秒。畫面只顯示看得懂的位置；
// 存檔原樣不動，原始 locator 收在出處行點開的地方（sourceLineHTML）。認不得的形狀
// 原樣顯示，不猜。
function readableLocator(raw){
  const PAGE_RANGE=/^(?:PDF\s*)?pp?\.\s*\d+(?:\s*[–—\-~]\s*\d+)?$/i;
  const readable=part=>{
    const s=part
      .replace(/\[欄位\s*(\d+)\]\s*([^；]*)/g,(_,n,name)=>name.trim()||`表格第 ${n} 欄`)
      .replace(/^欄位\s*\d+\s*[：:]\s*/,'')
      .replace(/^欄位\s*\d+\s*(?=「)/,'')
      .replace(/(\d{1,2}:\d{2}:\d{2}),\d{1,3}/g,'$1');
    const pieces=s.split(/(：|／)/);
    let out='';
    for(let i=0;i<pieces.length;i+=2){
      const text=pieces[i].trim();
      if(!text||text==='Desc'||text==='Flow')continue;
      out+=(out?pieces[i-1]:'')+text;
    }
    return out;
  };
  return String(raw||'').split('；').map(s=>s.trim()).filter(s=>s&&!PAGE_RANGE.test(s)).map(readable).filter(Boolean).join('；');
}
// 溯源畫面的出處行：關著是「誰・看得懂的位置」，點開才是存檔的檔名（只留檔名，不帶
// 資料夾）與原始 locator，一字不改。沒有東西可展開時就是一般文字行，不放空的開關。
// who 只能來自存檔的 role／participant_or_role，呼叫端不得從 AI 描述取名字。
// place：section／頁／段這類結構化位置（SBP provenance 才有），放在可讀位置前面。
function sourceLineHTML({who,locator,source,place,incomplete,fallback}){
  const raw=String(locator||'').trim();

  const summary=[who||fallback||'',[place,shown].filter(Boolean).join('｜')].filter(Boolean).join('・')||(incomplete?'來源資訊不完整':'');
  const note=incomplete?'<span class="source-line-note">來源資訊不完整</span>':'';
  if(!file&&(!raw||raw===shown))return `<span class="axial-quote-role source-line-plain">${esc(summary)}</span>${summary==='來源資訊不完整'?'':note}`;
  return `<details class="source-line"><summary class="axial-quote-role">${esc(summary)}</summary><p class="source-line-detail">${file?`檔案：${esc(file)}<br>`:''}${raw?`位置：${esc(raw)}`:''}</p>${note}</details>`;

// 站②的 JTBD 是一整句話（2026-09-29 研究者裁定：情境→任務→動機→結果）。
// 各格存的是填進句子的那一段；舊產出若自己帶了連接詞就先拿掉，沒有動機的舊檔
// 就不寫「因為」那一段，不替它補。
function jtbdStatement(job){
  const clause=(text,heads,tails)=>{
    let t=String(text||'').trim().replace(/[。，,.]+$/,'');
    heads.forEach(h=>{if(t.startsWith(h))t=t.slice(h.length).trim();});
    tails.forEach(h=>{if(t.endsWith(h))t=t.slice(0,-h.length).trim();});
    return t;
  };
  const situation=clause(job.situation,['當'],['的時候','時']);
  const progress=clause(job.progress,['我想要','我希望','我想'],[]);
  const motivation=clause(job.motivation,['因為'],[]);
  // converge-coding-contracts：舊候選的結果若自帶「可以」等能力詞，組句時拿掉，不重複「所以我可以可以」。
  const outcome=clause(clause(job.outcome,['所以我可以','以便','所以'],[]),['可以','能夠','會想'],[]);
  return `當${situation}時，我想要${progress}，${motivation?`因為${motivation}，`:''}所以我可以${outcome}。`;
}

const CODING_STEPS=[['align','資料整理'],['semantic_segments','語意分段'],['open_coding','開放編碼'],
  ['axial_coding','主軸編碼'],['selective_themes','選擇編碼'],['narrative_jtbd','顧客任務候選']];
const CODING_STEP_STATE_KEYS={semantic_segments:'semantic_segments_state',open_coding:'open_coding_state',
  axial_coding:'axial_coding_state',selective_themes:'selective_themes_state',narrative_jtbd:'narrative_job_candidates_state'};
function codingFailureView(meta){
  meta=meta||{};
  const done=[];let stopped=null;
  for(const [key,label] of CODING_STEPS){
    const complete=key==='align'?((meta.stages||{}).align==='complete'):meta[CODING_STEP_STATE_KEYS[key]]==='complete';
    if(complete){done.push(label);continue;}
    stopped={key,label};break;
  }
  const cancelled=meta.coding_state==='cancelled',interrupted=meta.coding_state==='running';
  const heading=cancelled?'這一輪編碼已取消':interrupted?'這一輪編碼中斷了':stopped?`編碼在「${stopped.label}」這一步停下來了`:'編碼沒有完成';
  const where=stopped?`「${stopped.label}」`:'沒完成的步驟';
  const lines=[
    done.length?`前面已完成的${done.map(label=>`「${label}」`).join('、')}都保留著，重試不會重做。`:'這一輪還沒有已完成的步驟。',
    `按「重試這一輪編碼」會從${where}接著做；重試會再次呼叫模型、使用 CLI 額度。`,
  ];
  return {stopped,done,heading,lines,raw:String(meta.coding_failure||'').trim()};
}
function viewAxialCodingReview(){
  // first-run-research-purpose-with-start-coding：還沒編碼時，研究目的和「開始編碼」
  // 在專案首頁同一個畫面；這裡只指過去，不再放一格沒有按鈕可接的輸入框。
  if(!S.cur&&S.selectedCase)return `<section class="card"><h2>主軸編碼</h2><p class="empty">這個案例還沒有編碼。到專案首頁寫研究目的，再按「開始編碼」。</p><div class="actions"><button class="ghost" id="coding-go-home" type="button">前往專案首頁</button></div></section>`;
  if(!S.cur)return `<section class="card"><h2>主軸編碼</h2><p class="empty">還沒有選定案例，這裡沒有內容。</p></section>`;
  const codingMeta=((S.runs||[]).find(run=>run.name===S.cur)||{}).meta||{};
  if(['failed','cancelled'].includes(codingMeta.coding_state)||(codingMeta.coding_state==='running'&&!S.codingActive)){
    // researcher-readable-coding-failure：用 run.json 的步驟狀態說明，原文只放在技術細節。
    const view=codingFailureView(codingMeta);
    return `<section class="card" data-coding-failure><h2>${esc(view.heading)}</h2>${view.lines.map(line=>`<p class="empty">${esc(line)}</p>`).join('')}${view.raw?`<details class="stage-runner-log"><summary>技術細節</summary><pre>${esc(view.raw)}</pre></details>`:''}<div class="actions"><button class="go" id="retry-fresh-coding" type="button" ${S.proposalStarting?'disabled':''}>重試這一輪編碼</button><button class="ghost" id="report-coding-failure" type="button">回報這個問題</button></div></section>`;
  }
  if(codingMeta.coding_state==='running'&&S.codingActive)return `<section class="card"><h2>正在編碼</h2>${processingIndicatorHTML(S.proposalStarting||'正在整理研究資料','coding-progress',jobElapsedText())}${S.proposalLog&&S.proposalLog.length?`<details class="stage-runner-log"><summary>發生了什麼</summary><pre>${esc(S.proposalLog.slice(-14).join('\n'))}</pre></details>`:''}</section>`;
  const raw=S.axialCodingReview;
  if(!raw)return `<p class="status-line">載入中⋯</p>`;
  if(raw.state==='not_generated')return `<section class="card"><h2>主軸編碼</h2><p class="empty">這個案例還沒有產出主軸編碼。</p></section>`;

  return `${researchPurposeHTML(raw.research_purpose,{note:false})}${jtbdBasisNoticeHTML(raw)}${axialPairPickerHTML(raw)}`;
}

async function saveResearchPurpose(input){
  const text=input.value.trim();
  const current=S.cur?((S.axialCodingReview||{}).research_purpose||{}).text||'':(S.casePurpose||{}).text||'';
  if(text===current)return;
  S.researchPurposeError=null;
  const save=(async()=>{
    try{
      const response=await decisionFetch('research-purpose','/api/research-purpose',{case_id:(S.selectedCase||{}).case_id,run:S.cur||undefined,text});
      const body=await response.json();
      if(!response.ok)throw new Error(body.error||'研究目的沒有存起來。');

    }catch(error){S.researchPurposeError=researcherSafeError(error.message,'研究目的沒有存起來。');render();}

  if(!S.cur)S.casePurposeSaving=save;

}

  return `<section class="card selective-section">${head}${stale}${error}${group('core','核心選擇性編碼主題')}${group('secondary','次要選擇性編碼主題')}</section>`;

async function startSelectiveThemes(){
  S.selectiveError=null;S.selectiveBusy=true;render();
  try{
    const response=await fetch('/api/selective-themes/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run:S.cur,execution:executionPayload()})});
    const body=await response.json();
    if(!response.ok||body.error)throw new Error(body.error||'選擇編碼未能開始。');
  }catch(error){S.selectiveBusy=false;S.selectiveError=researcherSafeError(error.message,'選擇編碼未能開始。');render();return;}
  const poll=setInterval(async()=>{
    let status;try{status=await fetchJobStatus();}catch(_){return;}
    // chain-jtbd-candidates-after-selective: the job may go on to form the
    // candidates; follow it there and reload once so the themes show.
    const candidates=status.kind==='jtbd_candidates_generation';
    if(status.state==='running'&&candidates&&!S.jtbdCandidatesBusy){S.selectiveBusy=false;S.jtbdCandidatesBusy=true;S.axialCodingReviewRun=null;await loadAxialCodingReview();return;}
    if(status.state==='running'&&(candidates||status.kind==='selective_themes_generation')){render();return;}
    clearInterval(poll);S.selectiveBusy=false;S.jtbdCandidatesBusy=false;
    if(status.state==='failed'){
      if(candidates)S.jtbdCandidatesError=researcherPhase(status.phase,'顧客任務候選沒有形成，原本的候選沒有變動。');
      else S.selectiveError=researcherPhase(status.phase,'選擇編碼沒有形成，原本的內容沒有變動。');
    }
    // separate-evidence-pool：在研究依據頁接續形成的 JTBD 候選，只提示前往，不自動換頁。
    else if(candidates&&S.page==='coding')S.basisCandidatesReady=true;
    S.axialCodingReviewRun=null;await loadAxialCodingReview();
  },1500);
}
async function saveSelectiveField(element){
  const field=element.dataset.selectiveEdit,themeId=element.dataset.selectiveTheme;
  const theme=(((S.axialCodingReview||{}).selective_themes||{}).themes||[]).find(t=>t.id===themeId);if(!theme)return;
  const value=field==='key_insights'?element.innerText.split('\n').map(x=>x.trim()).filter(Boolean):element.innerText.trim();
  if(JSON.stringify(value)===JSON.stringify(theme[field]))return;
  S.selectiveError=null;
  try{
    const response=await decisionFetch('selective-themes','/api/selective-themes/edit',{run:S.cur,theme_id:themeId,field,text:value});
    const body=await response.json();
    if(!response.ok||isStaleBasis(body))keepUnsavedInput('selective|'+field+'|'+themeId,value);

}

// 已記錄的顧客任務對應到哪一個選項：以顧客任務四段全文比對候選，沒有候選
// 相符就是研究者自己寫的（select-jtbd-from-selective-synthesis：選定檔不再
// 記敘事與作者；舊檔的 narrative_composed_by 也一樣用內容比對）。
const AXIAL_JOB_FIELDS=['situation','progress','motivation','outcome'];
function axialSameJob(a,b){return AXIAL_JOB_FIELDS.every(key=>String(a[key]||'').trim()===String(b[key]||'').trim());}
function axialRecordedSelections(raw){
  const recorded=((raw&&raw.pair_selection)||{}).selections||[];
  const picked=[],selfs=[];
  recorded.forEach(item=>{
    const index=item.origin==='researcher'?-1:(raw.pair_candidates||[]).findIndex(c=>axialSameJob(c,item));
    if(index>=0&&!picked.includes(index))picked.push(index);
    else selfs.push({situation:item.situation||'',progress:item.progress||'',motivation:item.motivation||'',outcome:item.outcome||'',rationale:item.rationale||''});
  });
  return {picked,selfs};
}
// 關卡列「繼續」要送的整組顧客任務；ready=false 表示還不能按，unchanged=true
// 表示跟已記錄的一樣、只前往下一站不寫檔。自己寫的那則還沒填滿四格時不能按，
// 不替它補、也不默默丟掉。
function axialContinueState(){
  const raw=S.axialCodingReview;
  // 舊方法：只能帶著已記錄的選擇往下看，不寫檔。
  if(raw&&axialLegacyMethod(raw)){
    const recorded=((raw.pair_selection||{}).selections)||[];
    return recorded.length?{ready:true,unchanged:true,items:[]}:{ready:false};
  }
  if(!raw||!raw.pair_candidates)return {ready:false};
  const candidates=raw.pair_candidates;
  const items=[];
  S.axialPicked.slice().sort((a,b)=>a-b).forEach(index=>{
    const c=candidates[index];if(!c)return;
    const item={situation:c.situation,progress:c.progress,motivation:c.motivation||'',outcome:c.outcome,
      rationale:c.rationale||'',selective_refs:c.selective_refs||[],origin:'ai_candidate'};
    if(c.grounded_in)item.grounded_in=c.grounded_in;
    items.push(item);
  });
  // 自己寫的顧客任務不替它宣稱任何選擇主題支持（2026-10-03 研究者裁定）；
  // origin 只記在底層，畫面上不顯示。

function pollPersonaGeneration(){
  S.poll=setInterval(async()=>{
    let status;
    try{status=await fetchJobStatus();}catch(error){return;}
    if(status.state==='done'||status.state==='failed'||status.state==='cancelled'){
      clearInterval(S.poll);S.poll=null;
      // 3.4：把 CLI 自己寫的錯誤原話顯示出來，不是通用失敗字樣；先前那一份 Persona 不動。
      if(status.state==='failed'){endPersonaGeneration((status.failure||{}).what_happened||'persona 產生未完成。');return;}
      if(status.state==='cancelled'){endPersonaGeneration(null);return;}
      // 成功後在同一頁讀回剛產出的那一份候選；讀取不會再觸發生成。讀回之前
      // 處理中的狀態不拿掉，免得「產出 Persona」按鈕在中間又閃出來。

function reviewGateAction(stage,state){
  if(S.fixtureProfile)return S.fixtureProfile.primary_action;
  // rework-persona-station：軸與目標族群在矩陣那裡各自確認；關卡列的「繼續」只負責
  // 往下一站走，要等兩條軸、目標族群、Persona 都已確認（Persona 以目前內容的確認為準），
  // 而且畫面上沒有未確認的改動。
  if(stage.id==='persona-target-selection'){
    const personaConfirmed=((S.personaContent||{}).confirmation||{}).state==='confirmed';
    const ready=!!confirmedPersonaProjection()&&personaAxesMatchConfirmed()&&!personaTargetPickChanged()&&personaConfirmed&&!personaIsStale()&&!personaHmwUnresolved();
    return {...stage.primary_actions[0],consequence:'',available:ready,navigation:false};
  }
  // rework-coding-and-hmw-stations：資料與編碼、HMW 兩站的決定是點卡片做的，
  // 關卡列那顆「繼續」是唯一的確認；可不可按由畫面上的目前選擇決定。
  if(stage.id==='selective-coding'||stage.id==='primary-hmw'){
    const hmw=stage.id==='primary-hmw';
    const state=hmw?hmwContinueState():axialContinueState();
    const busy=hmw?!!S.hmwSubmitBusy:!!S.axialPairBusy;
    // continue-states-ai-cost：選擇有變時這一按會啟動 AI，按鈕與說明照實說；
    // 沒改選只是前往下一站，維持「繼續」、不提額度。動作本身不變。
    const changed=state.ready&&!state.unchanged;
    const label=changed&&!hmw?'繼續，形成 HMW':'繼續';
    const consequence=!changed?'':hmw?'記下這則 HMW 後前往 Persona；還沒有 Persona 分群時會接著分析，使用 CLI 額度。':'會依選定的顧客任務形成 HMW 候選，使用 CLI 額度。';
    return {...stage.primary_actions[0],label,consequence,available:state.ready&&!busy,navigation:false};
  }
  // 框架點的決定現在就在這一站完成，不再導去第二支程式。動作可不可按由各站
  // 自己的畫面決定（例如Persona要先指定主要象限），這裡只給契約上的那顆。
  if(FRAMEWORK_POINT_STAGE_IDS.has(stage.id)){
    return {...stage.primary_actions[0],available:!!state.primary_action_available,navigation:false};
  }
  // rebuild-cjm-as-channel-assignment-step: confirm-journey's own stage is a
  // pointer, same pattern as a framework-point stage -- the real confirm
  // action and its availability logic now live on journey-map (see the
  // journey-map branch below), not here. This stage's job is only to say
  // where that work happens.
  if(stage.id==='confirm-journey'){
    return {...stage.primary_actions[0],available:true,navigation:true};
  }
  // build-journey-candidate-after-persona / confirm-journey-candidate-save-only：
  // 新路徑（還沒有藍圖草稿）的⑤依候選狀態只給一個動作：建立顧客旅程、確認歷程，
  // 或已確認後純導覽的「繼續」。永遠碰不到舊的「確認歷程，產生現況藍圖」。
  if(stage.id==='journey-map'&&S.cur&&(S.journeyChannelMap||{}).build){
    const map=S.journeyChannelMap,build=map.build,gate=(S.workbench||{}).journey_candidate_confirmation||{};

  if(stageId==='project-home'&&S.intake&&S.selectedCase&&!S.cur){loadCasePurpose();loadProviderStatus();}
}

async function fetchBootstrapPayload(runName){
  const query=runName?`?run=${encodeURIComponent(runName)}`:'';
  const response=await fetch(`/api/bootstrap${query}`);
  const d=await response.json();
  if(!response.ok)throw new Error((d&&d.error)||'bootstrap request failed');
  return d;
}
const EXECUTOR_LABELS={codex:'Codex',claude:'Claude Code'};
const PROVIDER_LABELS={codex:'Codex',claude:'Claude Code',openai:'OpenAI API'};
const PROVIDER_CARD_LINES={
  codex:'交由已登入的執行器處理，不需要 API key',
  claude:'交由已登入的執行器處理，不需要 API key',
  openai:'使用你自己的 key，送出工作時才貼，送出後清除'};
function isCliProvider(){return S.provider==='codex'||S.provider==='claude';}
function selectedExecutor(){return isCliProvider()?S.provider:'';}
// provider-setup：研究者明確選了哪一個。沒有選就是 null，畫面與請求都不替他補上任何預設。
// 切換 provider 時 model、effort 與已貼的 key 一律清掉，不把上一個的值帶到另一個。
function applyProvider(provider){
  S.provider=provider||null;
  S.providerStatus=null;
  S.execution={mode:provider==='openai'?'api':'cli',provider:'openai',apiKey:'',executor:isCliProvider()?S.provider:'',codexModel:'',codexEffort:''};
}
function hasApiKey(){return !!String((S.execution||{}).apiKey||'').trim();}
// 只說可觀察的事實：已安裝／已登入／已設定／最近連線測試；不做整體「能不能跑」的判斷。
function providerLayers(){
  const r=S.providerStatus;
  if(!isCliProvider()||!r||r.unavailable)return null;
  return [{key:'installed',label:'已安裝',ok:!!r.installed},{key:'authenticated',label:'已登入',ok:!!r.authenticated},{key:'configured',label:'已設定',ok:!!r.configured}];
}
function layerNote(key){
  const label=PROVIDER_LABELS[S.provider]||'';
  if(key==='installed')return `在這台電腦安裝並登入 ${label}（見 README），或改用其他 AI 執行方式。`;
  if(key==='authenticated')return `請先登入 ${label}，或改用其他 AI 執行方式。`;
  return '這個工作台還沒設定用它執行。請改用 Codex 或 OpenAI API；設定方式見 README。';
}
function formatClock(iso){
  const d=new Date(iso);if(isNaN(d.getTime()))return '';
  const two=n=>String(n).padStart(2,'0');
  return `${two(d.getHours())}:${two(d.getMinutes())}`;
}
function recentCheckInfo(){
  const t=S.providerStatus&&S.providerStatus.recent_test;
  if(!t)return {kind:'none',text:'最近連線測試：尚未測試',cause:null};
  const ok=t.state==='ok';
  return {kind:ok?'ok':'fail',text:`最近連線測試：${formatClock(t.checked_at)} ${ok?'成功':'失敗'}`,cause:t.cause||null};
}
function checkCostNote(){return S.provider==='openai'?'只查詢 key 是否有效，不產生模型費用。':'會送出一個最小請求，可能使用少量額度。';}
// 已知測試不可能成功時不提供這個操作（不是 AI 工作的 gate）；真正的失敗留給事前不知道的情況。
function checkAvailability(){
  if(!S.provider)return {enabled:false,reason:''};
  if(S.providerCheckBusy)return {enabled:false,reason:'正在測試⋯'};
  if(S.provider==='openai')return hasApiKey()?{enabled:true,reason:''}:{enabled:false,reason:'貼上 key 之後才能測試。'};
  const layers=providerLayers();
  if(!layers)return {enabled:false,reason:'正在確認這台電腦的狀態⋯'};
  return layers.every(l=>l.ok)?{enabled:true,reason:''}:{enabled:false,reason:'完成執行方式設定後才能測試。'};
}
function providerSummary(){
  if(!S.provider)return '';
  const label=PROVIDER_LABELS[S.provider];
  if(S.provider==='openai')return `${label}（${hasApiKey()?'API key：已貼上':'API key：尚未貼上'}）`;
  const layers=providerLayers();
  return `${label}（${layers?layers.map(l=>`${l.label} ${l.ok?'✓':'✕'}`).join('、'):'正在確認這台電腦的狀態'}）`;
}
function startCodingNote(){
  const tail='AI 會依研究目的整理資料、形成開放、主軸與選擇編碼，提出顧客任務候選後停下來等你選；會呼叫 AI，使用 CLI 額度或產生 API 費用。';
  if(!S.provider)return `尚未選擇 AI 執行方式，請到右上角設定。${tail}`;
  return `AI 執行方式：${providerSummary()}。${recentCheckInfo().text}。${tail}`;
}
async function loadProviderStatus(){
  if(!S.provider){S.providerStatus=null;}
  else{
    const provider=S.provider,e=S.execution||{};
    const query=new URLSearchParams({provider});
    if(provider!=='openai'){
      if((e.codexModel||'').trim())query.set('model',e.codexModel.trim());
      if(e.codexEffort)query.set('effort',e.codexEffort);
    }
    let status;
    try{
      const response=await fetch(`/api/provider-status?${query}`);
      const body=await response.json();
      status=response.ok&&!body.error?body:{unavailable:true,provider};
    }catch(error){status={unavailable:true,provider};}
    if(S.provider===provider)S.providerStatus=status;
  }
  if(S.shellPanel==='settings')render();
  else if(S.intake&&S.selectedCase&&!S.cur)refreshReviewGate();
}
async function loadProviderSelection(){
  try{
    const response=await fetch('/api/provider-selection');
    const body=await response.json();
    if(response.ok&&PROVIDER_LABELS[body.provider])applyProvider(body.provider);
  }catch(error){/* 讀不到就維持「尚未選擇」 */}
  if(S.provider)loadProviderStatus();else render();
}
async function chooseProvider(provider){
  if(provider===S.provider||!PROVIDER_LABELS[provider])return;
  let body;
  try{
    const response=await fetch('/api/provider-selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider})});
    body=await response.json();
    if(!response.ok||body.error)throw new Error(body.error||'沒有儲存選擇。');
  }catch(error){
    return openFailureDialog({heading:'沒有儲存 AI 執行方式的選擇',what_happened:researcherSafeError(error.message,'沒有儲存選擇。'),why_it_matters:'目前的選擇沒有改變。',next_action:'請確認資料資料夾可以寫入，然後再選一次。'});
  }
  applyProvider(body.provider);render();loadProviderStatus();
}
// OpenAI 測試不論成功或失敗，請求一結束就清掉這次貼上的 key。
function clearPastedKey(){
  S.execution={...(S.execution||{}),apiKey:''};
  const input=$('#execution-api-key');if(input)input.value='';
}
async function runProviderCheck(){
  if(!checkAvailability().enabled)return;
  S.providerCheckBusy=true;refreshProviderCheckControls();
  const payload=executionPayload({retainKey:true});
  let result=null,failure=null;
  try{
    const response=await fetch('/api/provider-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const body=await response.json();
    if(!response.ok||body.error)failure=body.error||'連線測試沒有完成。';else result=body;
  }catch(error){failure=`無法送出連線測試：${error.message}`;}
  finally{clearPastedKey();S.providerCheckBusy=false;}
  if(failure){
    refreshProviderCheckControls();
    return openFailureDialog({heading:'連線測試沒有完成',what_happened:researcherSafeError(failure,'連線測試沒有完成。'),why_it_matters:'這不影響開始 AI 工作。',next_action:'可以稍後再測一次。'});
  }
  if(result.cause&&result.cause.layer){
    await loadProviderStatus();
    return openFailureDialog({heading:'連線測試沒有送出',what_happened:result.cause.what_happened,why_it_matters:result.cause.why_it_matters,next_action:result.cause.next_action});
  }
  if(S.providerStatus&&!S.providerStatus.unavailable)S.providerStatus={...S.providerStatus,recent_test:{state:result.state,checked_at:result.checked_at,cause:result.cause}};
  await loadProviderStatus();
}
function showProviderCheckCause(){
  const c=recentCheckInfo().cause;if(!c)return;
  openFailureDialog({heading:'最近連線測試沒有成功',what_happened:c.what_happened,why_it_matters:c.why_it_matters,next_action:c.next_action,upstream:c.upstream,upstream_source:c.upstream_source});
}
function refreshProviderCheckControls(){
  const keyState=$('#provider-key-state');if(keyState)keyState.textContent=hasApiKey()?'API key：已貼上':'API key：尚未貼上';
  const host=$('#provider-check-section');if(host){host.outerHTML=providerCheckSectionHTML();bindProviderCheckControls();}
}
function bindProviderCheckControls(){
  const button=$('#provider-check-button');if(button)button.onclick=runProviderCheck;
  const cause=$('#provider-check-cause');if(cause)cause.onclick=showProviderCheckCause;
}

function terminologyGroups(query){
  const normalize=value=>String(value||'').normalize('NFKC').trim().toLocaleLowerCase('zh-TW');
  const needle=normalize(query);
  return UI_TERMINOLOGY.map(group=>({...group,entries:group.entries.filter(entry=>
    !needle||normalize([entry.name,...entry.aliases,entry.meaning,entry.note].join(' ')).includes(needle)
  )})).filter(group=>group.entries.length);
}
function terminologyCount(groups){return groups.reduce((total,group)=>total+group.entries.length,0);}
function terminologyResultText(groups){
  const count=terminologyCount(groups),total=terminologyCount(UI_TERMINOLOGY);
  return count?`顯示 ${count} / ${total} 項用語`:'找不到符合的用語，請改用名稱、舊稱或說明中的文字搜尋。';
}
function terminologyGroupsHTML(groups){
  return groups.map(group=>`<section class="terminology-group"><h4>${esc(group.title)}</h4><dl>${group.entries.map(entry=>
    `<div class="terminology-entry"><dt>${esc(entry.name)}</dt><dd>${esc(entry.meaning)}</dd>${entry.aliases.length?`<dd class="terminology-alias">舊稱／英文：${entry.aliases.map(esc).join('、')}</dd>`:''}${entry.note?`<dd class="terminology-note">${esc(entry.note)}</dd>`:''}</div>`
  ).join('')}</dl></section>`).join('');
}
function settingsTerminologyHTML(){
  const groups=terminologyGroups(S.terminologyQuery);
  return `<details class="terminology-reference" id="settings-terminology"${S.terminologyOpen?' open':''}>
    <summary>名詞與操作說明</summary>
    <p class="form-note">統一名稱、意義與舊稱對照。舊稱只供查詢，部分既有畫面仍會出現；原始資料與研究內容保留原文。</p>
    <p class="form-note">AI 起草、資料依據與研究者確認分開辨識；確認不代表推論已驗證。規劃中的入口會另外註明。</p>
    <label for="terminology-search">搜尋用語</label>
    <input id="terminology-search" name="terminology-query" type="search" autocomplete="off" spellcheck="false" placeholder="例如 Channel、矩陣維度、確認…" value="${esc(S.terminologyQuery||'')}" aria-controls="terminology-results" aria-describedby="terminology-result-count">
    <p class="form-note" id="terminology-result-count" role="status" aria-live="polite">${esc(terminologyResultText(groups))}</p>
    <div id="terminology-results">${terminologyGroupsHTML(groups)}</div>
  </details>`;
}
function bindTerminologyReference(){
  const details=$('#settings-terminology'),input=$('#terminology-search');
  if(details)details.ontoggle=()=>{if(details.isConnected)S.terminologyOpen=details.open;};
  if(input)input.oninput=()=>{
    S.terminologyQuery=input.value;
    const groups=terminologyGroups(input.value);
    $('#terminology-result-count').textContent=terminologyResultText(groups);
    $('#terminology-results').innerHTML=terminologyGroupsHTML(groups);
  };
}
function accountSectionHTML(){
  const auth=S.authState||{};
  if(auth.mode==='email'&&auth.authenticated&&auth.user)return `<p class="settings-account">${esc(auth.user.email||auth.user.display_name||'')}</p><button class="text-link" id="settings-logout">登出</button>`;
  return '<p class="settings-account">本機使用，沒有登入帳號</p>';
}
function shellPanelHTML(){
  if(S.shellPanel==='settings')return `<aside class="shell-panel settings-panel" role="dialog" aria-modal="true" aria-labelledby="shell-panel-title">
      <h2 id="shell-panel-title" tabindex="-1">設定</h2>
      ${settingsTerminologyHTML()}
      ${providerSettingsHTML()}
      <div class="actions"><button class="ghost" id="shell-panel-close">關閉</button></div>
    </aside>`;
  // fix-walkthrough-ui-feedback：帳號從設定搬到頂欄自己的按鈕（研究者 2026-09-27）。
  if(S.shellPanel==='account')return `<aside class="shell-panel settings-panel" role="dialog" aria-modal="true" aria-labelledby="shell-panel-title">
      <h2 id="shell-panel-title" tabindex="-1">帳號</h2>
      <section class="settings-section">${accountSectionHTML()}</section>
      <div class="actions"><button class="ghost" id="shell-panel-close">關閉</button></div>
    </aside>`;
  return '';
}
function renderShellPanel(){
  const host=$('#shell-panel-host');if(!host)return;
  const searchFocused=document.activeElement&&document.activeElement.id==='terminology-search';
  const previousPanel=host.querySelector('.shell-panel');
  const scrollTop=S.terminologyOpen&&previousPanel?previousPanel.scrollTop:0;
  const panel=shellPanelHTML();
  host.innerHTML=panel?`<div class="shell-panel-scrim" id="shell-panel-scrim"></div>${panel}`:'';
  if(searchFocused&&$('#terminology-search'))$('#terminology-search').focus({preventScroll:true});
  const nextPanel=host.querySelector('.shell-panel');if(nextPanel&&scrollTop)nextPanel.scrollTop=scrollTop;
}
function openShellPanel(kind,trigger){
  if(kind==='settings')loadProviderStatus();
  S.shellPanel=kind;S.shellPanelTrigger=trigger&&trigger.id||null;
  render();
  const title=$('#shell-panel-title');if(title)title.focus();
}
function closeShellPanel(){
  const trigger=S.shellPanelTrigger;
  S.shellPanel=null;S.shellPanelTrigger=null;render();
  const back=trigger&&document.getElementById(trigger);if(back)back.focus();
}
// 專案卡片的 ⋯ 選單：點選單以外的地方或按 Esc 就收起來。
document.addEventListener('click',event=>{
  if(S.projectMenu&&!event.target.closest('.project-menu,[data-project-more]')){S.projectMenu=null;render();}
  if(S.versionMenu&&!event.target.closest('.version-menu,[data-version-more]')){S.versionMenu=null;render();}
});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  if(S.projectMenu){S.projectMenu=null;render();return;}
  if(S.versionMenu){S.versionMenu=null;render();return;}
  if(S.shellPanel)closeShellPanel();
});
// Replaces S.workbench (and everything derived from it) wholesale rather than
// patching it, so stage gating never keeps describing a run that is no
// longer the one the researcher has open. Returns false when the contract
// itself is unsupported; callers still own navigation after this returns.
// cross-project-state-isolation：研究內容的讀取與研究決定的寫入，都只對發出當時的
// 專案與切換世代生效。換專案（S.cur 改變，或 openExistingRun 重新開啟）就換世代；
// 舊世代的回應一律不交回給呼叫端——後面那段更新畫面的程式根本不會執行，所以不會
// 把上一個專案的內容或錯誤寫進目前畫面。每份可編輯內容的身份（identity）連同產生
// 它的那次讀寫的世代一起記；寫入只拿得到目前世代的身份，伺服器再比對一次。
const STALE_BASIS_MESSAGE='畫面上的內容不是這個專案目前的版本，請重新載入後再做一次。';
// 研究決定寫入的「處理中」：回應屬於舊專案時不會交回，所以換專案時一律放掉，新專案的按鈕不會卡住。
const DECISION_BUSY_FLAGS=['asIsConfirmBusy','personaConfirmBusy','goalBusy','researchReviewBusy','journeyCandidateBusy',
  'axialPairBusy','hmwSubmitBusy','personaHmwKeepBusy','journeyKeepBusy','solutionKeepBusy','irBusy'];
function newProjectScope(){
  S.switchGen=(S.switchGen||0)+1;S.identities={};S.writeChains={};S.unsavedInputs={};
  DECISION_BUSY_FLAGS.forEach(flag=>{S[flag]=false;});S.irJob=null;
}
(function bindCurrentProject(){
  let cur=S.cur;
  Object.defineProperty(S,'cur',{enumerable:true,configurable:true,
    get(){return cur;},
    set(value){if(value!==cur){cur=value;newProjectScope();}}});
})();
function currentScope(){return {run:S.cur,gen:S.switchGen||0};}
function scopeIsCurrent(scope){return !!scope&&scope.run===S.cur&&scope.gen===(S.switchGen||0);}
const _staleReply=()=>new Promise(()=>{});
function rememberIdentity(identity,scope){
  if(identity&&identity.artifact&&scopeIsCurrent(scope))(S.identities||(S.identities={}))[identity.artifact]={identity,scope};
}
// 一次讀取或寫入可能帶回好幾份身份（依操作計算：同一份內容服務好幾種寫入）。
function rememberIdentities(map,scope){Object.values(map||{}).forEach(identity=>rememberIdentity(identity,scope));}
function noSaveText(message){const text=String(message||'').trim();return /^沒有存到/.test(text)?text:'沒有存到：'+text;}
function basisFor(artifact){const entry=(S.identities||{})[artifact];return entry&&scopeIsCurrent(entry.scope)?entry.identity:null;}
// 讀取：回應屬於已經不在畫面上的專案（或舊世代）就不交回。
function scopedFetch(url,opts){
  const scope=currentScope();
  return fetch(url,opts).then(async response=>{
    let data={};try{data=await response.json();}catch(_){}
    if(!scopeIsCurrent(scope))return _staleReply();
    if(response.ok&&data&&data.identities)rememberIdentities(data.identities,scope);
    return {ok:response.ok,status:response.status,data};
  },error=>{if(!scopeIsCurrent(scope))return _staleReply();throw error;});
}
function scopedJSON(url,opts){return scopedFetch(url,opts).then(reply=>reply.data);}
// 不是研究決定、但會改到內容的寫入（確認旅程、移動步驟）：回應過期就不交回，成功就記下新身份。
function scopedPost(url,body){
  return scopedFetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(reply=>_decisionReply(reply.status,reply.data));
}
// 寫入：帶上被操作那份內容的身份；同一份內容的寫入逐筆送出，下一筆用上一筆回來的新身份。
// 被拒（stale_basis）之後，同一份內容排隊中的寫入不再送出，一律提示重新載入。
function decisionFetch(artifact,url,body){
  // 排隊當下就記下專案與世代；輪到時已換專案就取消，舊專案的寫入不會在新專案送出。
  const queued=currentScope();
  const send=()=>{
    if(!scopeIsCurrent(queued))return _staleReply();
    const scope=currentScope(),basis=basisFor(artifact);
    if(!basis)return Promise.resolve(_decisionReply(409,{error:STALE_BASIS_MESSAGE,reason:'stale_basis'}));
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,basis})})
      .then(async response=>{
        let data={};try{data=await response.json();}catch(_){}
        if(!scopeIsCurrent(scope))return _staleReply();
        if(response.ok&&data&&data.identities)rememberIdentities(data.identities,scope);
        if(data&&data.reason==='stale_basis'&&S.identities)delete S.identities[artifact];
        return _decisionReply(response.status,data);
      },error=>{if(!scopeIsCurrent(scope))return _staleReply();throw error;});
  };
  // 共用檔案的寫入（同一個 group）排在同一條佇列，後一筆用前一筆帶回來的新身份。
  const known=basisFor(artifact),queue=(known&&known.group)||artifact;
  const chains=S.writeChains||(S.writeChains={});
  const next=(chains[queue]||Promise.resolve()).then(send,send);
  chains[queue]=next.catch(()=>{});
  return next;
}
function _decisionReply(status,data){return {ok:status>=200&&status<300,status,json:async()=>data};}
function isStaleBasis(data){return !!data&&data.reason==='stale_basis';}
// 被拒時研究者打的字或選的值留在原處、標成沒有存到；只有重新載入或那一格之後存成功才放掉。
function keepUnsavedInput(key,value){(S.unsavedInputs||(S.unsavedInputs={}))[key]=value;}
function dropUnsavedInput(key){if(S.unsavedInputs)delete S.unsavedInputs[key];}
function unsavedInput(key){const box=S.unsavedInputs||{};return Object.prototype.hasOwnProperty.call(box,key)?box[key]:undefined;}
function journeyFieldKey(d){return 'jc|'+[d.jcKind,d.jcStep,d.jcStage,d.jcIndex,d.jcTouchpoint,d.jcChannel,d.jcSolutionId].join('|');}
function reapplyUnsavedInputs(){
  const box=S.unsavedInputs||{};if(!Object.keys(box).length)return;
  const mark=(el,value)=>{
    if(el.tagName==='TEXTAREA'||el.tagName==='INPUT'||el.tagName==='SELECT')el.value=value;
    else el.innerText=Array.isArray(value)?value.join('\n'):value;
    el.setAttribute('aria-invalid','true');el.title='沒有存到';
  };
  document.querySelectorAll('[data-jc-kind]').forEach(el=>{const v=unsavedInput(journeyFieldKey(el.dataset));if(v!==undefined)mark(el,v);});
  document.querySelectorAll('[data-persona-edit]').forEach(el=>{const v=unsavedInput('persona|'+el.dataset.personaEdit+'|'+el.dataset.personaIndex);if(v!==undefined)mark(el,v);});
  document.querySelectorAll('[data-selective-edit]').forEach(el=>{const v=unsavedInput('selective|'+el.dataset.selectiveEdit+'|'+el.dataset.selectiveTheme);if(v!==undefined)mark(el,v);});
  document.querySelectorAll('[data-annotation-satisfaction]').forEach(el=>{const v=unsavedInput('annotation|satisfaction|'+el.dataset.annotationSatisfaction);if(v!==undefined)mark(el,v==null?'':String(v));});
}

function applyBootstrapPayload(d){
  S.cases=d.cases||[];S.runs=d.runs||[];S.ui=d.ui||null;S.workbench=d.workbench||null;
  if(!S.workbench||S.workbench.contract_status!=='supported'){
    S.bootstrapError=S.workbench&&S.workbench.error||{what_happened:'工作台無法載入。',why_it_matters:'目前無法安全顯示研究成果。',next_action:'重新載入'};
    return false;
  }
  const shell=$('#app-shell');shell.dataset.contractStatus='supported';shell.dataset.contractVersion=String(S.workbench.contract_version);
  S.previewLabel=d.preview_label||'完整範例預覽';S.cur=d.preview_run&&d.preview_run.name||null;S.selectedCase=d.preview_case||null;
  if(S.selectedCase){
    const previewJourney=Array.isArray(d.preview_journey)&&d.preview_journey.length?d.preview_journey:S.selectedCase.steps;
    S.journeySteps=previewJourney.map((label,i)=>({id:`S-${String(i+1).padStart(2,'0')}`,label}));S.journeyStages=[];
    S.inv={mode:'preview',n_evidence:'—',covered:[],absent:[]};
  }
  S.step=stageStepById(S.workbench.runtime&&S.workbench.runtime.current_stage||'project-home');
  const toBeRuntime=runtimeStage('review-to-be');
  S.asIsResearch=toBeRuntime&&toBeRuntime.research||null;
  S.mode=(stageContractByStep(S.step).modes||[])[0]||'';
  return true;
}
async function boot(){
  try{
    const authResponse=await fetch('/api/auth/me');
    const authState=await authResponse.json();
    if(authState.mode==='email'&&!authState.authenticated){S.authRequired=true;render();return;}
    if(!authResponse.ok)throw new Error((authState&&authState.error)||'authentication status failed');
    S.authRequired=false;S.authState=authState;
    loadProviderSelection();
    const d=await fetchBootstrapPayload();
    if(!applyBootstrapPayload(d)){render();return;}
    if(new URLSearchParams(location.search).get('print')){await printDeliverableMode(new URLSearchParams(location.search));return;}
    // 右上角的專案選單在每一站都要顯示，所以開站就載入，不是只在專案首頁載。
    // 載完順便把預設落點改成「最新的專案的最新一份」——舊的預設預覽機制指向
    // 一份寫死的 run，那份的前段是空的，研究者一開站就會看到三站沒有內容
    // 卻不知道是選錯了產出（決定十三：專案與版本是研究者選的，不是預設塞的）。
    loadProjects().then(()=>{
      if(S.cur&&!S.previewMode)return;
      const newest=(S.projects||[]).find(p=>(p.versions||[]).length);
      if(!newest){
        // An empty persistent data root has no preview run to select. Leave
        // preview mode explicitly so the first-project intake can be used.
        S.previewMode=false;S.cur=null;S.selectedCase=null;render();return;
      }
      const c=(S.cases||[]).find(x=>x.case_id===newest.case_id);
      if(c){S.previewMode=false;S.selectedCase=c;}
      openExistingRun(newest.versions[0].name);
    });
    // Deep link from tools/workbench/'s gate rows: ?case=<case_id> selects
    // that case the same way clicking it in the case list would, and an
    // optional &stage= additionally jumps to that stage — mirrors the
    // reverse route sbp_review's own framework-point stages already offer.
    const params=new URLSearchParams(location.search);
    const initialCaseId=params.get('case');
    if(initialCaseId){
      const index=(S.cases||[]).findIndex(c=>c.case_id===initialCaseId);
      if(index>=0){
        selectExistingCase(index);
        const initialStage=params.get('stage');
        if(initialStage){const step=stageStepById(initialStage);if(step>0)go(step);}
      }
    }
    render();
    if(S.cur)loadStageContent(stageContractByStep(S.step).id,{skipIfLoaded:true});
    // A page reload does not restart AI. Reattach to the server's active job.
    fetchJobStatus().then(job=>{
      if(job.kind==='journey_generation'&&job.state==='running'&&job.out===S.cur&&!S.poll){
        S.journeyBuildBusy=true;S.journeyBuildJob=job;render();watchJourneyBuildJob();
      }
      if(job.kind==='journey_solutions'&&job.state==='running'&&job.out===S.cur&&!S.poll){
        S.journeySolutionsJob=job;render();watchJourneySolutionsJob();
      }
      if(job.kind==='fresh_coding'&&job.state==='running'&&job.out&&!S.poll){
        S.codingRun=job.out;S.codingActive=true;
        S.proposalStarting=researcherJobMessage(job);S.proposalLog=job.log||null;render();watchCodingJob(job.out);
      }
    }).catch(()=>{});
  }catch(error){
    S.bootstrapError={what_happened:'工作台連線失敗。',why_it_matters:'目前無法確認畫面上的研究成果是否為最新版本。',next_action:'重新載入'};render();
  }
}

/* ══ 圖表導讀（add-chart-guides）══ */
// 2026-10-02 研究者裁定：導讀只屬於輸出層，是 PDF 的讀圖輔助，不在研究工作站上、
// 也不進後續研究。輸出 Persona Matrix＋Persona、顧客旅程圖、服務藍圖時，對話框多一步
// 「導讀預覽」：研究者按「產生導讀」才呼叫 AI、可以直接改，改完下載。畫面不放來源；
// 那些記在 chart_guides.yaml。
const CHART_GUIDE_KIND_BY_DELIVERABLE={client_persona:'persona',client_cjm:'journey',client_blueprint:'blueprint'};
const CHART_GUIDE_TITLES={persona:'Persona Matrix＋Persona',journey:'顧客旅程圖',blueprint:'服務藍圖'};
function chartGuidePointsText(points){return (points||[]).map(point=>`・${point}`).join('\n');}
function chartGuidePointsFrom(text){return String(text||'').split('\n').map(line=>line.replace(/^\s*[・•\-*]\s*/,'').trim()).filter(Boolean);}
async function fetchChartGuide(run,kind){
  const reply=await scopedFetch(`/api/chart-guide?run=${encodeURIComponent(run)}&kind=${kind}`);
  if(!reply.ok)throw new Error(reply.data.error||'讀不到導讀。');
  return reply.data;
}
function exportGuideSectionHTML(preview,kind){
  const data=preview.guides[kind]||{},error=preview.errors[kind];
  const errorHTML=error?`<p class="warn" role="alert">${esc(error)}</p>`:'';
  const head=`<h3>${esc(CHART_GUIDE_TITLES[kind])}</h3>`;
  if(!data.available)return `<section class="export-guide" data-export-guide="${kind}">${head}<p class="chart-guide-note">這一站還沒有可以寫導讀的內容，PDF 只印圖。</p></section>`;
  if(preview.drafting===kind)return `<section class="export-guide" data-export-guide="${kind}">${head}${processingIndicatorHTML('正在產生導讀','export-guide-progress',jobElapsedText('chart_guide_drafting'))}</section>`;
  const busy=preview.drafting?' disabled':'';
  if(!data.guide)return `<section class="export-guide" data-export-guide="${kind}">${head}
    <p class="chart-guide-note">可以在圖表下方加一段導讀，幫讀 PDF 的人看懂這張圖。會用到 CLI 額度；不產生就只印圖。</p>
    <button type="button" class="ghost" data-export-guide-draft="${kind}"${busy}>產生導讀</button>${errorHTML}</section>`;
  const stale=data.stale?`<p class="chart-guide-stale" role="status">內容已調整，導讀尚未更新；不更新或改寫，PDF 只印圖。<button type="button" class="ghost" data-export-guide-draft="${kind}"${busy}>更新導讀</button></p>`:'';
  return `<section class="export-guide" data-export-guide="${kind}">${head}${stale}${errorHTML}
    <div class="chart-guide-summary pc-editable" contenteditable="plaintext-only" spellcheck="false" data-export-guide-block="summary" data-export-guide-kind="${kind}" aria-label="${esc(CHART_GUIDE_TITLES[kind])}導讀摘要">${esc(data.guide.summary||'')}</div>
    <div class="chart-guide-points pc-editable" contenteditable="plaintext-only" spellcheck="false" data-export-guide-block="points" data-export-guide-kind="${kind}" aria-label="${esc(CHART_GUIDE_TITLES[kind])}導讀重點，一行一點">${esc(chartGuidePointsText(data.guide.points))}</div>
  </section>`;
}
// 輸出對話框的導讀預覽。panel 是對話框本身；download 是原本的下載動作。
async function openExportGuidePreview(panel,run,kinds,download){
  const preview={run,kinds,guides:{},errors:{},drafting:null};
  const draw=()=>{
    panel.innerHTML=`<h2 id="modal-title">導讀預覽</h2>
      <p>導讀只用在輸出的 PDF，放在圖表下方，不影響研究內容。可以直接改；改完就照這裡的文字輸出。</p>
      ${kinds.map(kind=>exportGuideSectionHTML(preview,kind)).join('')}
      <p class="feedback-error" id="export-guide-error" hidden></p>
      <div class="actions"><button class="ghost" type="button" data-modal-cancel>取消</button><button class="go" type="button" id="export-guide-download"${preview.drafting?' disabled':''}>下載 PDF</button></div>`;
    panel.querySelector('[data-modal-cancel]').onclick=closeModal;
    panel.querySelectorAll('[data-export-guide-draft]').forEach(button=>button.onclick=()=>draft(button.dataset.exportGuideDraft));
    panel.querySelectorAll('[data-export-guide-block]').forEach(element=>element.onblur=()=>save(element));
    panel.querySelector('#export-guide-download').onclick=async()=>{
      const button=panel.querySelector('#export-guide-download');button.disabled=true;
      const blocks=[...panel.querySelectorAll('[data-export-guide-block]')];
      for(const element of blocks)await save(element,{redraw:false});
      try{await download();}catch(error){const box=panel.querySelector('#export-guide-error');if(box){box.textContent=error.message||'目前無法輸出。';box.hidden=false;}button.disabled=false;}
    };
  };
  const save=async(element,{redraw=true}={})=>{
    const kind=element.dataset.exportGuideKind,block=element.dataset.exportGuideBlock,data=preview.guides[kind];
    if(!data||!data.guide)return;
    const value=block==='points'?chartGuidePointsFrom(element.innerText):element.innerText.trim();
    if(JSON.stringify(value)===JSON.stringify(block==='points'?data.guide.points:data.guide.summary))return;
    try{
      const response=await decisionFetch('chart-guides','/api/chart-guide/edit',{run,kind,block,text:value});
      const body=await response.json();
      if(!response.ok)throw new Error(isStaleBasis(body)?noSaveText(body.error):(body.error||'導讀沒有存起來。'));
      preview.guides[kind]=body;preview.errors[kind]=null;
    }catch(error){preview.errors[kind]=researcherSafeError(error.message,'導讀沒有存起來。');}
    if(redraw)draw();
  };
  const draft=async kind=>{
    preview.errors[kind]=null;preview.drafting=kind;draw();
    try{
      const response=await fetch('/api/chart-guide/draft',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({run,kind,execution:executionPayload()})});
      const body=await response.json();
      if(!response.ok||body.error)throw new Error(body.error||'產生導讀未能開始。');
    }catch(error){preview.drafting=null;preview.errors[kind]=researcherSafeError(error.message,'產生導讀未能開始。');draw();return;}
    const poll=setInterval(async()=>{
      let status;try{status=await fetchJobStatus();}catch(_){return;}
      if(!document.body.contains(panel)){clearInterval(poll);return;}
      if(status.state==='running'&&status.kind==='chart_guide_drafting'){draw();return;}
      clearInterval(poll);preview.drafting=null;
      if(status.state==='failed')preview.errors[kind]=researcherPhase(status.phase,'產生導讀沒有完成，原本的導讀沒有變動。');
      else if(status.state==='waiting_for_model')preview.errors[kind]='已經把提示詞準備好，等模型回覆。';
      try{preview.guides[kind]=await fetchChartGuide(run,kind);}catch(_){}
      draw();
    },1500);
  };
  panel.innerHTML='<h2 id="modal-title">導讀預覽</h2><p>正在讀取導讀⋯</p>';
  for(const kind of kinds){try{preview.guides[kind]=await fetchChartGuide(run,kind);}catch(error){preview.guides[kind]={available:false};}}
  draw();
}

/* ══ 客戶交付物（2026-10-02 研究者裁定）══ */
// 輸出給客戶看的交付物就是畫面上看到的那幾塊，不是證據清單。伺服器用無頭瀏覽器開
// ?print=<項目>&case=<案例>&run=<版本>，這裡照常載入那一站，把要的那一塊複製到

    ready:()=>!!S.codingDeliverableError||(S.codingDeliverableRun===S.cur&&!!S.codingDeliverable),html:printCodingHTML}]},
  jtbd_hmw:{title:'顧客任務與 HMW',parts:[
    {stage:'selective-coding',selector:'.axial-pair-row.is-selected, .axial-self-block.is-selected',heading:'顧客任務（JTBD）',all:true,
      text:el=>el.classList.contains('axial-self-block')?jtbdStatement(S.axialSelfs[Number(el.dataset.axialSelfIndex)]||{}):null},
    {stage:'primary-hmw',selector:'.hmw-candidate.picked, .hmw-self.picked',heading:'設計問題（HMW）',
      text:el=>el.classList.contains('hmw-self')?`我們如何讓${(S.hmwCustom||{}).who||''}的人，能${(S.hmwCustom||{}).goal||''}？`:null}]},
  persona:{title:'Persona Matrix 與 Persona',parts:[

    {guide:'persona'}]},
  cjm:{title:'顧客旅程圖',fit:true,parts:[{stage:'journey-map',selector:'.cjm-table-region',heading:null},{guide:'journey'}]},
  blueprint:{title:'服務藍圖',fit:true,parts:[{stage:'review-as-is',html:()=>{const t=asIsUpstreamStatusText(S.asIsConfirmation);return t?`<section class="print-part"><p class="print-status" data-print-upstream>${esc(t)}</p></section>`:'';},ready:()=>S.asIsBuildLoadedRun===S.cur},{stage:'review-as-is',selector:'.as-is-blueprint',heading:null},{guide:'blueprint'}]},
};
function printWaitUntil(predicate,timeoutMs=45000){
  return new Promise((resolve,reject)=>{
    const started=Date.now();
    const tick=()=>{
      if(predicate())return resolve();
      if(Date.now()-started>timeoutMs)return reject(new Error('這一站的內容沒有載入完成。'));
      setTimeout(tick,250);
    };
    tick();
  });
}
// 編碼交付物（coding-deliverable-three-layers，研究者 2026-10-03 裁定）：開放→主軸→
// 選擇三層的完整研究紀錄。內容一律來自伺服器的同一份輸出模型（XLSX 也用它），這裡
// 只負責排版：開放、主軸用表格，選擇編碼每個主題一塊。O／A／S 編號是輸出內的閱讀編號。
async function loadCodingDeliverable(){

async function printChartGuideHTML(kind){
  const response=await scopedFetch(`/api/chart-guide?run=${encodeURIComponent(S.cur)}&kind=${kind}`);
  if(!response.ok)return '';
  const data=response.data;
  if(!data.guide||data.stale)return '';

  if(!summary&&!points.length)return '';
  return `<section class="print-part print-guide"><h2>導讀</h2>${summary?`<p class="print-guide-summary">${esc(summary)}</p>`:''}${points.length?`<ul class="print-guide-points">${points.map(point=>`<li>${esc(point)}</li>`).join('')}</ul>`:''}</section>`;
