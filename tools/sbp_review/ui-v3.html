<style>
/* workbench-v3-frontend: --wb-* tokens are injected by the server from design-system/desktop-workbench.yaml. */
*{box-sizing:border-box}
html,body{margin:0;background:var(--wb-surface-app);color:var(--wb-text-primary);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:var(--wb-type-body-size);line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--wb-accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--wb-border-subtle)}
.brand{padding:0 10px;display:flex;flex-direction:column;gap:6px}.brand small{color:var(--wb-text-secondary);font-size:12px}
.product-mark{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.045em;line-height:1.3}
.product-mark img{flex:none;width:28px;height:28px}
.app-copyright{margin-top:6px;padding-top:8px;border-top:1px solid var(--wb-border-subtle);color:var(--wb-text-muted);font-size:10.5px;letter-spacing:.04em;user-select:none}
.side-group{display:flex;flex-direction:column;gap:2px}
.side-label{font-size:12px;color:var(--wb-text-secondary);letter-spacing:var(--wb-label-tracking);padding:0 10px;margin-bottom:4px}
.nav{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:start;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px}
.nav:hover{background:var(--wb-surface-hover)}
.nav.on{background:var(--wb-surface-selected)}
.nav .num{font-size:12px;font-weight:600;color:var(--wb-text-secondary);padding-top:2px}
.nav.on .num{color:var(--wb-accent)}
.nav b{display:block;font-size:14px;font-weight:600}
.nav small{display:block;font-size:12px;color:var(--wb-text-secondary);line-height:1.45}
.nav .mark{font-size:12px;padding-top:2px;color:var(--wb-status-confirmed)}
.nav .mark.stale{color:var(--wb-fresh-stale)}
.side-foot{margin-top:auto;border-top:1px solid var(--wb-border-subtle);padding:12px 10px 0;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--wb-text-secondary)}
.linkish{border:0;background:none;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px;font-size:12px;color:var(--wb-text-secondary)}
/* main */
.main{background:var(--wb-surface-work);min-width:0}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--wb-border-subtle);font-size:13px;color:var(--wb-text-secondary)}
.top b{color:var(--wb-text-primary);font-weight:600}
.page{max-width:1480px;margin:0 auto;padding:28px 32px 80px}
/* page head: purpose -> decision (two layers only) */
.head{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid var(--wb-border-subtle)}
.head .purpose{font-size:13px;color:var(--wb-text-secondary);margin:0 0 6px}
.head h1{font-size:26px;line-height:1.35;font-weight:600;margin:0}
.decide{display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:440px;text-align:right}
.decide .consequence{font-size:13px;color:var(--wb-text-secondary)}
.model-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}.model-table th,.model-table td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--wb-border-subtle,#e5e5e5);vertical-align:middle}.model-table .input{max-width:220px}
.decide .blocked{font-size:13px;color:var(--wb-status-pending)}
.primary{background:var(--wb-action-primary);color:var(--wb-action-primary-text);border:0;border-radius:10px;min-height:var(--wb-control-height);padding:0 20px;font-size:15px;font-weight:600}
.primary:hover:not(:disabled){background:var(--wb-accent-hover)}
.secondary{background:var(--wb-action-secondary);border:1px solid var(--wb-border-strong);border-radius:10px;min-height:38px;padding:0 14px;font-size:14px}
.secondary:hover:not(:disabled){background:var(--wb-surface-hover)}
.ghost{border:0;background:none;padding:2px 0;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.done-line{font-size:13px;color:var(--wb-status-confirmed);font-weight:600}
/* notices */
.notice{display:flex;gap:16px;align-items:center;justify-content:space-between;border:1px solid var(--wb-border-warning);background:var(--wb-status-pending-surface);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:14px}
.notice .acts{display:flex;gap:8px;flex:none}
.hint{font-size:13px;color:var(--wb-text-secondary)}
.hint.warn{color:var(--wb-status-pending)}
/* sections */
.sec{background:var(--wb-surface-raised);border:1px solid var(--wb-border-subtle);border-radius:var(--wb-radius-card);padding:20px 22px;margin-bottom:18px}
.sec h2{font-size:18px;font-weight:600;margin:0 0 4px}
.sec .sub{font-size:13px;color:var(--wb-text-secondary);margin:0 0 16px}
.sec.locked{opacity:.55}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600}
.input,.textarea{width:100%;border:1px solid var(--wb-border-strong);border-radius:10px;background:#fff;padding:10px 12px}
.textarea{min-height:96px;resize:vertical;line-height:1.7}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--wb-border-subtle);border-radius:12px;background:#fff;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.pick{cursor:pointer}
.card.pick:hover{background:var(--wb-surface-hover)}
.card.on{border:2px solid var(--wb-border-selected);padding:15px;background:var(--wb-accent-tint)}
.card .kicker{font-size:12px;color:var(--wb-text-secondary);display:flex;justify-content:space-between;gap:8px}
.card h3{font-size:16px;font-weight:600;line-height:1.6;margin:0}
.card p{margin:0;font-size:14px;color:var(--wb-text-secondary)}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tick{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--wb-border-strong);display:inline-grid;place-items:center;font-size:12px;color:transparent;flex:none}
.on .tick{background:var(--wb-accent);border-color:var(--wb-accent);color:#fff}
.radio{border-radius:50%}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--wb-border-subtle);background:var(--wb-surface-app);color:var(--wb-text-secondary);white-space:nowrap}
.tag.inf{color:var(--wb-claim-inference);border-color:var(--wb-claim-inference);border-style:dashed;background:#fff}
.tag.chg{color:var(--wb-to-be);border-color:var(--wb-to-be-border);background:var(--wb-to-be-surface)}
.tag.flag{color:var(--wb-status-pending);border-color:var(--wb-status-pending);background:var(--wb-status-pending-surface)}
.tag.ok{color:var(--wb-status-confirmed)}
/* project / ai */
.providers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.status-list{display:flex;flex-direction:column;gap:4px;font-size:13px}
.status-list span::before{content:'○ ';color:var(--wb-text-muted)}
.status-list span.yes::before{content:'● ';color:var(--wb-status-confirmed)}
.filebox{border:1px dashed var(--wb-border-strong);border-radius:12px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--wb-surface-work)}
/* coding */
.phases{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.phase{display:grid;grid-template-columns:22px 160px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--wb-border-subtle);font-size:14px}
.phase .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--wb-border-strong);margin-top:6px}
.phase.run .dot{border-color:var(--wb-status-processing);background:var(--wb-status-processing)}
.phase.ok .dot{border-color:var(--wb-status-confirmed);background:var(--wb-status-confirmed)}
.phase span{color:var(--wb-text-secondary)}
.bar{height:6px;background:var(--wb-surface-app);border-radius:999px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--wb-status-processing)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--wb-border-subtle);border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:600}
.stat span{font-size:13px;color:var(--wb-text-secondary)}
.theme-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.theme-list div{font-size:14px}.theme-list small{color:var(--wb-text-secondary)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--wb-border-subtle);margin:0 0 16px}
.tab{border:0;background:none;padding:8px 14px 10px;font-size:14px;color:var(--wb-text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;text-align:left}
.tab small{display:block;font-size:12px;font-weight:400}
.tab.on{color:var(--wb-text-primary);font-weight:600;border-bottom-color:var(--wb-accent)}
.oc-list{display:grid;gap:8px;margin-top:10px}
.oc-src{border:1px solid var(--wb-border-subtle);border-radius:10px;overflow:hidden}
.oc-src>summary{cursor:pointer;list-style:revert}
.oc{border-bottom:1px solid var(--wb-border-subtle);padding:10px 14px;font-size:14px}
.oc summary{cursor:pointer}.oc summary span{color:var(--wb-text-secondary);margin-left:8px}
.oc blockquote{margin:8px 0 4px;border-left:3px solid var(--wb-claim-evidence);padding-left:10px;line-height:1.8}
.oc small{color:var(--wb-text-secondary);font-size:12px}
.theme-card{border:1px solid var(--wb-border-subtle);border-radius:12px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}
.theme-card h3{font-size:16px;margin:0}.theme-card p{margin:0;font-size:14px}
.theme-card details{font-size:14px;color:var(--wb-text-secondary)}.theme-card ul{margin:6px 0 0;padding-left:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.theme-card .row{flex-wrap:nowrap;align-items:flex-start;margin-top:auto}
.theme-card .row .ghost{flex:none}
.chip{border:1px solid var(--wb-border-strong);border-radius:999px;background:#fff;padding:2px 10px;font-size:12px}
.chip:hover{background:var(--wb-surface-hover)}
/* fill-in sentence templates (JTBD, HMW) */
.fill{display:grid;gap:10px;margin-top:6px}
.fill.jt{grid-template-columns:repeat(4,minmax(0,1fr))}.fill.hm{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{display:flex;flex-direction:column;gap:4px;border-radius:10px;padding:10px 12px}
.slot label{font-size:13px;font-weight:600}.slot label small{font-weight:400;color:var(--wb-text-secondary);margin-left:4px}
.slot .input{background:#fff}
.preview{margin-top:10px;font-size:15px;line-height:1.9}
.preview .blank{color:var(--wb-text-muted)}
.s-ctx{background:#e2eff4}.s-job{background:#e6eadc}.s-mot{background:#fbe3d8}.s-out{background:#fdf1d2}
.s-who{background:#e2eff4}.s-cond{background:#e6eadc}.s-goal{background:#fdf1d2}
mark{color:inherit;border-radius:3px;padding:0 2px}
.card h3 mark,.card p mark{padding:0 1px}
/* persona */
.persona-wrap{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px}
.axes{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto;padding-right:4px}
.axis{border:1px solid var(--wb-border-subtle);border-radius:10px;padding:10px 12px;background:#fff}
.axis.on{border-color:var(--wb-border-selected);background:var(--wb-accent-tint)}
.axis label{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;cursor:pointer}
.axis input{accent-color:var(--wb-accent);margin-top:5px}
.axis .poles{font-size:12px;color:var(--wb-text-secondary);margin-top:4px;padding-left:22px}
.plot{position:relative;height:440px;margin:28px 8px 34px 34px;border:1px solid var(--wb-border-strong);background:#fff}
.plot::before,.plot::after{content:'';position:absolute;background:var(--wb-border-subtle);pointer-events:none}
.plot::before{left:0;right:0;top:50%;height:1px}.plot::after{top:0;bottom:0;left:50%;width:1px}
.quad{position:absolute;width:50%;height:50%;border:0;background:transparent}
.quad:hover{background:var(--wb-surface-hover)}
.quad.on{background:var(--wb-accent-tint);box-shadow:inset 0 0 0 2px var(--wb-border-selected)}
.quad .qlabel{position:absolute;left:10px;top:8px;font-size:12px;color:var(--wb-text-secondary);text-align:left;max-width:90%}
.dot-p{position:absolute;transform:translate(-50%,-50%);border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;z-index:2;padding:0}
.dot-p i{width:12px;height:12px;border-radius:50%;background:var(--wb-text-primary);border:2px solid #fff;box-shadow:0 0 0 1px var(--wb-text-primary)}
.dot-p b{font-weight:600;background:rgba(255,255,255,.9);padding:0 3px;border-radius:3px}
.ax-x,.ax-y{position:absolute;font-size:12px;color:var(--wb-text-secondary)}
.ax-x{bottom:-26px}.ax-x.l{left:0}.ax-x.r{right:0}
.ax-y{left:-30px;writing-mode:vertical-rl;text-orientation:upright}.ax-y.b{bottom:0}.ax-y.t{top:0}
.ax-title{position:absolute;font-size:12px;font-weight:600}
.persona-card{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px}
.persona-id{background:var(--wb-surface-app);border-radius:12px;padding:18px}
.persona-id h3{font-size:20px;margin:0 0 8px}
.quote{border-left:3px solid var(--wb-claim-evidence);padding:4px 0 4px 12px;font-size:var(--wb-type-quote-size);line-height:var(--wb-type-quote-line);margin:12px 0}
.quote small{display:block;font-size:12px;color:var(--wb-text-secondary)}
.pfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pfield{border:1px solid var(--wb-border-subtle);border-radius:10px;padding:10px 12px}
.pfield.wide{grid-column:1/-1}
.pfield label{font-size:12px;font-weight:600;color:var(--wb-text-secondary);display:flex;justify-content:flex-start;align-items:center;gap:6px}
.pc-icon{display:block;width:18px;height:18px;flex:none;stroke:var(--wb-text-secondary);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pfield textarea{width:100%;border:0;padding:4px 0 0;resize:vertical;min-height:72px;background:transparent;line-height:1.7;font-size:14px}
.pfield textarea:focus{outline:none}
.pfield:focus-within{border-color:var(--wb-border-selected)}
/* journey + delivery + blueprint grids */
.scroll{overflow:auto;border:1px solid var(--wb-border-subtle);border-radius:12px;background:#fff;max-height:78vh}
.grid{display:grid;width:max-content}
.cell{border-right:1px solid var(--wb-border-subtle);border-bottom:1px solid var(--wb-border-subtle);padding:10px;font-size:13px;line-height:1.6;min-width:0;background:#fff}
.cell.lab{position:sticky;left:0;z-index:3;background:var(--wb-surface-app);font-weight:600;font-size:13px}
.cell.lab small{display:block;font-weight:400;color:var(--wb-text-secondary);font-size:12px}
.cell.headrow{position:sticky;top:0;z-index:2;background:var(--wb-surface-app)}
.cell.headrow.lab{z-index:4}
.cell.stage{background:var(--wb-surface-selected);font-size:12px;font-weight:600;color:var(--wb-text-secondary)}
.cell.edit{cursor:pointer;text-align:left;border-top:0;border-left:0;display:block;width:100%}
.cell.edit:hover{background:var(--wb-surface-hover)}
.cell.pain{color:var(--wb-status-pending)}
.cell .empty{color:var(--wb-text-muted)}
.cell.dev{background:var(--wb-accent-tint)}
.stepname b{display:block;font-size:14px;line-height:1.5}
.stepname small{color:var(--wb-text-secondary)}
/* emotion */
.emo-cell{padding:0;position:relative}
.emo-legend{position:relative}
.emo-legend span{position:absolute;left:0;transform:translateY(-50%);font-size:12px;font-weight:400;color:var(--wb-text-secondary);line-height:1;white-space:nowrap}
.emo-legend .emo-title{transform:none;color:var(--wb-text-primary);font-weight:600;font-size:13px}
.emo-key{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:400;color:var(--wb-text-secondary);margin:4px 0 6px}
.emo-point{cursor:ns-resize}
.emo-point:focus{outline:none}
.emo-point:focus circle.halo{stroke-width:3;filter:drop-shadow(0 0 3px var(--wb-accent))}
.cell.core{display:flex;flex-direction:column;gap:6px}
.axial-scope{margin:0 0 4px;color:var(--wb-text-secondary)}
.pflow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:6px 0 10px}
.pflow-col{background:var(--wb-surface-app);border:1px solid var(--wb-border-subtle);border-radius:10px;padding:8px 10px;min-width:0;font-size:13px;line-height:1.55}
.pflow-col>b{color:var(--wb-accent);font-size:12px}
.pflow-col ul{margin:4px 0 0;padding-left:16px;display:grid;gap:6px}
.pflow-arrow{align-self:center;color:var(--wb-text-secondary);font-weight:700}
@media (max-width:700px){.pflow{grid-template-columns:1fr}.pflow-arrow{transform:rotate(90deg);justify-self:center}}
.cell.core-sec{grid-column:1/-1;background:var(--wb-accent-tint);font-weight:600;font-size:14px;padding:10px 12px}
.cell.core-sec .core-sec-in{position:sticky;left:12px;display:inline-block;max-width:calc(100vw - 360px)}
.cell.core-sec .core-sec-in span{font-weight:400;color:var(--wb-text-secondary);font-size:13px;margin-left:8px}
.cell.band-lab{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:13px;font-weight:600;line-height:1.35;cursor:pointer;border:0;border-right:1px solid var(--wb-border-subtle);border-bottom:1px solid var(--wb-border-subtle);font-family:inherit;color:var(--wb-text-primary)}
.cell.band-lab .box{width:14px;height:14px;flex:none;border:1.5px solid var(--wb-border-strong);border-radius:3px;margin-top:1px}
.cell.band-lab.on{color:var(--wb-accent)}
.cell.band-lab.on .box{background:var(--wb-accent);border-color:var(--wb-accent)}
.cell.band-lab small{display:block;font-weight:500;color:var(--wb-text-secondary)}
.cell.band-c{padding:0;position:relative;min-height:40px;cursor:pointer}
.cell.band-c.span::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dotted var(--wb-border-strong)}
.cell.band-c.hit::after{content:"";position:absolute;inset:7px 5px;border-radius:7px;background:var(--wb-surface-app);border:1.5px solid var(--wb-border-strong)}
.cell.band-c.on.span::before{border-top-color:var(--wb-accent)}
.cell.band-c.on.hit::after{background:var(--wb-accent);border-color:var(--wb-accent)}
.band-row:hover .cell.band-c.hit::after{border-color:var(--wb-accent)}
.core-detail{display:grid;gap:4px;min-height:48px;font-size:13.5px}
.core-result b{color:var(--wb-accent)}
.cell.core label{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:600;cursor:pointer}
.cell.core input{accent-color:var(--wb-accent)}
.core-text{border:1px solid transparent;border-radius:8px;background:none;padding:4px;text-align:left;font-size:13px;line-height:1.6}
.core-text:hover{border-color:var(--wb-border-strong);background:var(--wb-surface-hover)}
.core-text .src{display:block;font-size:12px;color:var(--wb-text-secondary);margin-top:2px}
.cell.core.dev{box-shadow:inset 0 0 0 2px var(--wb-border-selected)}
.core-cand{border-top:1px dashed var(--wb-border-strong);padding-top:6px;font-size:13px;line-height:1.6}
.core-card{border:1px solid var(--wb-border-strong);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.6}
.core-card.adopted{border-color:var(--wb-border-selected)}
.core-card .core-problem{margin:0 0 4px;font-weight:600}
.core-card .src{display:block;font-size:12px;color:var(--wb-text-secondary)}
.core-head{font-size:13px;margin:12px 0 4px}
.core-link{display:block;font-size:12px;border-left:3px solid var(--wb-border-selected);padding-left:6px;margin-top:4px}
.core-cand p{margin:2px 0 4px}
.core-cand .src{display:block;font-size:12px;color:var(--wb-text-secondary)}
/* delivery matrix */
.dl-sol{display:flex;flex-direction:column;gap:8px;width:100%}
.dl-sol+.dl-sol{border-top:1px dashed var(--wb-border-strong);padding-top:8px}
.adopt{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-size:13px;font-weight:600;text-align:left}
.dl-edit{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:8px;background:none;padding:6px;font-size:13px;line-height:1.6;min-height:56px}
.dl-edit:hover:not(:disabled){border-color:var(--wb-border-strong);background:var(--wb-surface-hover)}
.dl-edit .src{display:block;font-size:12px;color:var(--wb-text-secondary);margin-top:4px}
/* blueprint */
.node{display:block;width:100%;text-align:left;border:1px solid var(--wb-claim-evidence);border-radius:8px;background:#fff;padding:8px;font-size:13px;line-height:1.5;margin-bottom:6px}
.node.inferred{border-style:dashed;border-color:var(--wb-claim-inference);background:var(--wb-surface-hover)}
.node:hover{box-shadow:0 0 0 2px var(--wb-border-strong)}
.node .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.node .meta .tag{height:20px;font-size:11px;padding:0 6px}
.lane-evidence{background:var(--wb-lane-evidence)}.lane-customer{background:var(--wb-lane-customer)}.lane-front{background:var(--wb-lane-front)}.lane-back{background:var(--wb-lane-back)}.lane-support{background:var(--wb-lane-support)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--wb-text-secondary);margin-top:10px;align-items:center}
.legend .sw{display:inline-block;width:22px;height:14px;border-radius:4px;border:1px solid var(--wb-claim-evidence);vertical-align:-2px;margin-right:6px;background:#fff}
.legend .sw.inf{border-style:dashed;border-color:var(--wb-claim-inference);background:var(--wb-surface-hover)}
.conflicts{display:flex;flex-direction:column;gap:8px}
.conflict{border:1px solid var(--wb-border-warning);border-radius:10px;padding:10px 12px;font-size:14px;background:var(--wb-status-pending-surface)}
.refs{display:flex;flex-direction:column;gap:8px}
.ref{border:1px solid var(--wb-border-subtle);border-radius:10px;padding:10px 12px;font-size:14px}
.ref small{display:block;color:var(--wb-text-secondary)}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(31,37,48,.28);display:flex;justify-content:flex-end;z-index:50}
.drawer{width:min(560px,100vw);height:100vh;background:#fff;display:flex;flex-direction:column}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 24px;border-bottom:1px solid var(--wb-border-subtle)}
.drawer header h2{font-size:18px;margin:0}
.drawer header small{color:var(--wb-text-secondary);font-size:12px}
.drawer .body{overflow:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px}
.close{border:0;background:var(--wb-surface-app);border-radius:8px;width:34px;height:34px;font-size:20px}
.ev{border:1px solid var(--wb-border-subtle);border-radius:10px;padding:12px 14px}
.ev .who{font-size:12px;color:var(--wb-text-secondary)}
.ev blockquote{margin:6px 0 0;border-left:3px solid var(--wb-claim-evidence);padding-left:10px;font-size:15px;line-height:1.8}
.ev details{margin-top:6px;font-size:12px;color:var(--wb-text-secondary)}
.kv{font-size:14px}.kv b{display:block;font-size:12px;color:var(--wb-text-secondary);font-weight:600;margin-bottom:2px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--wb-action-dark);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:60}
@media (max-width:1180px){.cards,.providers{grid-template-columns:1fr 1fr}.persona-wrap,.persona-card{grid-template-columns:1fr}}
@media (max-width:980px){.shell{grid-template-columns:200px minmax(0,1fr)}.page{padding:22px 18px 60px}.head{flex-direction:column;align-items:flex-start}.decide{align-items:flex-start;text-align:left}.stats{grid-template-columns:1fr}}

function readableLocator(raw){
  const PAGE_RANGE=/^(?:PDF\s*)?pp?\.\s*\d+(?:\s*[–—\-~]\s*\d+)?$/i;
  const readable=part=>{
    const s=part
      .replace(/\[欄位\s*(\d+)\]\s*([^；]*)/g,(_,n,name)=>name.trim()||`表格第 ${n} 欄`)
      .replace(/^欄位\s*\d+\s*[：:]\s*/,'')
      .replace(/^欄位\s*\d+\s*(?=「)/,'')
      .replace(/(\d{1,2}:\d{2}:\d{2}),\d{1,3}/g,'$1');
    const pieces=s.split(/(：|／)/);
    let out='';
    for(let i=0;i<pieces.length;i+=2){
      const text=pieces[i].trim();
      if(!text||text==='Desc'||text==='Flow')continue;
      out+=(out?pieces[i-1]:'')+text;
    }
    return out;
  };
  return String(raw||'').split('；').map(s=>s.trim()).filter(s=>s&&!PAGE_RANGE.test(s)).map(readable).filter(Boolean).join('；');
}

  const EVIDENCE_ID_SHAPE='(?:E|AXIS|CAT|CONCERN|HMW|ISS|JOB|JTBD|PERSONA|PROP|QUADRANT|SEG|SRC|STEP)-\\d+';

function reportIdLookup(report){
  const names=new Map(),solutions=new Map(),nodes=new Map();

    const name=((e&&e.provenance)||{}).participant_or_role||(e&&e.role)||'';

  };
  ((report&&report.conflicts)||[]).forEach(c=>(c.evidence||[]).forEach(e=>add(e.id,e)));
  ((report&&report.nodes)||[]).forEach(n=>{
    (n.claims||[]).forEach(cl=>add(cl.evidence_ref,cl));
    const label=String(n.label||'').trim();
    if(n.id&&label&&!nodes.has(n.id))nodes.set(n.id,label);
    (n.anchor_display||[]).forEach(a=>{
      if(a&&a.kind==='selected_solution'&&a.ref&&a.label&&!/^（找不到/.test(a.label)&&!solutions.has(a.ref))solutions.set(a.ref,a.label);
    });
  });
  // 最長的編號先比對，A-re 不會吃掉 A-release 的前半。
  const nodeIds=[...nodes.keys()].sort((a,b)=>b.length-a.length);
  return {speaker:id=>names.get(id)||'',solution:id=>solutions.get(id)||'',node:id=>nodes.get(id)||'',nodeIds};
}

  const prevJob=S.job;S.job=status;jobTick++;
  const running=status.state==='running'||status.state==='waiting_for_model';
  if(running){if(status.kind==='fresh_coding'&&jobTick%4===0){const boot=await getPlain('/api/bootstrap');if(boot&&boot.runs)S.runs=boot.runs}render();return}
  clearInterval(jobTimer);jobTimer=null;
  if(!prevJob||!prevJob.kind)return render();
  await jobFinished(prevJob.kind,status);
 },1000);
}
async function jobFinished(kind,status){
 const failed=status.state==='failed'||status.state==='cancelled';
 if(kind==='fresh_coding'){
  const out=S.codingOut;
  if(!failed&&out){S.codingFailure=null;await loadShell();await openProject(out);toast('編碼完成，可以前往 JTBD。');return}
  const f=status.failure||{};
  const boot=await getPlain('/api/bootstrap');if(boot&&boot.runs)S.runs=boot.runs;
  const m=(S.runs.find(r=>r.name===out)||{}).meta;
  S.codingFailure=f.cause==='coding_runtime_failure'&&m&&['failed','cancelled'].includes(m.coding_state)?{view:codingFailureView(m)}
   :{what_happened:researcherSafeError(f.what_happened,status.state==='cancelled'?'編碼已取消。':'編碼未能完成。'),why_it_matters:f.why_it_matters||'JTBD 候選尚未準備好。',next_action:f.next_action||'排除原因後重試這一輪編碼。'};
  return render();
 }
 const station=JOB_STATION[kind]||S.station;
 if(failed&&!S.jobSilent)S.err[station]=researcherSafeError((status.failure||{}).what_happened||researcherPhase(status.phase,''),`${JOB_LABEL[kind]||'這項工作'}沒有完成，原本的內容沒有變動。`);
 S.jobSilent=false;
 if(S.cur)await openProject(S.cur,{keep:true});else render();
}
// 花額度的工作：一律帶 executionPayload（使用者選的 AI 執行方式）。
async function startJob(url,body,station,kind,{silent=false}={}){
 if(jobRunning())return silent?undefined:toast('另一項 AI 工作還在進行，請等它完成。');
 S.err[station]=null;S.busy['job:'+station]=true;render();
 let r;
 try{const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,execution:payloadFor(station)})});
  r=await response.json();if(!response.ok||r.error)throw new Error(r.error||'沒有開始。')}
 catch(error){S.busy['job:'+station]=false;if(silent)return render();return setErr(station,researcherSafeError(error.message,'這項 AI 工作沒有開始，原本的內容沒有變動。'))}
 S.busy['job:'+station]=false;
 if(r.state==='done'){if(S.cur)await openProject(S.cur,{keep:true});return}
 S.jobSilent=silent;S.job={kind:r.kind||kind,state:'running',phase:r.phase||'正在準備'};render();watchJob();
}

// 畫面上的選擇跟伺服器記錄的不同（研究者改了、還沒按確認）。
function isDirty(id){if(!H||H.loading)return false;if(id==='jtbd')return !!statusOf('jtbd').recorded&&!jtbdState().unchanged;if(id==='hmw')return !!statusOf('hmw').recorded&&!hmwState().unchanged;return false}

function aiReady(){const p=S.provider;if(!p)return false;if(p==='openai')return !!String(S.execution.apiKey||'').trim();const r=S.providerStatus;return !!r&&!!r.installed&&!!r.authenticated&&!!r.configured}
// v3-model-settings：研究者指定的模型與 effort。優先序沿用執行器那一端：研究站設定 → 全域設定 → 執行器預設。
// 推薦只顯示、要研究者自己按「套用」，不在背景替研究者決定。
const MODEL_STATIONS=['coding','jtbd','hmw','persona','cjm','sbp'];
const EFFORT_CHOICES={codex:['low','medium','high','xhigh'],claude:['low','medium','high','xhigh','max']};
// 研究者 2026-10-21 裁定：Persona 暫以 gpt-5.6-luna 為推薦模型（MUJI 模型對照 A），不硬性鎖定。
const RECOMMENDED_STATION_MODELS={codex:{persona:'gpt-5.6-luna'}};
// 設定只留在這一頁（v3 不用瀏覽器儲存）；重新整理後回到執行器預設，各站頁首會照實顯示要求的是哪個模型。
function requestedModel(station){
 const own=String((station&&S.models.stations[station])||'').trim(),all=String(S.models.model||'').trim();
 return own?{model:own,source:'研究站設定'}:all?{model:all,source:'全域設定'}:{model:'',source:'執行器預設'};
}
// 送出的 payload：先照 executionPayload()（與 ui.html 相同），再補上這一站要求的模型與 effort。
function payloadFor(station,options){
 const payload=executionPayload(options);
 if(payload.mode!=='cli')return payload;
 const r=requestedModel(station);
 if(r.model)payload.codex_model=r.model;
 const effort=S.models.effort;
 if(effort&&(EFFORT_CHOICES[S.provider]||[]).includes(effort))payload.codex_effort=effort;
 return payload;
}
function modelLine(station){
 if(!S.provider||S.provider==='openai')return '';
 const r=requestedModel(station),local=(S.provider==='codex'&&S.providerStatus&&S.providerStatus.codex_settings)||{};
 const model=r.model?`${r.model}（${r.source}）`:local.model?`${local.model}（本機 Codex 設定）`:'執行器預設';
 const effort=S.models.effort?S.models.effort:local.model_reasoning_effort?`${local.model_reasoning_effort}（本機 Codex 設定）`:'執行器預設';
 return `要求的模型：${model}・effort：${effort}`;
}

/* ---------- JTBD / HMW choice (same payloads as ui.html continueAxialPair / continuePrimaryHmw) ---------- */
const JOB_FIELDS=['situation','progress','motivation','outcome'];
const jobComplete=j=>JOB_FIELDS.every(k=>String(j[k]||'').trim());
const jobStarted=j=>JOB_FIELDS.some(k=>String(j[k]||'').trim());
function jtbdState(){
 const items=[],raw=(H.raw.axial.pair_candidates)||[];
 H.jtbd.forEach((j,i)=>{if(!S.jtbd.includes(j.id))return;const c=raw[i];
  const item={situation:c.situation,progress:c.progress,motivation:c.motivation||'',outcome:c.outcome,rationale:c.rationale||'',selective_refs:c.selective_refs||[],origin:'ai_candidate'};
  if(c.grounded_in)item.grounded_in=c.grounded_in;items.push(item)});
 H.jtbdOwn.forEach((o,i)=>{if(S.jtbdOwnOn.includes(i))items.push({situation:o.situation,progress:o.progress,motivation:o.motivation||'',outcome:o.outcome,rationale:String(o.rationale||''),selective_refs:[],origin:'researcher'})});
 const cj=S.customJTBD,missing=JT_SLOTS.filter(([k])=>!String(cj[k]||'').trim()).map(x=>x[2]);
 if(jobStarted(cj)){if(!jobComplete(cj))return {ready:false,missing};
  items.push({...Object.fromEntries(JOB_FIELDS.map(k=>[k,String(cj[k]).trim()])),rationale:'',selective_refs:[],origin:'researcher'})}
 const recorded=H.jtbdRecorded||[];
 const unchanged=recorded.length===items.length&&items.every(item=>recorded.some(r=>jobKey(r)===jobKey(item)));
 return {ready:items.length>0,unchanged,items,missing:[]};
}
function hmwState(){
 const recorded=H.hmwRecorded,choice=S.hmw;
 if(!choice)return {ready:false,unchanged:!recorded};
 if(choice==='custom'){
  const statement=hmwCustomStatement(S.customHMW);
  if(!statement)return {ready:false,unchanged:false,missing:HM_SLOTS.filter(([k])=>!String(S.customHMW[k]||'').trim()).map(x=>x[2])};
  const kept=recorded&&!H.hmw.some(x=>x.id===recorded.hmw_id)?recorded:{};
  return {ready:true,unchanged:!!(recorded&&String(recorded.statement||'').trim()===statement&&!H.hmw.some(x=>x.id===recorded.hmw_id)),answer:{statement,rationale:String(kept.rationale||'')}};
 }
 const same=!!(recorded&&recorded.hmw_id===choice);
 return {ready:true,unchanged:same,answer:{hmw_id:choice,rationale:same?String(recorded.rationale||''):''}};
}

function journeyEdit(body,station){

   if(!r.ok||res.error)throw new Error(isStaleBasis(res)?noSaveText(res.error):(res.error||'沒有存到'));

  catch(error){S.err[station||'cjm']='沒有存到：'+researcherSafeError(error.message,'請稍後再試。');return false}

 });
}

async function saveStepDrawer(){

 if(k==='label'){const v=$('#draft').value.trim();if(v&&v!==st.label)edits.push({kind:'step_label',step_id:st.id,value:v})}
 if(k==='core'){const v=$('#draft').value.trim(),cur=st.coreProblem||scrub((st.analysis||{}).problem||'');
  if(v!==cur)edits.push({kind:'core_problem',step_id:st.id,value:v});
  if(v&&!S.develop.includes(st.id))edits.push({kind:'develop_moment',step_id:st.id,value:'true'})}
 if(k==='stage'){const sg=H.journey.stages[+i],v=$('#draft').value.trim();if(v&&v!==sg.label)edits.push({kind:'stage_label',stage_id:sg.id,value:v})}
 if(k==='actions')vals('[data-line="action"]').forEach((v,j)=>{if(v!==String(st.actions[j]||'').trim())edits.push({kind:'action',step_id:st.id,index:j,value:v})});
 if(k==='pain'){vals('[data-line="pain"]').forEach((v,j)=>{if(v!==String(st.pain_points[j]||'').trim())edits.push({kind:'pain_point',step_id:st.id,index:j,value:v})});
  const add=($('#line-new')||{}).value;if(add&&add.trim())edits.push({kind:'pain_point_add',step_id:st.id,value:add.trim()})}
 if(k==='satisfaction'){const ev=vals('[data-line="evaluation"]'),re=vals('[data-line="reason"]');
  ev.forEach((v,j)=>{const old=st.satisfaction[j]||{};if(v!==String(old.evaluation||'').trim()||re[j]!==String(old.reason||'').trim()){if(!!v!==!!re[j])return;edits.push({kind:'satisfaction_item',step_id:st.id,index:j,value:'',evaluation:v,reason:re[j]})}});
  const ne=(($('#sat-new-evaluation')||{}).value||'').trim(),nr=(($('#sat-new-reason')||{}).value||'').trim();

  else if(ne||nr)return toast('新增的滿意度要同時寫評價與理由。')}
 drawer=null;render();
 for(const body of edits){if(!await journeyEdit(body))break}
 if(edits.length&&!S.err.cjm)toast('已儲存。');
}

document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-emo]');if(!g)return;S.emoFocus=+g.dataset.emo;drag={i:+g.dataset.emo,svg:g.ownerSVGElement,g,lv:S.emotion[steps[+g.dataset.emo].id]};g.setPointerCapture?.(e.pointerId);e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const r=drag.svg.getBoundingClientRect();const yy=(e.clientY-r.top)*(EMO_H/r.height);const lv=Math.max(1,Math.min(5,Math.round(5-(yy-EMO_TOP)/EMO_STEP)));
 if(drag.lv!==lv){drag.lv=lv;drag.g.setAttribute('transform',`translate(${drag.i*COLW+COLW/2},${emoY(lv)})`);[...drag.g.children].forEach(c=>{if(c.tagName!=='title')c.remove()});drag.g.insertAdjacentHTML('beforeend',emoPointInner(lv)+(steps[drag.i].divergent?EMO_DIVERGENT_MARK:''));
  const paths=emotionPathData(steps.map((step,index)=>index===drag.i?lv:S.emotion[step.id]));
  drag.svg.querySelector('.emo-curve').setAttribute('d',paths.line);
  drag.g.setAttribute('aria-valuenow',String(lv));
 }});
document.addEventListener('pointerup',()=>{if(!drag)return;const {i,lv}=drag;drag=null;const id=steps[i].id;if(lv&&lv!==S.emotion[id])saveEmotion(id,lv);else render()});

window.addEventListener('resize',()=>requestAnimationFrame(drawAsIsGridLines));
// cjm-core-problem-bands: hovering a band shows its full text below the table without re-rendering.
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('[data-band]');const el=document.getElementById('core-detail');if(!b||!el||S.coreBandHover===b.dataset.band)return;S.coreBandHover=b.dataset.band;el.innerHTML=coreBandDetail(b.dataset.band)});
(async function start(){
 const p=new URLSearchParams(location.hash.slice(1));
 if(STATIONS.some(x=>x.id===p.get('s')))S.station=p.get('s');
 render();
 await loadShell();
 // 進行中的 AI 工作（例如換頁或重新整理前開始的編碼）接著顯示。
 const job=await getPlain('/api/job');
 if(job&&(job.state==='running'||job.state==='waiting_for_model')){S.job=job;if(job.kind==='fresh_coding')S.codingOut=job.out;watchJob()}
 const run=p.get('run');
 if(run&&S.runs.some(r=>r.name===run))return openProject(run);
 const pr=!run&&(S.projects||[]).find(x=>x.case_id===p.get('case')&&!(x.versions||[]).length);
 if(pr)return openNewCase(pr);
 render();
})();
</script>
</body>
